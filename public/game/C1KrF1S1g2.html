<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <script>

(function () {
    'use strict';

    // Every game page loads this file. Keep the audio changes isolated here so
    // the game rules, layout, and other effects do not need to be changed.
    if (window.__lokoGameAudioController) return;
    window.__lokoGameAudioController = true;
    window.__lokoUseExternalBackgroundMusic = true;

    const TRACKS = [
        './musics/snowy.mp3',
        './musics/space.mp3',
        './musics/volcano.mp3'
    ];

    // Background music stays deliberately quiet. It is lowered again while
    // spoken guidance or another audio clip is playing.
    const BACKGROUND_VOLUME = 0.14;
    const DUCKED_VOLUME = 0.035;

    const mediaStates = new WeakMap();
    const speakingMedia = new Set();
    const speakingUtterances = new Set();
    const backgroundFiles = new Set([
        'abnabat.mp3',
        'first1.mp3',
        'forest.mp3',
        'jadooyi forest.mp3',
        'piano (1).mp3',
        'sami.mp3',
        'sami forest.mp3',
        'snowy.mp3',
        'space.mp3',
        'volcano.mp3',
        'z1.mp3'
    ]);

    let backgroundMusic = null;
    let trackIndex = 0;
    let musicStarted = false;
    let startAttemptInProgress = false;

    function getMediaState(media) {
        let state = mediaStates.get(media);
        if (!state) {
            state = {
                isLegacyBackground: false,
                isSilenced: false,
                previousVolume: 1,
                listenersAttached: false
            };
            mediaStates.set(media, state);
        }
        return state;
    }

    function getMediaSource(media) {
        return String(
            media.currentSrc ||
            media.getAttribute('src') ||
            media.src ||
            ''
        ).trim();
    }

    function getFileName(source) {
        if (!source) return '';
        try {
            const url = new URL(source, document.baseURI);
            return decodeURIComponent(url.pathname.split('/').pop() || '').toLowerCase();
        } catch (error) {
            return source.split('/').pop().split('?')[0].toLowerCase();
        }
    }

    function mediaId(media) {
        return String(media.id || media.getAttribute('name') || '').toLowerCase();
    }

    function isBackgroundMedia(media) {
        if (!media || media === backgroundMusic) return false;

        const id = mediaId(media);
        if (/^(bg|bgm|bgmusic|bg-music|theme-music|thememusic)$/.test(id)) return true;
        if (/(guide|voice|speech|narrat|intro|help|verse|tutorial|countdown|sfx|sound)/.test(id)) return false;

        const fileName = getFileName(getMediaSource(media));
        if (backgroundFiles.has(fileName)) return true;

        // Existing background elements are looped. Spoken clips and effects in
        // these games are one-shot, so this also covers dynamically created BGM.
        return media.loop === true && Boolean(fileName);
    }

    function isSpeakingMedia(media) {
        return media && media !== backgroundMusic && !isBackgroundMedia(media);
    }

    function updateBackgroundVolume() {
        if (!backgroundMusic) return;
        backgroundMusic.volume = speakingMedia.size > 0 || speakingUtterances.size > 0
            ? DUCKED_VOLUME
            : BACKGROUND_VOLUME;
    }

    function silenceLegacyBackground(media) {
        const state = getMediaState(media);
        if (!state.isSilenced) {
            state.previousVolume = media.volume;
            state.isSilenced = true;
        }
        if (media.volume !== 0) media.volume = 0;
    }

    function restoreNonBackgroundVolume(media) {
        const state = getMediaState(media);
        if (state.isSilenced) {
            state.isSilenced = false;
            media.volume = state.previousVolume;
        }
    }

    function stopSpeakingMedia(media) {
        speakingMedia.delete(media);
        trackedAudio.delete(media);
        updateBackgroundVolume();
    }

    function startSpeakingMedia(media) {
        if (!isSpeakingMedia(media)) return;
        speakingMedia.add(media);
        updateBackgroundVolume();
    }

    function registerMedia(media) {
        if (!media || !(media instanceof HTMLMediaElement)) return;

        const state = getMediaState(media);
        state.isLegacyBackground = isBackgroundMedia(media);

        if (state.isLegacyBackground) {
            speakingMedia.delete(media);
            silenceLegacyBackground(media);
        } else {
            restoreNonBackgroundVolume(media);
        }

        if (!state.listenersAttached) {
            state.listenersAttached = true;
            media.addEventListener('play', function () {
                registerMedia(media);
                startSpeakingMedia(media);
            });
            media.addEventListener('playing', function () {
                registerMedia(media);
                startSpeakingMedia(media);
            });
            media.addEventListener('pause', function () {
                stopSpeakingMedia(media);
            });
            media.addEventListener('ended', function () {
                stopSpeakingMedia(media);
            });
            media.addEventListener('emptied', function () {
                stopSpeakingMedia(media);
            });
            media.addEventListener('error', function () {
                stopSpeakingMedia(media);
            });
        }
    }

    function scanMediaElements(root) {
        if (!root || !root.querySelectorAll) return;
        if (root instanceof HTMLMediaElement) registerMedia(root);
        root.querySelectorAll('audio, video').forEach(registerMedia);
    }

    function patchMediaPlayback() {
        const mediaPrototype = window.HTMLMediaElement && HTMLMediaElement.prototype;
        if (!mediaPrototype) return;

        const nativePlay = mediaPrototype.play;
        if (typeof nativePlay === 'function' && !nativePlay.__lokoAudioPatched) {
            const patchedPlay = function () {
                registerMedia(this);
                const result = nativePlay.apply(this, arguments);
                if (result && typeof result.then === 'function') {
                    result.then(() => {
                        registerMedia(this);
                        if (!this.paused && !this.ended) startSpeakingMedia(this);
                    }).catch(() => {});
                } else if (!this.paused && !this.ended) {
                    startSpeakingMedia(this);
                }
                return result;
            };
            patchedPlay.__lokoAudioPatched = true;
            mediaPrototype.play = patchedPlay;
        }

        const nativePause = mediaPrototype.pause;
        if (typeof nativePause === 'function' && !nativePause.__lokoAudioPatched) {
            const patchedPause = function () {
                const result = nativePause.apply(this, arguments);
                stopSpeakingMedia(this);
                return result;
            };
            patchedPause.__lokoAudioPatched = true;
            mediaPrototype.pause = patchedPause;
        }

        // The original games sometimes reset their music volume after this
        // controller has silenced it. Keep only their old background track
        // silent without affecting voices or sound effects.
        const volumeDescriptor = Object.getOwnPropertyDescriptor(mediaPrototype, 'volume');
        if (volumeDescriptor && volumeDescriptor.get && volumeDescriptor.set && volumeDescriptor.configurable) {
            const patchedVolume = {
                configurable: true,
                enumerable: volumeDescriptor.enumerable,
                get: volumeDescriptor.get,
                set: function (value) {
                    if (isBackgroundMedia(this)) {
                        const state = getMediaState(this);
                        if (!state.isSilenced) {
                            state.previousVolume = value;
                            state.isSilenced = true;
                        }
                        volumeDescriptor.set.call(this, 0);
                    } else {
                        volumeDescriptor.set.call(this, value);
                    }
                }
            };
            Object.defineProperty(mediaPrototype, 'volume', patchedVolume);
        }
    }

    function attachSpeechSynthesisHooks() {
        const synth = window.speechSynthesis;
        if (!synth || typeof synth.speak !== 'function') return;

        const nativeSpeak = synth.speak.bind(synth);
        const nativeCancel = typeof synth.cancel === 'function' ? synth.cancel.bind(synth) : null;

        const wrappedSpeak = function (utterance) {
            let release = null;
            if (utterance) {
                speakingUtterances.add(utterance);
                updateBackgroundVolume();

                release = function () {
                    speakingUtterances.delete(utterance);
                    updateBackgroundVolume();
                };

                if (typeof utterance.addEventListener === 'function') {
                    utterance.addEventListener('end', release, { once: true });
                    utterance.addEventListener('error', release, { once: true });
                }
            }
            try {
                return nativeSpeak(utterance);
            } catch (error) {
                if (release) release();
                throw error;
            }
        };

        try {
            synth.speak = wrappedSpeak;
        } catch (error) {
            return;
        }

        if (nativeCancel) {
            try {
                synth.cancel = function () {
                    speakingUtterances.clear();
                    updateBackgroundVolume();
                    return nativeCancel();
                };
            } catch (error) {
                // Some browsers expose speechSynthesis.cancel as read-only.
            }
        }
    }

    // ---------------------------------------------------------------------
    // Shared guide controls
    // ---------------------------------------------------------------------
    // The game pages use several different guide/tutor implementations. A
    // small shared layer keeps the user-facing skip action consistent without
    // replacing any of the guides or their audio files.
    const GUIDE_TOKEN_PATTERN = /(?:guide|tutorial|help|narrat|intro|voice)/i;
    const GUIDE_LEAF_PATTERN = /(?:text|char|avatar|bubble|step|header|title|progress|bar|audio|skip|button|nav|dots|icon|img|hint|message|line|description|list)/i;
    const trackedAudio = new Set();
    let guideScanQueued = false;

    function isMediaElement(value) {
        return Boolean(
            value &&
            window.HTMLMediaElement &&
            value instanceof window.HTMLMediaElement
        );
    }

    function patchAudioConstructor() {
        const nativeAudio = window.Audio;
        if (typeof nativeAudio !== 'function' || nativeAudio.__lokoGuideAudioPatched) return;

        const trackedAudioConstructor = function () {
            const media = new nativeAudio(...arguments);
            trackedAudio.add(media);
            registerMedia(media);
            return media;
        };
        trackedAudioConstructor.prototype = nativeAudio.prototype;
        trackedAudioConstructor.__lokoGuideAudioPatched = true;
        try {
            window.Audio = trackedAudioConstructor;
        } catch (error) {
            // Audio can be read-only in a few embedded browsers.
        }
    }

    function stopGuidanceMedia() {
        const candidates = new Set(trackedAudio);
        speakingMedia.forEach(media => candidates.add(media));
        document.querySelectorAll('audio, video').forEach(media => candidates.add(media));

        // A few games keep a dynamically-created guide clip in a named
        // variable rather than in the DOM. Include those conventional names.
        [
            'guideAudio', 'tutorialAudio', 'helpAudio', 'introAudio',
            'voiceAudio', 'activeAudio', 'narratorAudio'
        ].forEach(name => {
            const media = window[name];
            if (isMediaElement(media)) candidates.add(media);
        });

        candidates.forEach(media => {
            if (!isMediaElement(media) || media === backgroundMusic || isBackgroundMedia(media)) return;
            try {
                media.pause();
                media.currentTime = 0;
            } catch (error) {}
            speakingMedia.delete(media);
        });

        const synth = window.speechSynthesis;
        if (synth && typeof synth.cancel === 'function') {
            try { synth.cancel(); } catch (error) {}
        }
        speakingUtterances.clear();
        updateBackgroundVolume();
    }

    function guideElementToken(element) {
        if (!element || element.nodeType !== 1) return '';
        return String(
            (element.id || '') + ' ' +
            (typeof element.className === 'string' ? element.className : '') + ' ' +
            (element.getAttribute('data-role') || '')
        ).toLowerCase();
    }

    function isGuideLikeElement(element) {
        return Boolean(
            element &&
            element.nodeType === 1 &&
            GUIDE_TOKEN_PATTERN.test(guideElementToken(element))
        );
    }

    function isGuideLeafElement(element) {
        return GUIDE_LEAF_PATTERN.test(guideElementToken(element));
    }

    function isMenuLikeElement(element) {
        let current = element;
        while (current && current !== document.body) {
            const token = guideElementToken(current);
            if (/(?:^|[\s_-])(?:menu|landing|home|main)(?:[\s_-]|screen|page|content|area|character|wrapper|view|$)/.test(token)) return true;
            current = current.parentElement;
        }
        return false;
    }

    function isElementVisible(element) {
        if (!element || element.nodeType !== 1) return false;
        let current = element;
        while (current && current.nodeType === 1) {
            if (current.hidden) return false;
            const classList = current.classList;
            if (classList && (
                classList.contains('hidden') ||
                classList.contains('d-none') ||
                classList.contains('is-hidden') ||
                classList.contains('invisible')
            )) return false;
            const stateClasses = classList && (
                classList.contains('active') ||
                classList.contains('show') ||
                classList.contains('open') ||
                classList.contains('visible')
            );
            const token = guideElementToken(current);
            if (
                classList &&
                (classList.contains('screen') || classList.contains('page')) &&
                !stateClasses &&
                !current.style.display
            ) return false;
            if (
                /(?:overlay|modal)/.test(token) &&
                !stateClasses &&
                !current.style.display
            ) return false;
            let style = null;
            try {
                style = window.getComputedStyle(current);
            } catch (error) {
                // A malformed page stylesheet should not disable guide controls.
            }
            if (style && (
                style.display === 'none' ||
                style.visibility === 'hidden'
            )) return false;
            current = current.parentElement;
        }
        return true;
    }

    function guideContainerScore(element) {
        const token = guideElementToken(element);
        let score = 0;
        if (/container|content|card|panel/.test(token)) score += 6;
        if (/wrapper|wrap|box/.test(token)) score += 4;
        if (/modal|overlay/.test(token)) score += 4;
        if (/screen|page|section/.test(token)) score += 1;
        if (isGuideLeafElement(element)) score -= 4;
        return score;
    }

    function isSkipControl(element) {
        if (!element || element.nodeType !== 1) return false;
        const identity = String(
            (element.id || '') + ' ' +
            (typeof element.className === 'string' ? element.className : '') + ' ' +
            (element.getAttribute('aria-label') || '')
        );
        const label = String(element.textContent || '');
        // Completion buttons often say «بزن بریم» too; only treat that
        // wording as a skip control when the control is explicitly named as
        // one. The visible Persian "رد کردن" label is unambiguous.
        return /(?:skip|guide-skip|tutorial-skip)/i.test(identity) || /رد\s*کردن/i.test(label);
    }

    // Button appearance belongs to each game. The shared controller only
    // moves the control below the guide and never injects a global skin.
    function addGuideButtonStyles() {}

    function guideActionScope(container) {
        let current = container;
        while (current && current !== document.body) {
            const token = guideElementToken(current);
            if (current !== container && /screen|page|modal|overlay/.test(token)) return current;
            current = current.parentElement;
        }
        return container;
    }

    function getGuideExitFunction(container) {
        const tokens = [];
        let current = container;
        while (current && current !== document.body) {
            tokens.push(guideElementToken(current));
            current = current.parentElement;
        }
        const token = tokens.join(' ');
        const names = [];
        if (/voice/.test(token)) names.push('skipVoiceGuide', 'finishVoiceGuide');
        if (/tutorial/.test(token)) {
            names.push('skipTutorial', 'tutorialSkip', 'finishTutorial', 'endTutorial', 'hideTutorialScreen');
        }
        if (/help/.test(token)) names.push('skipHelp', 'finishHelp', 'closeHelp', 'hideHelp');
        if (/intro/.test(token)) names.push('skipIntro', 'finishIntro', 'closeIntro');
        names.push('skipGuide', 'finishGuide', 'endGuide', 'closeGuide');

        const uniqueNames = [...new Set(names)];
        for (const name of uniqueNames) {
            if (typeof window[name] === 'function') return window[name];
        }
        return null;
    }

    function findGuideFallbackControl(container, skipButton) {
        const scope = guideActionScope(container);
        const controls = [...scope.querySelectorAll(
            'button, [role="button"], a, input[type="button"], input[type="submit"]'
        )].filter(control => control !== skipButton && isElementVisible(control));
        return controls.find(control => {
            const token = String(
                (control.id || '') + ' ' +
                (typeof control.className === 'string' ? control.className : '') + ' ' +
                (control.getAttribute('aria-label') || '') + ' ' +
                (control.getAttribute('data-go') || '') + ' ' +
                (control.getAttribute('data-back') || '') + ' ' +
                (control.getAttribute('onclick') || '') + ' ' +
                (control.textContent || '')
            );
            return /(?:close|back|home|بازگشت|بستن|فهمیدم|بزن\s*بریم|شروع|ورود)/i.test(token);
        }) || null;
    }

    function hideGuideAsLastResort(container) {
        if (!container) return;
        const scope = guideActionScope(container);
        scope.classList.remove('active', 'show', 'open', 'visible');
        if (/screen|overlay|modal/.test(guideElementToken(scope))) {
            scope.style.setProperty('display', 'none', 'important');
        }
    }

    function invokeGuideExit(button, container, event) {
        const exitFunction = getGuideExitFunction(container);
        if (exitFunction) {
            try {
                exitFunction(event);
                return true;
            } catch (error) {
                console.warn('Guide skip handler failed:', error);
            }
        }

        // Inline handlers can reference lexical variables or page-specific
        // objects (for example oceanGame), so retain them as a fallback.
        if (typeof button.onclick === 'function') {
            try {
                button.onclick.call(button, event);
                return true;
            } catch (error) {}
        }

        const fallback = findGuideFallbackControl(container, button);
        if (fallback) {
            try {
                if (!isElementVisible(fallback)) {
                    fallback.classList.remove('hidden');
                    fallback.style.removeProperty('display');
                }
                fallback.click();
                return true;
            } catch (error) {}
        }

        hideGuideAsLastResort(container);
        return false;
    }

    function bindGuideSkipButton(button, container, injected) {
        if (button.dataset.lokoGuideSkipBound === 'true') {
            if (button.dataset.lokoGuideContainer !== (container.id || '')) {
                button.dataset.lokoGuideContainer = container.id || '';
            }
            return;
        }
        button.dataset.lokoGuideSkipBound = 'true';
        button.dataset.lokoGuideInjected = injected ? 'true' : 'false';
        button.dataset.lokoGuideContainer = container.id || '';
        button.addEventListener('click', function (event) {
            stopGuidanceMedia();

            // Existing controls keep their page's listener when no shared
            // handler is available. Injected controls always need a route.
            const hasRoute = Boolean(getGuideExitFunction(container));
            if (!injected && !hasRoute) return;

            event.preventDefault();
            event.stopImmediatePropagation();
            invokeGuideExit(button, container, event);
        }, true);
    }

    function guideButtonStyleReference(container, skipButton) {
        const scope = guideActionScope(container);
        const controls = [...scope.querySelectorAll(
            'button, [role="button"], input[type="button"], input[type="submit"]'
        )].filter(control => control !== skipButton && !isSkipControl(control));
        const tokenFor = control => String(
            (control.id || '') + ' ' +
            (typeof control.className === 'string' ? control.className : '') + ' ' +
            (control.textContent || '')
        );
        const hasStyledAction = controls.some(control => /(?:next|start|continue|begin|action|cta|primary|secondary|gold|شروع|بعدی|ادامه|بزن\s*بریم|فهمیدم)/i.test(tokenFor(control)));
        const pool = hasStyledAction
            ? controls
            : controls.filter(control => !/(?:close|back|cancel|بستن|بازگشت|لغو)/i.test(tokenFor(control)));
        const score = control => {
            const token = tokenFor(control);
            let value = 0;
            if (/(?:next|start|continue|begin|action|cta|primary|secondary|gold|شروع|بعدی|ادامه|بزن\s*بریم|فهمیدم)/i.test(token)) value += 10;
            if (/(?:btn|button)/i.test(token)) value += 1;
            if (/(?:close|back|cancel|بستن|بازگشت|لغو)/i.test(token)) value -= 5;
            if (isElementVisible(control)) value += 2;
            return value;
        };
        pool.sort((a, b) => score(b) - score(a));
        return pool[0] || null;
    }

    function inheritGuideButtonClasses(button, container) {
        if (button.dataset.lokoGuideClassesCopied === 'true') return;
        const reference = guideButtonStyleReference(container, button);
        if (reference && typeof reference.className === 'string' && reference.className.trim()) {
            button.className = reference.className;
        }
        button.classList.add('loko-guide-skip');
        button.dataset.lokoGuideClassesCopied = 'true';
    }

    function prepareGuideSkipButton(button, container, injected) {
        if (!button || !container) return;
        const wasMoved = button.parentElement !== container;
        if (wasMoved) container.appendChild(button);

        const isInjected = injected || button.dataset.lokoGuideInjected === 'true';
        if (isInjected) inheritGuideButtonClasses(button, container);
        if (!button.classList.contains('loko-guide-skip')) {
            button.classList.add('loko-guide-skip');
        }
        if (button.hasAttribute('hidden')) button.removeAttribute('hidden');
        ['hidden', 'd-none', 'is-hidden', 'invisible'].forEach(className => {
            if (button.classList.contains(className)) button.classList.remove(className);
        });
        if (button.textContent !== '⏭️ رد کردن') button.textContent = '⏭️ رد کردن';
        if (button.getAttribute('aria-label') !== 'رد کردن راهنما') {
            button.setAttribute('aria-label', 'رد کردن راهنما');
        }
        if (button.tagName === 'BUTTON' && !button.getAttribute('type')) {
            button.setAttribute('type', 'button');
        }

        // Remove only inline visibility/position declarations that would keep
        // the control floating over the guide. Backgrounds, borders, fonts,
        // dimensions, and every class-defined style remain untouched.
        if (button.style.getPropertyValue('display') === 'none') {
            button.style.removeProperty('display');
        }
        if (isInjected || wasMoved) {
            ['position', 'inset', 'top', 'right', 'bottom', 'left', 'transform'].forEach(property => {
                if (button.style.getPropertyValue(property)) button.style.removeProperty(property);
            });
        }
        bindGuideSkipButton(button, container, isInjected);
    }

    function elementDepth(element) {
        let depth = 0;
        let current = element;
        while (current && current.parentElement) {
            depth += 1;
            current = current.parentElement;
        }
        return depth;
    }

    function guideGroupingElement(element) {
        let current = element.parentElement;
        while (current && current !== document.body) {
            const token = guideElementToken(current);
            if (isGuideLikeElement(current) && /screen|page|modal|overlay/.test(token)) return current;
            current = current.parentElement;
        }
        return null;
    }

    function guideContainersInDocument() {
        const candidates = [...document.querySelectorAll('body *')].filter(element => {
            if (!isGuideLikeElement(element) || isGuideLeafElement(element)) return false;
            if (/^(button|a|input|audio|video|svg|use|symbol|path|g|circle|line|polyline|polygon)$/i.test(element.tagName)) return false;
            if (element.namespaceURI === 'http://www.w3.org/2000/svg') return false;
            if (isMenuLikeElement(element)) return false;
            return isElementVisible(element);
        });

        // Prefer the semantic guide card/content element over its screen
        // wrapper, then skip descendants once a container has been selected.
        candidates.sort((a, b) => {
            const scoreDifference = guideContainerScore(b) - guideContainerScore(a);
            if (scoreDifference) return scoreDifference;
            return elementDepth(b) - elementDepth(a);
        });
        const selected = [];
        const grouped = new Set();
        candidates.forEach(candidate => {
            if (selected.some(selectedElement => selectedElement.contains(candidate))) return;
            if (selected.some(selectedElement => candidate.contains(selectedElement))) return;
            const group = guideGroupingElement(candidate);
            if (group && grouped.has(group)) return;
            if (group) grouped.add(group);
            selected.push(candidate);
        });
        return selected;
    }

    function guideSkipControlsInScope(container) {
        const scope = guideActionScope(container);
        return [...scope.querySelectorAll(
            'button, [role="button"], input[type="button"], input[type="submit"]'
        )].filter(control => isSkipControl(control) || control.classList.contains('loko-guide-skip'));
    }

    function scanGuideControls() {
        guideScanQueued = false;
        if (!document.body) return;
        addGuideButtonStyles();

        const containers = guideContainersInDocument();
        containers.forEach(container => {
            let skipButton = guideSkipControlsInScope(container)[0];

            if (!skipButton) {
                skipButton = document.createElement('button');
                skipButton.type = 'button';
                skipButton.className = 'loko-guide-skip';
                skipButton.textContent = '⏭️ رد کردن';
                container.appendChild(skipButton);
                prepareGuideSkipButton(skipButton, container, true);
            } else {
                prepareGuideSkipButton(skipButton, container, false);
            }

            // A previous scan may have created a button in a nested helper
            // wrapper before the semantic guide container became visible.
            // Keep one shared control per active guide scope and remove only
            // buttons created by this controller, never page-owned controls.
            guideSkipControlsInScope(container).forEach(control => {
                if (
                    control !== skipButton &&
                    control.dataset.lokoGuideInjected === 'true'
                ) control.remove();
            });
        });
    }

    function scheduleGuideScan() {
        if (guideScanQueued) return;
        guideScanQueued = true;
        const schedule = window.requestAnimationFrame || function (callback) {
            return window.setTimeout(callback, 0);
        };
        schedule(scanGuideControls);
    }

    function nextTrack() {
        if (!backgroundMusic) return;
        trackIndex = (trackIndex + 1) % TRACKS.length;
        backgroundMusic.src = TRACKS[trackIndex];
        backgroundMusic.load();
        updateBackgroundVolume();
        if (musicStarted) backgroundMusic.play().catch(() => {});
    }

    function createBackgroundMusic() {
        if (backgroundMusic) return backgroundMusic;

        backgroundMusic = document.createElement('audio');
        backgroundMusic.preload = 'auto';
        backgroundMusic.loop = false;
        backgroundMusic.setAttribute('aria-hidden', 'true');
        backgroundMusic.setAttribute('playsinline', '');
        backgroundMusic.dataset.lokoBackgroundMusic = 'true';
        backgroundMusic.src = TRACKS[trackIndex];
        backgroundMusic.addEventListener('ended', nextTrack);
        backgroundMusic.addEventListener('error', nextTrack);
        document.body.appendChild(backgroundMusic);
        updateBackgroundVolume();
        return backgroundMusic;
    }

    function startBackgroundMusic() {
        if (musicStarted || startAttemptInProgress) return;
        startAttemptInProgress = true;
        const music = createBackgroundMusic();
        let playResult;
        try {
            playResult = music.play();
        } catch (error) {
            startAttemptInProgress = false;
            return;
        }

        if (playResult && typeof playResult.then === 'function') {
            playResult.then(() => {
                musicStarted = true;
                startAttemptInProgress = false;
                removeUnlockListeners();
                updateBackgroundVolume();
            }).catch(() => {
                startAttemptInProgress = false;
            });
        } else {
            musicStarted = true;
            startAttemptInProgress = false;
            removeUnlockListeners();
            updateBackgroundVolume();
        }
    }

    function installUnlockListeners() {
        ['pointerdown', 'touchstart', 'keydown', 'click'].forEach(function (eventName) {
            document.addEventListener(eventName, startBackgroundMusic, { capture: true, passive: true });
        });
    }

    function removeUnlockListeners() {
        ['pointerdown', 'touchstart', 'keydown', 'click'].forEach(function (eventName) {
            document.removeEventListener(eventName, startBackgroundMusic, true);
        });
    }

    function init() {
        patchMediaPlayback();
        patchAudioConstructor();
        attachSpeechSynthesisHooks();
        scanMediaElements(document);
        scheduleGuideScan();

        const observer = new MutationObserver(function (mutations) {
            mutations.forEach(function (mutation) {
                mutation.addedNodes.forEach(function (node) {
                    scanMediaElements(node);
                });
                if (mutation.type === 'attributes') registerMedia(mutation.target);
            });
            scheduleGuideScan();
        });
        observer.observe(document.documentElement, {
            childList: true,
            subtree: true,
            attributes: true,
            attributeFilter: ['id', 'name', 'src', 'loop', 'class', 'style', 'hidden']
        });

        installUnlockListeners();
        window.addEventListener('pagehide', function () {
            if (backgroundMusic) backgroundMusic.pause();
        });
        window.addEventListener('pageshow', function () {
            if (musicStarted && backgroundMusic) backgroundMusic.play().catch(() => {});
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init, { once: true });
    } else {
        init();
    }
}());

    <title>قطار اعداد فضایی</title>
    <style>
        /* === فونت‌ها === */

        .coin-display {

        /* === هدر بازی === */
        .game-header {

        /* === محیط بازی (قطار) === */

        .wagon {
            width: 80px;
            height: 80px;

        .wagon.dragging {

        .wagon.drag-over {

        /* === شمارش معکوس === */
        .countdown-overlay {
            position: fixed;
            top: 0;
            left: 0;

        .countdown-text {

        @keyframes pop {
            0% {
                transform: scale(0);

        /* === صفحه پایان === */

 }

                <div class="header-stat glass">
                    <span>❌</span><span id="errors">۰</span>
                </div>
                <div class="header-stat glass">
                    <span>مرحله:</span><span id="level">۱</span>
                </div>
                <button class="btn btn-primary" style="padding: 5px 10px; font-size: 0.9rem;"
                    onclick="goHome()">منو</button>
            </div>

            <div class="game-wrapper">
                <div class="train-track" id="train-track"></div>
            </div>
        </div>

        <!-- صفحه پایان -->
        <div id="screen-complete" class="screen">
            <div class="end-card glass">
                <h2 id="end-title">آفرین!</h2>
                <div class="stars">
                    <div class="star" id="star1">⭐</div>
                    <div class="star" id="star2">⭐</div>
                    <div class="star" id="star3">⭐</div>
                </div>
                <div class="end-stats">
                    <div>زمان: <span id="final-time">۰۰:۰۰</span></div>
                    <div>خطا: <span id="final-errors">۰</span></div>
                </div>
                <div class="reward-msg" id="reward-msg"></div>
                <div class="end-btns">
                    <button class="btn btn-success" id="btn-next" onclick="nextLevel()">مرحله بعد</button>
                    <button class="btn btn-primary" onclick="retryLevel()">تلاش مجدد</button>
                    <button class="btn" onclick="goHome()">بازگشت به منو</button>
                </div>
            </div>
        </div>

        <!-- صفحه فروشگاه -->
        <div id="screen-shop" class="screen">
            <h1 class="menu-title" style="font-size: 2rem;">فروشگاه تم‌ها</h1>
            <div class="shop-grid" id="shop-grid"></div>
            <button class="btn" style="margin-top: 20px;" onclick="goHome()">بازگشت</button>
        </div>

        <!-- اورلی شمارش معکوس -->
        <div class="countdown-overlay" id="countdown-overlay">
            <span class="countdown-text" id="countdown-text">۳</span>
        </div>

        <!-- المان متحرک سکه -->
        <div class="float-coin" id="float-coin"></div>

        <!-- پیام توست -->
        <div class="toast" id="toast">سکه کافی نداری!</div>

        <!-- بخش راهنما -->
        <div id="helpOverlay">
            <div class="help-container">
                <button class="help-close-btn" id="helpCloseBtn">✕</button>

                <div class="help-image-wrapper">
                    <img id="helpImage" src="./icons/gamerhi.png" alt="راهنمای بازی" onerror="this.style.display='none'">
                </div>

                <div class="help-text-container">
                    <p class="help-text" id="helpText"></p>
                </div>

                <div class="help-progress-wrapper">
                    <div class="help-progress-bar" id="helpProgressBar"></div>
                </div>

                <div style="text-align: center;">
                    <button class="help-start-btn" id="helpStartBtn">
                        🚀 شروع بازی
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // === مدیریت صدا (Web Audio API) ===
        const SoundManager = {
            audioCtx: null,
            init() {
                if (!this.audioCtx) this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            },
            playTone(freq, duration, type = 'sine', volume = 0.2) {
                this.init();
                const osc = this.audioCtx.createOscillator();
                const gain = this.audioCtx.createGain();
                osc.connect(gain);
                gain.connect(this.audioCtx.destination);
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(volume, this.audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + duration);
                osc.start();
                osc.stop(this.audioCtx.currentTime + duration);
            },
            playClick() { this.playTone(800, 0.05, 'square', 0.1); },
            playSuccess() {
                this.playTone(523.25, 0.1);
                setTimeout(() => this.playTone(659.25, 0.1), 100);
                setTimeout(() => this.playTone(783.99, 0.2), 200);
            },
            playFail() { this.playTone(150, 0.3, 'sawtooth', 0.2); },
            playWin() {
                const notes = [523, 659, 783, 1046];
                notes.forEach((n, i) => setTimeout(() => this.playTone(n, 0.2, 'triangle', 0.3), i * 150));
            }
        };

        // === متغیرهای بازی و State ===
        let state = {
            coins: 0,
            level: 1,
            maxLevel: 3,
            errors: 0,
            correctMoves: 0,
            totalMoves: 0,
            startTime: null,
            timerInterval: null,
            currentTheme: 'default',
            shopOwned: ['default'],
            helpShown: false
        };

        const themes = {
            'default': { name: 'فضایی پیش‌فرض', cost: 0, bg: 'linear-gradient(to bottom, #0f0c29, #302b63)' },
            'neon_pink': { name: 'صورتی نئونی', cost: 5, bg: 'linear-gradient(to bottom, #2b0b3f, #ff00a0)' },
            'neon_green': { name: 'سبز نئونی', cost: 10, bg: 'linear-gradient(to bottom, #0b3d2b, #00ff9d)' },
            'sunset': { name: 'غروب نئونی', cost: 15, bg: 'linear-gradient(to bottom, #1a0500, #ff5e00, #ff00a0)' }
        };

        // === فارسی‌سازی اعداد ===
        function toPersian(n) {
            return n.toString().replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
        }

        // === مدیریت صفحات ===
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            SoundManager.playClick();
            if (id === 'screen-menu' || id === 'screen-shop') updateCoinDisplay();
        }

        function goHome() {
            clearInterval(state.timerInterval);
            showScreen('screen-menu');
        }

        // === سیستم اقتصاد ===
        function loadState() {
            const saved = localStorage.getItem('spaceTrainState');
            if (saved) {
                const parsed = JSON.parse(saved);
                state.coins = parsed.coins || 0;
                state.currentTheme = parsed.currentTheme || 'default';
                state.shopOwned = parsed.shopOwned || ['default'];
                state.helpShown = parsed.helpShown || false;
            }
            applyTheme(state.currentTheme);
            updateCoinDisplay();
        }

        function saveState() {
            localStorage.setItem('spaceTrainState', JSON.stringify({
                coins: state.coins,
                currentTheme: state.currentTheme,
                shopOwned: state.shopOwned,
                helpShown: state.helpShown
            }));
        }

        function updateCoinDisplay() {
            document.getElementById('coin-count').textContent = toPersian(state.coins);
        }

        // === فروشگاه ===
        function renderShop() {
            const grid = document.getElementById('shop-grid');
            grid.innerHTML = '';
            for (const [key, theme] of Object.entries(themes)) {
                const item = document.createElement('div');
                item.className = 'shop-item glass';
                if (state.shopOwned.includes(key)) item.classList.add('owned');
                if (state.currentTheme === key) item.classList.add('active');

                item.innerHTML = `
                    <div class="theme-preview" style="background: ${theme.bg}"></div>
                    <h3>${theme.name}</h3>
                    ${state.shopOwned.includes(key) ?
                        `<button class="btn btn-success" style="width:100%; padding:5px;" onclick="selectTheme('${key}')">${state.currentTheme === key ? 'فعال' : 'انتخاب'}</button>` :
                        `<button class="btn btn-gold" style="width:100%; padding:5px;" onclick="buyTheme('${key}', ${theme.cost})">${toPersian(theme.cost)} سکه</button>`
                    }
                `;
                grid.appendChild(item);
            }
        }

        function buyTheme(key, cost) {
            SoundManager.playClick();
            if (state.coins < cost) {
                showToast('سکه کافی نداری!');
                SoundManager.playFail();
                return;
            }
            state.coins -= cost;
            state.shopOwned.push(key);
            state.currentTheme = key;
            saveState();
            applyTheme(key);
            updateCoinDisplay();
            renderShop();
            SoundManager.playSuccess();
        }

        function selectTheme(key) {
            SoundManager.playClick();
            state.currentTheme = key;
            saveState();
            applyTheme(key);
            renderShop();
        }

        function applyTheme(key) {
            document.body.style.background = themes[key].bg;
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        // === سیستم راهنما ===
        const HelpManager = {
            isOpen: false,
            isComplete: false,
            audio: null,
            bgAudio: null,
            interval: null,
            startTime: null,
            totalDuration: 17,
            helpData: [
                { start: 0, end: 4, text: 'سلام من پیکسل هستم دوست جدید تو در این بازی' },
                { start: 4, end: 8, text: 'در این بازی باید واگن های نا مرتب رو مرتب کنی' },
                { start: 8, end: 15, text: 'از واگن های پایین باید بکشی و به واگن خودش بچسبونی تا واگن ها درست بشن و قطار شروع به کار کنه' },
                { start: 15, end: 17, text: 'موفق باشی دوست من' }
            ],

            get elements() {
                return {
                    overlay: document.getElementById('helpOverlay'),
                    text: document.getElementById('helpText'),
                    progress: document.getElementById('helpProgressBar'),
                    closeBtn: document.getElementById('helpCloseBtn'),
                    startBtn: document.getElementById('helpStartBtn'),
                    image: document.getElementById('helpImage')
                };
            },

            playBackgroundMusic() {
                if (this.bgAudio) {
                    this.bgAudio.pause();
                    this.bgAudio.currentTime = 0;
                }
                this.bgAudio = new Audio('musics/z1.mp3');
                this.bgAudio.loop = true;
                this.bgAudio.volume = 0.4;
                this.bgAudio.play().catch(err => {
                    console.log('پخش موسیقی پس‌زمینه با مشکل مواجه شد:', err);
                });
            },

            stopBackgroundMusic() {
                if (this.bgAudio) {
                    this.bgAudio.pause();
                    this.bgAudio.currentTime = 0;
                    this.bgAudio = null;
                }
            },

            updateText(currentTime) {
                const el = this.elements;
                let found = false;

                for (let i = 0; i < this.helpData.length; i++) {
                    const item = this.helpData[i];
                    if (currentTime >= item.start && currentTime < item.end) {
                        el.text.textContent = item.text;
                        el.text.style.opacity = '1';
                        found = true;
                        break;
                    }
                }

                if (!found && this.helpData.length > 0) {
                    if (currentTime < this.helpData[0].start) {
                        el.text.textContent = this.helpData[0].text;
                    } else if (currentTime >= this.helpData[this.helpData.length - 1].end) {
                        el.text.textContent = this.helpData[this.helpData.length - 1].text;
                        if (!this.isComplete) {
                            this.completeHelp();
                        }
                    } else {
                        for (let i = this.helpData.length - 1; i >= 0; i--) {
                            if (currentTime >= this.helpData[i].start) {
                                el.text.textContent = this.helpData[i].text;
                                break;
                            }
                        }
                    }
                }
            },

            completeHelp() {
                if (this.isComplete) return;
                this.isComplete = true;

                const el = this.elements;
                el.startBtn.style.display = 'inline-block';
                el.closeBtn.style.display = 'flex';

                if (this.audio) {
                    this.audio.pause();
                    this.audio.currentTime = 0;
                    this.audio = null;
                }

                this.playBackgroundMusic();

                if (this.interval) {
                    clearInterval(this.interval);
                    this.interval = null;
                }

                state.helpShown = true;
                saveState();
            },

            closeHelp() {
                if (!this.isOpen) return;

                this.isOpen = false;
                const el = this.elements;
                el.overlay.classList.remove('active');

                if (this.audio) {
                    this.audio.pause();
                    this.audio.currentTime = 0;
                    this.audio = null;
                }
                this.stopBackgroundMusic();

                if (this.interval) {
                    clearInterval(this.interval);
                    this.interval = null;
                }

                if (window._startGameAfterHelp) {
                    window._startGameAfterHelp = false;
                    state.level = 1;
                    state.errors = 0;
                    state.correctMoves = 0;
                    startLevel();
                }
            },

            startHelp(shouldStartGame = false) {
                if (this.isOpen) return;

                this.isOpen = true;
                this.isComplete = false;
                window._startGameAfterHelp = shouldStartGame;

                const el = this.elements;

                el.overlay.classList.add('active');
                el.text.style.opacity = '1';
                el.startBtn.style.display = 'none';
                el.closeBtn.style.display = 'none';
                el.progress.style.width = '0%';
                el.text.textContent = 'سلام من پیکسل هستم دوست جدید تو در این بازی';

                this.stopBackgroundMusic();

                if (this.audio) {
                    this.audio.pause();
                    this.audio.currentTime = 0;
                }

                this.audio = new Audio('musics/2.mp3');
                this.audio.volume = 0.6;
                this.audio.play().catch(err => {
                    console.log('پخش موسیقی راهنما با مشکل مواجه شد:', err);
                });

                this.startTime = Date.now();

                if (this.interval) {
                    clearInterval(this.interval);
                }

                this.interval = setInterval(() => {
                    const elapsed = (Date.now() - this.startTime) / 1000;
                    const progress = Math.min((elapsed / this.totalDuration) * 100, 100);
                    el.progress.style.width = progress + '%';
                    this.updateText(elapsed);

                    if (elapsed >= this.totalDuration) {
                        if (!this.isComplete) {
                            this.completeHelp();
                        }
                    }
                }, 100);
            }
        };

        window.startGame = function () {
            if (state.helpShown) {
                state.level = 1;
                state.errors = 0;
                state.correctMoves = 0;
                startLevel();
                return;
            }
            HelpManager.startHelp(true);
        };

        window.openHelp = function () {
            HelpManager.startHelp(false);
        };

        function skipHelp() {
            HelpManager.closeHelp();
        }

        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('helpCloseBtn').addEventListener('click', function () {
                HelpManager.closeHelp();
            });

            document.getElementById('helpStartBtn').addEventListener('click', function () {
                window._startGameAfterHelp = true;
                HelpManager.closeHelp();
            });
        });

        function startLevel() {
            showScreen('screen-game');
            document.getElementById('level').textContent = toPersian(state.level);
            document.getElementById('errors').textContent = toPersian(state.errors);

            startCountdown(() => {
                generateWagons();
                state.startTime = Date.now();
                state.timerInterval = setInterval(updateTimer, 1000);
            });
        }

        function startCountdown(callback) {
            const overlay = document.getElementById('countdown-overlay');
            const text = document.getElementById('countdown-text');
            overlay.style.display = 'flex';
            let count = 3;

            const tick = () => {
                if (count > 0) {
                    text.textContent = toPersian(count);
                    text.style.animation = 'none';
                    void text.offsetWidth;
                    text.style.animation = 'pop 0.8s ease-out';
                    SoundManager.playClick();
                    count--;
                    setTimeout(tick, 800);
                } else {
                    text.textContent = 'شروع!';
                    SoundManager.playSuccess();
                    setTimeout(() => {
                        overlay.style.display = 'none';
                        callback();
                    }, 800);
                }
            };
            tick();
        }

        function generateWagons() {
            const track = document.getElementById('train-track');
            track.innerHTML = '';

            const count = state.level === 1 ? 4 : state.level === 2 ? 7 : 10;
            let numbers = Array.from({ length: count }, (_, i) => i + 1);

            for (let i = numbers.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [numbers[i], numbers[j]] = [numbers[j], numbers[i]];
            }

            if (numbers.every((v, i) => v === i + 1)) {
                [numbers[0], numbers[1]] = [numbers[1], numbers[0]];
            }

            numbers.forEach(num => {
                const w = document.createElement('div');
                w.className = 'wagon';
                w.textContent = toPersian(num);
                w.dataset.number = num;
                w.draggable = true;
                track.appendChild(w);
            });

            setupDragAndDrop();
        }

        let dragged = null;

        function setupDragAndDrop() {
            const wagons = document.querySelectorAll('.wagon');
            wagons.forEach(w => {
                w.addEventListener('mousedown', handleDragStart);
                w.addEventListener('touchstart', handleDragStart, { passive: false });
            });
            document.addEventListener('mousemove', handleDragMove);
            document.addEventListener('touchmove', handleDragMove, { passive: false });
            document.addEventListener('mouseup', handleDragEnd);
            document.addEventListener('touchend', handleDragEnd);
        }

        function handleDragStart(e) {
            e.preventDefault();
            dragged = e.target.closest('.wagon');
            dragged.classList.add('dragging');
            SoundManager.playClick();
        }

        function handleDragMove(e) {
            if (!dragged) return;
            e.preventDefault();
            const clientX = e.clientX || e.touches[0].clientX;
            const clientY = e.clientY || e.touches[0].clientY;

            document.querySelectorAll('.wagon').forEach(w => {
                const rect = w.getBoundingClientRect();
                const isOver = clientX >= rect.left && clientX <= rect.right && clientY >= rect.top && clientY <= rect.bottom;
                w.classList.toggle('drag-over', isOver && w !== dragged);
            });
        }

        function handleDragEnd(e) {
            if (!dragged) return;
            const clientX = e.clientX || e.changedTouches[0].clientX;
            const clientY = e.clientY || e.changedTouches[0].clientY;

            let target = null;
            document.querySelectorAll('.wagon').forEach(w => {
                const rect = w.getBoundingClientRect();
                if (clientX >= rect.left && clientX <= rect.right && clientY >= rect.top && clientY <= rect.bottom) {
                    if (w !== dragged) target = w;
                }
                w.classList.remove('drag-over');
            });

            if (target) {
                const track = document.getElementById('train-track');
                const draggedNum = parseInt(dragged.dataset.number);
                const targetNum = parseInt(target.dataset.number);

                if (draggedNum !== targetNum) {
                    track.insertBefore(dragged, target);
                    track.insertBefore(target, dragged.nextSibling);
                    checkOrder();
                }
            }

            dragged.classList.remove('dragging');
            dragged = null;
        }

        function checkOrder() {
            const wagons = document.querySelectorAll('.wagon');
            let isCorrect = true;
            let correctCount = 0;

            wagons.forEach((w, i) => {
                const num = parseInt(w.dataset.number);
                if (num === i + 1) {
                    w.classList.add('correct');
                    correctCount++;
                } else {
                    w.classList.remove('correct');
                    isCorrect = false;
                }
            });

            state.totalMoves++;
            if (isCorrect) {
                state.correctMoves++;
                SoundManager.playSuccess();
                clearInterval(state.timerInterval);
                setTimeout(() => completeLevel(), 500);
            } else {
                state.errors++;
                document.getElementById('errors').textContent = toPersian(state.errors);
                SoundManager.playFail();
            }

            sendGameData({
                level: state.level,
                errors: state.errors,
                correctMoves: state.correctMoves,
                progressPercent: Math.round((correctCount / wagons.length) * 100),
                isFinished: isCorrect
            });
        }

        function updateTimer() {
            const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
            const min = Math.floor(elapsed / 60).toString().padStart(2, '0');
            const sec = (elapsed % 60).toString().padStart(2, '0');
            document.getElementById('timer').textContent = toPersian(`${min}:${sec}`);
        }

        function completeLevel() {
            showScreen('screen-complete');
            const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
            const min = Math.floor(elapsed / 60).toString().padStart(2, '0');
            const sec = (elapsed % 60).toString().padStart(2, '0');

            document.getElementById('final-time').textContent = toPersian(`${min}:${sec}`);
            document.getElementById('final-errors').textContent = toPersian(state.errors);

            let stars = 1;
            if (state.errors === 0) stars = 3;
            else if (state.errors <= 2) stars = 2;

            for (let i = 1; i <= 3; i++) {
                const s = document.getElementById(`star${i}`);
                s.classList.remove('earned');
                if (i <= stars) setTimeout(() => s.classList.add('earned'), i * 300);
            }

            SoundManager.playWin();

            const btnNext = document.getElementById('btn-next');
            if (state.level >= state.maxLevel) {
                btnNext.style.display = 'none';
                handleCoinReward();
            } else {
                btnNext.style.display = 'block';
                document.getElementById('reward-msg').style.display = 'block';
                document.getElementById('reward-msg').textContent = 'مراحل بعدی رو تکمیل کن تا سکه بگیری!';
            }
        }

        function handleCoinReward() {
            const msg = document.getElementById('reward-msg');
            msg.style.display = 'block';
            const floatCoin = document.getElementById('float-coin');

            let reward = 0;
            if (state.coins === 0) {
                reward = 10;
                msg.textContent = `پاداش ویژه! ${toPersian(reward)} سکه دریافت کردی!`;
            } else {
                reward = 1;
                msg.textContent = `خوش اومدی! ${toPersian(reward)} سکه دریافت کردی!`;
            }

            state.coins += reward;
            saveState();

            floatCoin.style.display = 'block';
            setTimeout(() => {
                floatCoin.style.display = 'none';
                updateCoinDisplay();
            }, 2000);
        }

        function nextLevel() {
            state.level++;
            state.errors = 0;
            startLevel();
        }

        function retryLevel() {
            state.errors = 0;
            startLevel();
        }

        function sendGameData(data) {
            if (!navigator.onLine) {
                let queue = JSON.parse(localStorage.getItem('pendingStats') || '[]');
                queue.push(data);
                localStorage.setItem('pendingStats', JSON.stringify(queue));
                return;
            }

            fetch('http://localhost:3000/api/game', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).catch(err => {
                let queue = JSON.parse(localStorage.getItem('pendingStats') || '[]');
                queue.push(data);
                localStorage.setItem('pendingStats', JSON.stringify(queue));
            });
        }

        function flushPendingStats() {
            if (!navigator.onLine) return;
            let queue = JSON.parse(localStorage.getItem('pendingStats') || '[]');
            if (queue.length === 0) return;

            queue.forEach(data => {
                fetch('http://localhost:3000/api/game', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                }).catch(() => { });
            });

            localStorage.removeItem('pendingStats');
        }

        window.addEventListener('online', flushPendingStats);

        window.addEventListener('DOMContentLoaded', function () {
            loadState();
            renderShop();
            flushPendingStats();
        });
    </script>
</body>

</html>
