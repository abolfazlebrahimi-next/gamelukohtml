<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <script>
(function () {
    'use strict';

    // Every game page loads this file. Keep the audio changes isolated here so
    // the game rules, layout, and other effects do not need to be changed.
    if (window.__lokoGameAudioController) return;
    window.__lokoGameAudioController = true;
    window.__lokoUseExternalBackgroundMusic = true;

    const TRACKS = [
        './musics/snowy.mp3',
        './musics/space.mp3',
        './musics/volcano.mp3'
    ];

    // Background music stays deliberately quiet. It is lowered again while
    // spoken guidance or another audio clip is playing.
    const BACKGROUND_VOLUME = 0.14;
    const DUCKED_VOLUME = 0.035;

    const mediaStates = new WeakMap();
    const speakingMedia = new Set();
    const speakingUtterances = new Set();
    const backgroundFiles = new Set([
        'abnabat.mp3',
        'first1.mp3',
        'forest.mp3',
        'jadooyi forest.mp3',
        'piano (1).mp3',
        'sami.mp3',
        'sami forest.mp3',
        'snowy.mp3',
        'space.mp3',
        'volcano.mp3',
        'z1.mp3'
    ]);

    let backgroundMusic = null;
    let trackIndex = 0;
    let musicStarted = false;
    let startAttemptInProgress = false;

    function getMediaState(media) {
        let state = mediaStates.get(media);
        if (!state) {
            state = {
                isLegacyBackground: false,
                isSilenced: false,
                previousVolume: 1,
                listenersAttached: false
            };
            mediaStates.set(media, state);
        }
        return state;
    }

    function getMediaSource(media) {
        return String(
            media.currentSrc ||
            media.getAttribute('src') ||
            media.src ||
            ''
        ).trim();
    }

    function getFileName(source) {
        if (!source) return '';
        try {
            const url = new URL(source, document.baseURI);
            return decodeURIComponent(url.pathname.split('/').pop() || '').toLowerCase();
        } catch (error) {
            return source.split('/').pop().split('?')[0].toLowerCase();
        }
    }

    function mediaId(media) {
        return String(media.id || media.getAttribute('name') || '').toLowerCase();
    }

    function isBackgroundMedia(media) {
        if (!media || media === backgroundMusic) return false;

        const id = mediaId(media);
        if (/^(bg|bgm|bgmusic|bg-music|theme-music|thememusic)$/.test(id)) return true;
        if (/(guide|voice|speech|narrat|intro|help|verse|tutorial|countdown|sfx|sound)/.test(id)) return false;

        const fileName = getFileName(getMediaSource(media));
        if (backgroundFiles.has(fileName)) return true;

        // Existing background elements are looped. Spoken clips and effects in
        // these games are one-shot, so this also covers dynamically created BGM.
        return media.loop === true && Boolean(fileName);
    }

    function isSpeakingMedia(media) {
        return media && media !== backgroundMusic && !isBackgroundMedia(media);
    }

    function updateBackgroundVolume() {
        if (!backgroundMusic) return;
        backgroundMusic.volume = speakingMedia.size > 0 || speakingUtterances.size > 0
            ? DUCKED_VOLUME
            : BACKGROUND_VOLUME;
    }

    function silenceLegacyBackground(media) {
        const state = getMediaState(media);
        if (!state.isSilenced) {
            state.previousVolume = media.volume;
            state.isSilenced = true;
        }
        if (media.volume !== 0) media.volume = 0;
    }

    function restoreNonBackgroundVolume(media) {
        const state = getMediaState(media);
        if (state.isSilenced) {
            state.isSilenced = false;
            media.volume = state.previousVolume;
        }
    }

    function stopSpeakingMedia(media) {
        speakingMedia.delete(media);
        trackedAudio.delete(media);
        updateBackgroundVolume();
    }

    function startSpeakingMedia(media) {
        if (!isSpeakingMedia(media)) return;
        speakingMedia.add(media);
        updateBackgroundVolume();
    }

    function registerMedia(media) {
        if (!media || !(media instanceof HTMLMediaElement)) return;

        const state = getMediaState(media);
        state.isLegacyBackground = isBackgroundMedia(media);

        if (state.isLegacyBackground) {
            speakingMedia.delete(media);
            silenceLegacyBackground(media);
        } else {
            restoreNonBackgroundVolume(media);
        }

        if (!state.listenersAttached) {
            state.listenersAttached = true;
            media.addEventListener('play', function () {
                registerMedia(media);
                startSpeakingMedia(media);
            });
            media.addEventListener('playing', function () {
                registerMedia(media);
                startSpeakingMedia(media);
            });
            media.addEventListener('pause', function () {
                stopSpeakingMedia(media);
            });
            media.addEventListener('ended', function () {
                stopSpeakingMedia(media);
            });
            media.addEventListener('emptied', function () {
                stopSpeakingMedia(media);
            });
            media.addEventListener('error', function () {
                stopSpeakingMedia(media);
            });
        }
    }

    function scanMediaElements(root) {
        if (!root || !root.querySelectorAll) return;
        if (root instanceof HTMLMediaElement) registerMedia(root);
        root.querySelectorAll('audio, video').forEach(registerMedia);
    }

    function patchMediaPlayback() {
        const mediaPrototype = window.HTMLMediaElement && HTMLMediaElement.prototype;
        if (!mediaPrototype) return;

        const nativePlay = mediaPrototype.play;
        if (typeof nativePlay === 'function' && !nativePlay.__lokoAudioPatched) {
            const patchedPlay = function () {
                registerMedia(this);
                const result = nativePlay.apply(this, arguments);
                if (result && typeof result.then === 'function') {
                    result.then(() => {
                        registerMedia(this);
                        if (!this.paused && !this.ended) startSpeakingMedia(this);
                    }).catch(() => {});
                } else if (!this.paused && !this.ended) {
                    startSpeakingMedia(this);
                }
                return result;
            };
            patchedPlay.__lokoAudioPatched = true;
            mediaPrototype.play = patchedPlay;
        }

        const nativePause = mediaPrototype.pause;
        if (typeof nativePause === 'function' && !nativePause.__lokoAudioPatched) {
            const patchedPause = function () {
                const result = nativePause.apply(this, arguments);
                stopSpeakingMedia(this);
                return result;
            };
            patchedPause.__lokoAudioPatched = true;
            mediaPrototype.pause = patchedPause;
        }

        // The original games sometimes reset their music volume after this
        // controller has silenced it. Keep only their old background track
        // silent without affecting voices or sound effects.
        const volumeDescriptor = Object.getOwnPropertyDescriptor(mediaPrototype, 'volume');
        if (volumeDescriptor && volumeDescriptor.get && volumeDescriptor.set && volumeDescriptor.configurable) {
            const patchedVolume = {
                configurable: true,
                enumerable: volumeDescriptor.enumerable,
                get: volumeDescriptor.get,
                set: function (value) {
                    if (isBackgroundMedia(this)) {
                        const state = getMediaState(this);
                        if (!state.isSilenced) {
                            state.previousVolume = value;
                            state.isSilenced = true;
                        }
                        volumeDescriptor.set.call(this, 0);
                    } else {
                        volumeDescriptor.set.call(this, value);
                    }
                }
            };
            Object.defineProperty(mediaPrototype, 'volume', patchedVolume);
        }
    }

    function attachSpeechSynthesisHooks() {
        const synth = window.speechSynthesis;
        if (!synth || typeof synth.speak !== 'function') return;

        const nativeSpeak = synth.speak.bind(synth);
        const nativeCancel = typeof synth.cancel === 'function' ? synth.cancel.bind(synth) : null;

        const wrappedSpeak = function (utterance) {
            let release = null;
            if (utterance) {
                speakingUtterances.add(utterance);
                updateBackgroundVolume();

                release = function () {
                    speakingUtterances.delete(utterance);
                    updateBackgroundVolume();
                };

                if (typeof utterance.addEventListener === 'function') {
                    utterance.addEventListener('end', release, { once: true });
                    utterance.addEventListener('error', release, { once: true });
                }
            }
            try {
                return nativeSpeak(utterance);
            } catch (error) {
                if (release) release();
                throw error;
            }
        };

        try {
            synth.speak = wrappedSpeak;
        } catch (error) {
            return;
        }

        if (nativeCancel) {
            try {
                synth.cancel = function () {
                    speakingUtterances.clear();
                    updateBackgroundVolume();
                    return nativeCancel();
                };
            } catch (error) {
                // Some browsers expose speechSynthesis.cancel as read-only.
            }
        }
    }

    // ---------------------------------------------------------------------
    // Shared guide controls
    // ---------------------------------------------------------------------
    // The game pages use several different guide/tutor implementations. A
    // small shared layer keeps the user-facing skip action consistent without
    // replacing any of the guides or their audio files.
    const GUIDE_TOKEN_PATTERN = /(?:guide|tutorial|help|narrat|intro|voice)/i;
    const GUIDE_LEAF_PATTERN = /(?:text|char|avatar|bubble|step|header|title|progress|bar|audio|skip|button|nav|dots|icon|img|hint|message|line|description|list)/i;
    const trackedAudio = new Set();
    let guideScanQueued = false;

    function isMediaElement(value) {
        return Boolean(
            value &&
            window.HTMLMediaElement &&
            value instanceof window.HTMLMediaElement
        );
    }

    function patchAudioConstructor() {
        const nativeAudio = window.Audio;
        if (typeof nativeAudio !== 'function' || nativeAudio.__lokoGuideAudioPatched) return;

        const trackedAudioConstructor = function () {
            const media = new nativeAudio(...arguments);
            trackedAudio.add(media);
            registerMedia(media);
            return media;
        };
        trackedAudioConstructor.prototype = nativeAudio.prototype;
        trackedAudioConstructor.__lokoGuideAudioPatched = true;
        try {
            window.Audio = trackedAudioConstructor;
        } catch (error) {
            // Audio can be read-only in a few embedded browsers.
        }
    }

    function stopGuidanceMedia() {
        const candidates = new Set(trackedAudio);
        speakingMedia.forEach(media => candidates.add(media));
        document.querySelectorAll('audio, video').forEach(media => candidates.add(media));

        // A few games keep a dynamically-created guide clip in a named
        // variable rather than in the DOM. Include those conventional names.
        [
            'guideAudio', 'tutorialAudio', 'helpAudio', 'introAudio',
            'voiceAudio', 'activeAudio', 'narratorAudio'
        ].forEach(name => {
            const media = window[name];
            if (isMediaElement(media)) candidates.add(media);
        });

        candidates.forEach(media => {
            if (!isMediaElement(media) || media === backgroundMusic || isBackgroundMedia(media)) return;
            try {
                media.pause();
                media.currentTime = 0;
            } catch (error) {}
            speakingMedia.delete(media);
        });

        const synth = window.speechSynthesis;
        if (synth && typeof synth.cancel === 'function') {
            try { synth.cancel(); } catch (error) {}
        }
        speakingUtterances.clear();
        updateBackgroundVolume();
    }

    function guideElementToken(element) {
        if (!element || element.nodeType !== 1) return '';
        return String(
            (element.id || '') + ' ' +
            (typeof element.className === 'string' ? element.className : '') + ' ' +
            (element.getAttribute('data-role') || '')
        ).toLowerCase();
    }

    function isGuideLikeElement(element) {
        return Boolean(
            element &&
            element.nodeType === 1 &&
            GUIDE_TOKEN_PATTERN.test(guideElementToken(element))
        );
    }

    function isGuideLeafElement(element) {
        return GUIDE_LEAF_PATTERN.test(guideElementToken(element));
    }

    function isMenuLikeElement(element) {
        let current = element;
        while (current && current !== document.body) {
            const token = guideElementToken(current);
            if (/(?:^|[\s_-])(?:menu|landing|home|main)(?:[\s_-]|screen|page|content|area|character|wrapper|view|$)/.test(token)) return true;
            current = current.parentElement;
        }
        return false;
    }

    function isElementVisible(element) {
        if (!element || element.nodeType !== 1) return false;
        let current = element;
        while (current && current.nodeType === 1) {
            if (current.hidden) return false;
            const classList = current.classList;
            if (classList && (
                classList.contains('hidden') ||
                classList.contains('d-none') ||
                classList.contains('is-hidden') ||
                classList.contains('invisible')
            )) return false;
            const stateClasses = classList && (
                classList.contains('active') ||
                classList.contains('show') ||
                classList.contains('open') ||
                classList.contains('visible')
            );
            const token = guideElementToken(current);
            if (
                classList &&
                (classList.contains('screen') || classList.contains('page')) &&
                !stateClasses &&
                !current.style.display
            ) return false;
            if (
                /(?:overlay|modal)/.test(token) &&
                !stateClasses &&
                !current.style.display
            ) return false;
            let style = null;
            try {
                style = window.getComputedStyle(current);
            } catch (error) {
                // A malformed page stylesheet should not disable guide controls.
            }
            if (style && (
                style.display === 'none' ||
                style.visibility === 'hidden'
            )) return false;
            current = current.parentElement;
        }
        return true;
    }

    function guideContainerScore(element) {
        const token = guideElementToken(element);
        let score = 0;
        if (/container|content|card|panel/.test(token)) score += 6;
        if (/wrapper|wrap|box/.test(token)) score += 4;
        if (/modal|overlay/.test(token)) score += 4;
        if (/screen|page|section/.test(token)) score += 1;
        if (isGuideLeafElement(element)) score -= 4;
        return score;
    }

    function isSkipControl(element) {
        if (!element || element.nodeType !== 1) return false;
        const identity = String(
            (element.id || '') + ' ' +
            (typeof element.className === 'string' ? element.className : '') + ' ' +
            (element.getAttribute('aria-label') || '')
        );
        const label = String(element.textContent || '');
        // Completion buttons often say «بزن بریم» too; only treat that
        // wording as a skip control when the control is explicitly named as
        // one. The visible Persian "رد کردن" label is unambiguous.
        return /(?:skip|guide-skip|tutorial-skip)/i.test(identity) || /رد\s*کردن/i.test(label);
    }

    function addGuideButtonStyles() {
        if (document.getElementById('loko-guide-skip-styles')) return;
        const style = document.createElement('style');
        style.id = 'loko-guide-skip-styles';
        style.textContent = `
            .loko-guide-skip {
                position: static !important;
                inset: auto !important;
                display: block !important;
                margin: 14px auto 0 !important;
            }
        `;
        (document.head || document.documentElement).appendChild(style);
    }

    function guideActionScope(container) {
        let current = container;
        while (current && current !== document.body) {
            const token = guideElementToken(current);
            if (current !== container && /screen|page|modal|overlay/.test(token)) return current;
            current = current.parentElement;
        }
        return container;
    }

    function getGuideExitFunction(container) {
        const tokens = [];
        let current = container;
        while (current && current !== document.body) {
            tokens.push(guideElementToken(current));
            current = current.parentElement;
        }
        const token = tokens.join(' ');
        const names = [];
        if (/voice/.test(token)) names.push('skipVoiceGuide', 'finishVoiceGuide');
        if (/tutorial/.test(token)) {
            names.push('skipTutorial', 'tutorialSkip', 'finishTutorial', 'endTutorial', 'hideTutorialScreen');
        }
        if (/help/.test(token)) names.push('skipHelp', 'finishHelp', 'closeHelp', 'hideHelp');
        if (/intro/.test(token)) names.push('skipIntro', 'finishIntro', 'closeIntro');
        names.push('skipGuide', 'finishGuide', 'endGuide', 'closeGuide');

        const uniqueNames = [...new Set(names)];
        for (const name of uniqueNames) {
            if (typeof window[name] === 'function') return window[name];
        }
        return null;
    }

    function findGuideFallbackControl(container, skipButton) {
        const scope = guideActionScope(container);
        const controls = [...scope.querySelectorAll(
            'button, [role="button"], a, input[type="button"], input[type="submit"]'
        )].filter(control => control !== skipButton && isElementVisible(control));
        return controls.find(control => {
            const token = String(
                (control.id || '') + ' ' +
                (typeof control.className === 'string' ? control.className : '') + ' ' +
                (control.getAttribute('aria-label') || '') + ' ' +
                (control.getAttribute('data-go') || '') + ' ' +
                (control.getAttribute('data-back') || '') + ' ' +
                (control.getAttribute('onclick') || '') + ' ' +
                (control.textContent || '')
            );
            return /(?:close|back|home|بازگشت|بستن|فهمیدم|بزن\s*بریم|شروع|ورود)/i.test(token);
        }) || null;
    }

    function hideGuideAsLastResort(container) {
        if (!container) return;
        const scope = guideActionScope(container);
        scope.classList.remove('active', 'show', 'open', 'visible');
        if (/screen|overlay|modal/.test(guideElementToken(scope))) {
            scope.style.setProperty('display', 'none', 'important');
        }
    }

    function invokeGuideExit(button, container, event) {
        const exitFunction = getGuideExitFunction(container);
        if (exitFunction) {
            try {
                exitFunction(event);
                return true;
            } catch (error) {
                console.warn('Guide skip handler failed:', error);
            }
        }

        // Inline handlers can reference lexical variables or page-specific
        // objects (for example oceanGame), so retain them as a fallback.
        if (typeof button.onclick === 'function') {
            try {
                button.onclick.call(button, event);
                return true;
            } catch (error) {}
        }

        const fallback = findGuideFallbackControl(container, button);
        if (fallback) {
            try {
                if (!isElementVisible(fallback)) {
                    fallback.classList.remove('hidden');
                    fallback.style.removeProperty('display');
                }
                fallback.click();
                return true;
            } catch (error) {}
        }

        hideGuideAsLastResort(container);
        return false;
    }

    function bindGuideSkipButton(button, container, injected) {
        if (button.dataset.lokoGuideSkipBound === 'true') {
            if (button.dataset.lokoGuideContainer !== (container.id || '')) {
                button.dataset.lokoGuideContainer = container.id || '';
            }
            return;
        }
        button.dataset.lokoGuideSkipBound = 'true';
        button.dataset.lokoGuideInjected = injected ? 'true' : 'false';
        button.dataset.lokoGuideContainer = container.id || '';
        button.addEventListener('click', function (event) {
            stopGuidanceMedia();

            // Existing controls keep their page's listener when no shared
            // handler is available. Injected controls always need a route.
            const hasRoute = Boolean(getGuideExitFunction(container));
            if (!injected && !hasRoute) return;

            event.preventDefault();
            event.stopImmediatePropagation();
            invokeGuideExit(button, container, event);
        }, true);
    }

    function setImportantStyleIfNeeded(element, property, value) {
        if (
            element.style.getPropertyValue(property) !== value ||
            element.style.getPropertyPriority(property) !== 'important'
        ) {
            element.style.setProperty(property, value, 'important');
        }
    }

    function prepareGuideSkipButton(button, container, injected) {
        if (!button || !container) return;
        if (button.parentElement !== container) container.appendChild(button);

        if (!button.classList.contains('loko-guide-skip')) {
            button.classList.add('loko-guide-skip');
        }
        if (button.hasAttribute('hidden')) button.removeAttribute('hidden');
        ['hidden', 'd-none', 'is-hidden', 'invisible'].forEach(className => {
            if (button.classList.contains(className)) button.classList.remove(className);
        });
        if (button.textContent !== '⏭️ رد کردن') button.textContent = '⏭️ رد کردن';
        if (button.getAttribute('aria-label') !== 'رد کردن راهنما') {
            button.setAttribute('aria-label', 'رد کردن راهنما');
        }
        if (button.tagName === 'BUTTON' && !button.getAttribute('type')) {
            button.setAttribute('type', 'button');
        }
        setImportantStyleIfNeeded(button, 'display', 'block');
        setImportantStyleIfNeeded(button, 'position', 'static');
        setImportantStyleIfNeeded(button, 'inset', 'auto');
        bindGuideSkipButton(button, container, injected);
    }

    function elementDepth(element) {
        let depth = 0;
        let current = element;
        while (current && current.parentElement) {
            depth += 1;
            current = current.parentElement;
        }
        return depth;
    }

    function guideGroupingElement(element) {
        let current = element.parentElement;
        while (current && current !== document.body) {
            const token = guideElementToken(current);
            if (isGuideLikeElement(current) && /screen|page|modal|overlay/.test(token)) return current;
            current = current.parentElement;
        }
        return null;
    }

    function guideContainersInDocument() {
        const candidates = [...document.querySelectorAll('body *')].filter(element => {
            if (!isGuideLikeElement(element) || isGuideLeafElement(element)) return false;
            if (/^(button|a|input|audio|video|svg|use|symbol|path|g|circle|line|polyline|polygon)$/i.test(element.tagName)) return false;
            if (element.namespaceURI === 'http://www.w3.org/2000/svg') return false;
            if (isMenuLikeElement(element)) return false;
            return isElementVisible(element);
        });

        // Prefer the semantic guide card/content element over its screen
        // wrapper, then skip descendants once a container has been selected.
        candidates.sort((a, b) => {
            const scoreDifference = guideContainerScore(b) - guideContainerScore(a);
            if (scoreDifference) return scoreDifference;
            return elementDepth(b) - elementDepth(a);
        });
        const selected = [];
        const grouped = new Set();
        candidates.forEach(candidate => {
            if (selected.some(selectedElement => selectedElement.contains(candidate))) return;
            if (selected.some(selectedElement => candidate.contains(selectedElement))) return;
            const group = guideGroupingElement(candidate);
            if (group && grouped.has(group)) return;
            if (group) grouped.add(group);
            selected.push(candidate);
        });
        return selected;
    }

    function guideSkipControlsInScope(container) {
        const scope = guideActionScope(container);
        return [...scope.querySelectorAll(
            'button, [role="button"], input[type="button"], input[type="submit"]'
        )].filter(control => isSkipControl(control) || control.classList.contains('loko-guide-skip'));
    }

    function scanGuideControls() {
        guideScanQueued = false;
        if (!document.body) return;
        addGuideButtonStyles();

        const containers = guideContainersInDocument();
        containers.forEach(container => {
            let skipButton = guideSkipControlsInScope(container)[0];

            if (!skipButton) {
                skipButton = document.createElement('button');
                skipButton.type = 'button';
                skipButton.className = 'loko-guide-skip';
                skipButton.textContent = '⏭️ رد کردن';
                container.appendChild(skipButton);
                prepareGuideSkipButton(skipButton, container, true);
            } else {
                prepareGuideSkipButton(skipButton, container, false);
            }

            // A previous scan may have created a button in a nested helper
            // wrapper before the semantic guide container became visible.
            // Keep one shared control per active guide scope and remove only
            // buttons created by this controller, never page-owned controls.
            guideSkipControlsInScope(container).forEach(control => {
                if (
                    control !== skipButton &&
                    control.dataset.lokoGuideInjected === 'true'
                ) control.remove();
            });
        });
    }

    function scheduleGuideScan() {
        if (guideScanQueued) return;
        guideScanQueued = true;
        const schedule = window.requestAnimationFrame || function (callback) {
            return window.setTimeout(callback, 0);
        };
        schedule(scanGuideControls);
    }

    function nextTrack() {
        if (!backgroundMusic) return;
        trackIndex = (trackIndex + 1) % TRACKS.length;
        backgroundMusic.src = TRACKS[trackIndex];
        backgroundMusic.load();
        updateBackgroundVolume();
        if (musicStarted) backgroundMusic.play().catch(() => {});
    }

    function createBackgroundMusic() {
        if (backgroundMusic) return backgroundMusic;

        backgroundMusic = document.createElement('audio');
        backgroundMusic.preload = 'auto';
        backgroundMusic.loop = false;
        backgroundMusic.setAttribute('aria-hidden', 'true');
        backgroundMusic.setAttribute('playsinline', '');
        backgroundMusic.dataset.lokoBackgroundMusic = 'true';
        backgroundMusic.src = TRACKS[trackIndex];
        backgroundMusic.addEventListener('ended', nextTrack);
        backgroundMusic.addEventListener('error', nextTrack);
        document.body.appendChild(backgroundMusic);
        updateBackgroundVolume();
        return backgroundMusic;
    }

    function startBackgroundMusic() {
        if (musicStarted || startAttemptInProgress) return;
        startAttemptInProgress = true;
        const music = createBackgroundMusic();
        let playResult;
        try {
            playResult = music.play();
        } catch (error) {
            startAttemptInProgress = false;
            return;
        }

        if (playResult && typeof playResult.then === 'function') {
            playResult.then(() => {
                musicStarted = true;
                startAttemptInProgress = false;
                removeUnlockListeners();
                updateBackgroundVolume();
            }).catch(() => {
                startAttemptInProgress = false;
            });
        } else {
            musicStarted = true;
            startAttemptInProgress = false;
            removeUnlockListeners();
            updateBackgroundVolume();
        }
    }

    function installUnlockListeners() {
        ['pointerdown', 'touchstart', 'keydown', 'click'].forEach(function (eventName) {
            document.addEventListener(eventName, startBackgroundMusic, { capture: true, passive: true });
        });
    }

    function removeUnlockListeners() {
        ['pointerdown', 'touchstart', 'keydown', 'click'].forEach(function (eventName) {
            document.removeEventListener(eventName, startBackgroundMusic, true);
        });
    }

    function init() {
        patchMediaPlayback();
        patchAudioConstructor();
        attachSpeechSynthesisHooks();
        scanMediaElements(document);
        scheduleGuideScan();

        const observer = new MutationObserver(function (mutations) {
            mutations.forEach(function (mutation) {
                mutation.addedNodes.forEach(function (node) {
                    scanMediaElements(node);
                });
                if (mutation.type === 'attributes') registerMedia(mutation.target);
            });
            scheduleGuideScan();
        });
        observer.observe(document.documentElement, {
            childList: true,
            subtree: true,
            attributes: true,
            attributeFilter: ['id', 'name', 'src', 'loop', 'class', 'style', 'hidden']
        });

        installUnlockListeners();
        window.addEventListener('pagehide', function () {
            if (backgroundMusic) backgroundMusic.pause();
        });
        window.addEventListener('pageshow', function () {
            if (musicStarted && backgroundMusic) backgroundMusic.play().catch(() => {});
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init, { once: true });
    } else {
        init();
    }

    <style>

        /* ===== [LOKO] Color Palette ===== */
        :root {

        body::before {

        body::after {
            content: '';

            bottom: -140px;
            left: -100px;

        /* --- انیمیشن‌ها --- */

        /* --- حباب گفتگو --- */

        .speech-bubble::after {

            border-right: 9px solid transparent;

        .pixel-hero {

            filter: drop-shadow(0 0 18px rgba(0, 210, 255, 0.45));

        .pixel-hero .hero-img,
        .mini-hero .hero-img,

            width: 100%;
            height: 100%;

            display: block;
        }
        .mini-hero {
            width: 90px;
            height: 90px;
            margin: 8px auto;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 14px rgba(0, 255, 157, 0.55));
        }
        .help-hero {
            width: 92px;
            height: 92px;
            margin: 0 auto 6px;
            filter: drop-shadow(0 0 12px rgba(0, 210, 255, 0.5));

        /* ===== [LOKO] Buttons ===== */
        .btn {
            border: 2px solid rgba(255, 255, 255, 0.35);
            background: linear-gradient(180deg, #FFE68A 0%, #FFC93C 45%, #FFA800 100%);

        }
        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.03);
        }
        .btn:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 var(--gold-dark), 0 4px 10px rgba(255, 169, 0, 0.25);
        }
        .btn-help {
            background: rgba(255, 255, 255, 0.12);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border: 1.5px solid rgba(255, 255, 255, 0.28);

            padding: 13px 30px;

        /* --- صفحه بازی --- */
        .progress-bar-container {
            width: 100%;
            height: 14px;

            border-radius: 10px;

        #progress-fill {

            backdrop-filter: blur(10px);

            background: rgba(255, 118, 117, 0.92);
            box-shadow: 0 0 18px rgba(255, 118, 117, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);

            backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
        }
        .modal-content {
            background: rgba(30, 30, 47, 0.95);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 28px 24px;
            border-radius: 24px;
            max-width: 440px;
            width: 100%;
            max-height: 86vh;
            overflow-y: auto;
            text-align: center;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(108, 92, 231, 0.15);
            animation: bounceIn 0.45s ease-out;

        .modal-content h2 {
            margin: 4px 0 10px;
            color: #fff;
            font-size: 1.35rem;
            font-weight: 900;
        }
        .modal-content p { color: var(--text-dim); line-height: 1.9; margin: 6px 0; }
        .modal-content strong { color: #fff; font-size: 1.08rem; }

        /* ===== [LOKO] راهنمای حرفه‌ای ===== */
        .help-speech {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 14px;
            padding: 10px 16px;
            font-size: 0.92rem;
            color: #fff;
            margin: 8px 0 14px;
            line-height: 1.8;
        }
        .help-steps {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 0 0 16px;
            text-align: right;
        }
        .help-step {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 14px;
            padding: 12px 14px;
            transition: transform 0.2s ease, border-color 0.2s ease;

        .help-step:hover {
            transform: translateX(-4px);

            height: 32px;

            color: #4A2E00;

            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;
            margin-top: 2px;

            margin: 0;
            font-size: 0.86rem;

            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;

            line-height: 1.7;
            border: 1px solid transparent;

        .tip-blue   { background: rgba(0, 210, 255, 0.1);    border-color: rgba(0, 210, 255, 0.3); }

            font-size: 1.9rem;

            margin: 4px 0 8px;

        .coin-reward {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(180deg, #FFE68A, #FFC93C);
            color: #4A2E00;

            font-size: 1.12rem;

            height: 22px;

<body>

    <!-- ===== لایه آمار (مخفی — Data فعال) ===== -->

        <button class="btn" onclick="ui.showPage('landing-page')">🏠 بازگشت به خانه</button>

    <!-- ظرف نوتیفیکیشن -->
    <div id="toast-container"></div>

    <script>
        /**
         * [نینجا] - منطق بازی ویروس الگو (سیستم مرحله‌ای: ۳ بخش × ۴ مرحله)
         * [LOKO] - سکه لوکو، کاراکتر لوکو، لایه آفلاین/سینک
         */

        // ===== [LOKO] Fallback تصاویر (اگر icons موجود نباشد) =====
        const lokoSvgs = {
            coin: '<svg class="coin-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="10" fill="#B96F00"/><circle cx="12" cy="12" r="8" fill="#FFC93C"/><circle cx="12" cy="12" r="5.5" fill="#FFE68A"/><path d="M12 8 L13.1 10.4 L15.7 10.7 L13.8 12.5 L14.3 15.1 L12 13.8 L9.7 15.1 L10.2 12.5 L8.3 10.7 L10.9 10.4 Z" fill="#FFC93C"/></svg>',
            hero: '<svg viewBox="0 0 16 16" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block"><rect x="5" y="0" width="6" height="1" fill="#6C5CE7"/><rect x="4" y="1" width="8" height="2" fill="#6C5CE7"/><rect x="4" y="1" width="8" height="1" fill="#FF00A0"/><rect x="4" y="3" width="8" height="4" fill="#FFD9B3"/><rect x="4" y="3" width="8" height="1" fill="#6C5CE7"/><rect x="5" y="7" width="6" height="1" fill="#FFD9B3"/><rect x="2" y="4" width="2" height="3" fill="#FF00A0"/><rect x="12" y="4" width="2" height="3" fill="#FF00A0"/><rect x="2" y="6" width="2" height="1" fill="#C7007E"/><rect x="12" y="6" width="2" height="1" fill="#C7007E"/><rect x="6" y="5" width="1" height="1" fill="#1E1E2F"/><rect x="9" y="5" width="1" height="1" fill="#1E1E2F"/><rect x="7" y="6" width="2" height="1" fill="#E8B088"/><rect x="4" y="8" width="8" height="1" fill="#00D2FF"/><rect x="3" y="9" width="10" height="3" fill="#00D2FF"/><rect x="4" y="12" width="8" height="1" fill="#00D2FF"/><rect x="3" y="11" width="2" height="1" fill="#FFD9B3"/><rect x="11" y="11" width="2" height="1" fill="#FFD9B3"/><rect x="6" y="11" width="4" height="1" fill="#2F3542"/><rect x="7" y="11" width="1" height="1" fill="#00FF9D"/><rect x="4" y="13" width="8" height="1" fill="#1E1E2F"/><rect x="4" y="14" width="3" height="1" fill="#1E1E2F"/><rect x="9" y="14" width="3" height="1" fill="#1E1E2F"/><rect x="3" y="15" width="4" height="1" fill="#B96F00"/><rect x="9" y="15" width="4" height="1" fill="#B96F00"/></svg>',
            helper: '<svg viewBox="0 0 16 16" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block"><rect x="5" y="0" width="6" height="1" fill="#6C5CE7"/><rect x="4" y="1" width="8" height="2" fill="#6C5CE7"/><rect x="4" y="1" width="8" height="1" fill="#FF00A0"/><rect x="4" y="3" width="8" height="4" fill="#FFD9B3"/><rect x="4" y="3" width="8" height="1" fill="#6C5CE7"/><rect x="5" y="7" width="6" height="1" fill="#FFD9B3"/><rect x="2" y="4" width="2" height="3" fill="#FF00A0"/><rect x="12" y="4" width="2" height="3" fill="#FF00A0"/><rect x="2" y="6" width="2" height="1" fill="#C7007E"/><rect x="12" y="6" width="2" height="1" fill="#C7007E"/><rect x="6" y="5" width="1" height="1" fill="#1E1E2F"/><rect x="9" y="5" width="1" height="1" fill="#1E1E2F"/><rect x="6" y="6" width="4" height="1" fill="#E8B088"/><rect x="7" y="7" width="2" height="1" fill="#E8B088"/><rect x="4" y="8" width="8" height="1" fill="#00D2FF"/><rect x="3" y="9" width="10" height="3" fill="#00D2FF"/><rect x="4" y="12" width="8" height="1" fill="#00D2FF"/><rect x="3" y="11" width="2" height="1" fill="#FFD9B3"/><rect x="13" y="7" width="1" height="2" fill="#FFD9B3"/><rect x="12" y="9" width="2" height="1" fill="#FFD9B3"/><rect x="4" y="13" width="8" height="1" fill="#1E1E2F"/><rect x="4" y="14" width="3" height="1" fill="#1E1E2F"/><rect x="9" y="14" width="3" height="1" fill="#1E1E2F"/><rect x="3" y="15" width="4" height="1" fill="#B96F00"/><rect x="9" y="15" width="4" height="1" fill="#B96F00"/></svg>'
        };

        function assetFallback(img) {
            const key = img.dataset.fallback;
            if (!key || !lokoSvgs[key]) { img.style.display = 'none'; return; }
            const tpl = document.createElement('template');
            tpl.innerHTML = lokoSvgs[key].trim();
            img.replaceWith(tpl.content.firstChild);
        }

        function bindFallbacks(root) {
            (root || document).querySelectorAll('img[data-fallback]').forEach(img => {
                if (img.complete && img.naturalWidth === 0) { assetFallback(img); return; }
                img.addEventListener('error', function h() {
                    img.removeEventListener('error', h);
                    assetFallback(img);
                });
            });
        }

        // --- مدیریت آمار در LocalStorage (Data Pipeline حفظ شده) ---
        const stats = {
            data: {
                totalScore: 0,
                totalGames: 0,
                totalHypothesesTested: 0,
                totalFirstTrySuccess: 0,
                totalLevelsCompleted: 0,
                bestScore: 0,
                lastPlayDate: null
            },
            load() {
                const saved = localStorage.getItem('patternVirusStats');
                if (saved) this.data = JSON.parse(saved);
            },
            save() {
                localStorage.setItem('patternVirusStats', JSON.stringify(this.data));
                network.markPending();
                network.syncData();
            },
            updateUI() {
                const set = (id, v) => { const el = document.getElementById(id); if (el) el.innerText = v; };
                set('stat-total-score', this.data.totalScore);
                set('stat-total-games', this.data.totalGames);
                set('stat-total-hypo', this.data.totalHypothesesTested);
                set('stat-first-try', this.data.totalFirstTrySuccess);
            },
            reset() {
                if(confirm('آیا مطمئنی می‌خوای تمام افتخاراتت رو پاک کنی؟')) {
                    localStorage.removeItem('patternVirusStats');
                    location.reload();
                }
            }
        };

        // ===== [LOKO] Coin System — سکه لوکو =====
        const coinSystem = {
            key: 'lokoCoins',
            get() {
                try {
                    const v = parseInt(localStorage.getItem(this.key) || '0', 10);
                    return isNaN(v) ? 0 : v;
                } catch (e) { return 0; }
            },
            add(amount) {
                try {
                    localStorage.setItem(this.key, String(this.get() + amount));
                } catch (e) { /* حافظه در دسترس نیست */ }
                this.updateDisplay(true);
                network.markPending();
                return this.get();
            },
            updateDisplay(animate = false) {
                const el = document.getElementById('coin-amount');
                if (!el) return;
                el.innerText = this.get();
                if (animate) {
                    el.classList.remove('bump');
                    void el.offsetWidth;
                    el.classList.add('bump');
                }
            }
        };

        // ===== [LOKO] Offline / Sync Layer =====
        const network = {
            ENDPOINT: null, // در صورت وجود سرور، آدرس اینجا قرار می‌گیرد
            pendingKey: 'patternVirusPendingSync',
            init() {
                window.addEventListener('online', () => this.syncData());
                setInterval(() => this.syncData(), 30000);
                this.syncData();
            },
            markPending() {
                try {
                    localStorage.setItem(this.pendingKey, JSON.stringify({
                        stats: stats.data,
                        coins: coinSystem.get(),
                        updatedAt: Date.now()
                    }));
                } catch (e) { /* نادیده گرفته می‌شود */ }
            },
            fetchWithTimeout(url, options = {}, timeout = 5000) {
                return new Promise((resolve, reject) => {
                    const timer = setTimeout(() => reject(new Error('timeout')), timeout);
                    fetch(url, options)
                        .then(res => { clearTimeout(timer); resolve(res); })
                        .catch(err => { clearTimeout(timer); reject(err); });
                });
            },
            async syncData() {
                if (!this.ENDPOINT || !navigator.onLine) return;
                const raw = localStorage.getItem(this.pendingKey);
                if (!raw) return;
                try {
                    const res = await this.fetchWithTimeout(this.ENDPOINT, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: raw
                    });
                    if (res.ok) localStorage.removeItem(this.pendingKey);
                } catch (e) { /* کش حفظ می‌شود */ }
            },
            mergeServerData(serverData) {
                const local = stats.data;
                return {
                    totalScore: Math.max(local.totalScore || 0, serverData.totalScore || 0),
                    totalGames: Math.max(local.totalGames || 0, serverData.totalGames || 0),
                    totalHypothesesTested: Math.max(local.totalHypothesesTested || 0, serverData.totalHypothesesTested || 0),
                    totalFirstTrySuccess: Math.max(local.totalFirstTrySuccess || 0, serverData.totalFirstTrySuccess || 0),
                    totalLevelsCompleted: Math.max(local.totalLevelsCompleted || 0, serverData.totalLevelsCompleted || 0),
                    bestScore: Math.max(local.bestScore || 0, serverData.bestScore || 0),
                    lastPlayDate: local.lastPlayDate || serverData.lastPlayDate || null
                };
            }
        };

        // --- مدیریت رابط کاربری ---
        const ui = {
            showPage(pageId) {
                document.querySelectorAll('body > div[id$="-page"]').forEach(p => p.classList.remove('active'));
                document.getElementById(pageId).classList.add('active');
                coinSystem.updateDisplay();
            },
            showToast(message, type = 'success') {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                toast.className = `toast toast-${type}`;
                toast.innerText = message;
                container.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            },
            showModal(type, data = {}) {
                const overlay = document.getElementById('modal-overlay');
                const content = document.getElementById('modal-content');
                overlay.style.display = 'flex';

                if (type === 'help') {
                    // ===== [LOKO] راهنمای حرفه‌ای با کاراکتر gamerhi =====
                    content.innerHTML = `
                        <h2>📖 راهنمای کارآگاه</h2>
                        <div class="help-hero">
                            <img src="./icons/gamerhi.png" class="hero-img" data-fallback="helper" alt="لوکو">
                        </div>
                        <div class="help-speech">سلام! من <b>لوکو</b> هستم 👋 بذار سریع نشونت بدم چطوری ویروس الگو رو شکست بدی!</div>
                        <div class="help-steps">
                            <div class="help-step">
                                <span class="step-num">۱</span>
                                <div><b>👀 نگاه کن</b><p>ویروس یک خانه از الگو رو با «؟» پاک کرده. عددها و شکل‌های کناری، راز قانون مخفی رو نگه داشتن.</p></div>
                            </div>
                            <div class="help-step">
                                <span class="step-num">۲</span>
                                <div><b>🧠 فرضیه بساز</b><p>یکی از قانون‌های پایین صفحه رو انتخاب کن؛ مثلاً «+۲»، «×۲» یا «تکرار ۳ و ۵».</p></div>
                            </div>
                            <div class="help-step">
                                <span class="step-num">۳</span>
                                <div><b>🧪 تست کن</b><p>سیستم با قانونِ تو، خانه خالی رو پر می‌کنه. اگه جواب با بقیه الگو جور نبود، یعنی فرضیه اشتباهه!</p></div>
                            </div>
                            <div class="help-step">
                                <span class="step-num">۴</span>
                                <div><b>🏆 کشف کن</b><p>قانون درست یعنی مرحله رو بردی! هر چی زودتر کشف کنی، امتیاز بیشتری می‌گیری.</p></div>
                            </div>
                        </div>
                        <div class="help-tips">
                            <div class="tip tip-gold">⭐ اولین تلاش درست = <b>۱۰ امتیاز کامل</b>؛ هر فرضیه اضافه ۲ امتیاز کم می‌کنه.</div>
                            <div class="tip tip-blue">🧩 قانون‌هایی که پنهان شدن: جمعی (+)، ضربی (×)، نزولی (−)، تکراری و الگوی شکلی.</div>
                            <div class="tip tip-purple">🗺️ ماموریت <b>۱۲ مرحله</b> داره؛ سه بخش: پادگان اعداد، جنگل الگوها و قلعه ویروس — هر بخش سخت‌تر از قبل!</div>
                            <div class="tip tip-green">🪙 آخر ماموریت، <b>سکه لوکو</b> جایزه می‌گیری!</div>
                        </div>
                        <button class="btn" onclick="ui.closeModal()">فهمیدم، بریم! 🚀</button>
                    `;
                    bindFallbacks(content);
                } else if (type === 'stage-complete') {
                    // پایان یک بخش — بدون سکه (سکه فقط پایان کل بازی)
                    content.innerHTML = `
                        <h2>${data.icon} بخش «${data.name}» فتح شد!</h2>
                        <div class="stage-badge">🛡️</div>
                        <p>${data.done} چالش از این بخش رو با موفقیت حل کردی!</p>
                        <p>بخش بعدی: <strong>${data.next}</strong></p>
                        <button class="btn" onclick="game.continueToNextStage()">⚡ ادامه ماموریت</button>
                    `;
                    this.createConfetti(24);
                } else if (type === 'session-complete') {
                    const perfect = data.levels || 12;
                    const stars = data.hypo <= perfect + 3 ? 3 : (data.hypo <= perfect * 2 ? 2 : 1);
                    const starIcons = [1, 2, 3]
                        .map(i => `<span class="star${i <= stars ? '' : ' off'}">⭐</span>`)
                        .join('');
                    content.innerHTML = `
                        <h2>🎉 ماموریت با موفقیت انجام شد!</h2>
                        <div class="mini-hero">
                            <img src="./icons/gamer.png" class="hero-img" data-fallback="hero" alt="لوکو">
                        </div>
                        <div class="stars-row">${starIcons}</div>
                        <p>هر <strong>${data.levels}</strong> مرحله کامل شد!</p>
                        <p>امتیاز این جلسه: <strong>${data.score}</strong></p>
                        <p>فرضیه‌های تست شده: <strong>${data.hypo}</strong></p>
                        <div class="coin-reward">
                            <img src="./icons/coin.png" class="coin-reward-img" data-fallback="coin" alt="سکه">
                            +${data.reward} سکه لوکو
                        </div>
                        <button class="btn" onclick="game.startSession(); ui.closeModal();">🎮 بازی دوباره</button>
                        <button class="btn btn-help" onclick="ui.showPage('landing-page'); ui.closeModal();">🏠 بازگشت</button>
                    `;
                    bindFallbacks(content);
                    this.createConfetti(50);
                }
            },
            closeModal() {
                document.getElementById('modal-overlay').style.display = 'none';
            },
            createConfetti(count = 50) {
                for (let i = 0; i < count; i++) {
                    const c = document.createElement('div');
                    c.className = 'confetti';
                    c.style.left = Math.random() * 100 + 'vw';
                    c.style.background = `hsl(${Math.random() * 360}, 100%, 50%)`;
                    c.style.animationDelay = Math.random() * 2 + 's';
                    document.body.appendChild(c);
                    setTimeout(() => c.remove(), 5000);
                }
            }
        };

        // --- موتور تولید الگو (انواع اصلی حفظ شده + نوع نزولی برای بخش سخت) ---
        const patterns = {
            generate(type, difficulty = 1) {
                const d = difficulty;
                let sequence = [];
                let ruleText = "";
                let options = [];
                let correctRule = null;

                if (type === 'arithmetic') {
                    const maxStart = d === 1 ? 5 : (d === 2 ? 10 : 20);
                    const minStep = d === 3 ? 2 : 1;
                    const maxStep = d === 1 ? 3 : (d === 2 ? 5 : 6);
                    const start = Math.floor(Math.random() * (maxStart + 1));
                    const step = Math.floor(Math.random() * (maxStep - minStep + 1)) + minStep;
                    for (let i = 0; i < 5; i++) sequence.push(start + i * step);
                    correctRule = { type: 'add', val: step };
                    ruleText = `قانون: +${step}`;
                    options = [
                        { text: `قانون: +${step}`, rule: correctRule, correct: true },
                        { text: `قانون: +${step + 1}`, rule: { type: 'add', val: step + 1 }, correct: false },
                        { text: `قانون: ×2`, rule: { type: 'mul', val: 2 }, correct: false }
                    ];
                } else if (type === 'subtraction') {
                    // نوع جدید — فقط بخش ۳ (قلعه ویروس)
                    const start = Math.floor(Math.random() * 21) + 20;
                    const step = Math.floor(Math.random() * 4) + 2;
                    for (let i = 0; i < 5; i++) sequence.push(start - i * step);
                    correctRule = { type: 'sub', val: step };
                    ruleText = `قانون: −${step}`;
                    options = [
                        { text: `قانون: −${step}`, rule: correctRule, correct: true },
                        { text: `قانون: −${step + 1}`, rule: { type: 'sub', val: step + 1 }, correct: false },
                        { text: `قانون: +${step}`, rule: { type: 'add', val: step }, correct: false }
                    ];
                } else if (type === 'multiplication') {
                    const start = Math.floor(Math.random() * 3) + 1;
                    const factor = (d === 3 && Math.random() < 0.5) ? 3 : 2;
                    for (let i = 0; i < 5; i++) sequence.push(start * Math.pow(factor, i));
                    correctRule = { type: 'mul', val: factor };
                    ruleText = `قانون: ×${factor}`;
                    options = [
                        { text: `قانون: ×${factor}`, rule: correctRule, correct: true },
                        { text: `قانون: +${factor}`, rule: { type: 'add', val: factor }, correct: false },
                        { text: `قانون: ×${factor + 1}`, rule: { type: 'mul', val: factor + 1 }, correct: false }
                    ];
                } else if (type === 'periodic') {
                    const a = Math.floor(Math.random() * 3) + 1 + (d - 1) * 2;
                    const b = Math.floor(Math.random() * 3) + 4 + (d - 1) * 2;
                    for (let i = 0; i < 5; i++) sequence.push(i % 2 === 0 ? a : b);
                    correctRule = { type: 'cycle', val: [a, b] };
                    ruleText = `تکرار ${a} و ${b}`;
                    options = [
                        { text: `تکرار ${a} و ${b}`, rule: correctRule, correct: true },
                        { text: `تکرار ${a} و ${b + 1}`, rule: { type: 'cycle', val: [a, b + 1] }, correct: false },
                        { text: `قانون: +1`, rule: { type: 'add', val: 1 }, correct: false }
                    ];
                } else if (type === 'shapes') {
                    const shapes = ['circle', 'square', 'triangle'];
                    const s1 = shapes[Math.floor(Math.random() * 3)];
                    let s2 = shapes[Math.floor(Math.random() * 3)];
                    if (s1 === s2) s2 = 'star';
                    for (let i = 0; i < 5; i++) sequence.push(i % 2 === 0 ? s1 : s2);
                    correctRule = { type: 'shape_cycle', val: [s1, s2] };
                    ruleText = `تناوب شکل‌ها`;
                    options = [
                        { text: `الگوی تناوبی`, rule: correctRule, correct: true },
                        { text: `فقط ${s1}`, rule: { type: 'shape_cycle', val: [s1, s1] }, correct: false },
                        { text: `الگوی تصادفی`, rule: { type: 'random' }, correct: false }
                    ];
                }

                // مخلوط کردن گزینه‌ها
                options.sort(() => Math.random() - 0.5);

                return {
                    fullSequence: sequence,
                    displaySequence: [...sequence.slice(0, 3), null, sequence[4]],
                    gapIndex: 3,
                    correctRule: correctRule,
                    options: options,
                    type: type
                };
            }
        };

        // --- هسته اصلی بازی (سیستم مرحله‌ای) ---
        const game = {
            // [نینجا] ۳ بخش × ۴ مرحله = ۱۲ مرحله با سختی تدریجی
            stageConfig: [
                { icon: '🔢', name: 'پادگان اعداد',  levels: 4, difficulty: 1, types: ['arithmetic'] },
                { icon: '🌿', name: 'جنگل الگوها',   levels: 4, difficulty: 2, types: ['periodic', 'multiplication'] },
                { icon: '🏰', name: 'قلعه ویروس',    levels: 4, difficulty: 3, types: ['arithmetic', 'subtraction', 'multiplication', 'shapes'] }
            ],
            currentStage: 0,
            levelInStage: 0,
            levelsDone: 0,
            sessionScore: 0,
            sessionHypo: 0,
            levelHypo: 0,
            currentPattern: null,
            initialCoins: 0, // [LOKO] اسنپ‌شات سکه در شروع بازی

            get stage() { return this.stageConfig[this.currentStage]; },
            get totalLevels() { return this.stageConfig.reduce((s, st) => s + st.levels, 0); },

            startSession() {
                this.currentStage = 0;
                this.levelInStage = 0;
                this.levelsDone = 0;
                this.sessionScore = 0;
                this.sessionHypo = 0;
                this.initialCoins = coinSystem.get(); // [LOKO] پاداش بر اساس سکه‌ی لحظه شروع
                stats.load();
                ui.showPage('game-page');
                this.loadLevel();
            },

            loadLevel() {
                this.levelHypo = 0;
                const cfg = this.stage;
                const type = cfg.types[Math.floor(Math.random() * cfg.types.length)];
                this.currentPattern = patterns.generate(type, cfg.difficulty);
                this.updateLevelUI();
            },

            updateLevelUI() {
                const overall = this.levelsDone + 1;
                document.getElementById('level-indicator').innerText =
                    `${this.stage.icon} ${this.stage.name} • مرحله ${overall} از ${this.totalLevels}`;
                document.getElementById('progress-fill').style.width =
                    `${(overall / this.totalLevels) * 100}%`;
                
                const container = document.getElementById('sequence-container');
                container.innerHTML = '';
                
                this.currentPattern.displaySequence.forEach((item, idx) => {
                    const div = document.createElement('div');
                    div.className = 'pattern-item' + (item === null ? ' empty' : '');
                    div.id = `item-${idx}`;
                    
                    if (item !== null) {
                        div.innerHTML = this.renderContent(item);
                    } else {
                        div.innerText = '?';
                    }
                    container.appendChild(div);
                });

                const optContainer = document.getElementById('options-container');
                optContainer.innerHTML = '';
                this.currentPattern.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'hypothesis-btn';
                    btn.innerHTML = `<span class="rule-icon">🔍</span> ${opt.text}`;
                    btn.onclick = () => this.testHypothesis(opt);
                    optContainer.appendChild(btn);
                });

                document.getElementById('simulation-status').innerText = 'یک فرضیه انتخاب کن...';
            },

            renderContent(val) {
                if (typeof val === 'number') return val;
                const shapes = {
                    circle: '<svg class="shape-svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="#00D2FF"/></svg>',
                    square: '<svg class="shape-svg" viewBox="0 0 100 100"><rect x="15" y="15" width="70" height="70" fill="#FFC93C"/></svg>',
                    triangle: '<svg class="shape-svg" viewBox="0 0 100 100"><polygon points="50,10 90,90 10,90" fill="#00FF9D"/></svg>',
                    star: '<svg class="shape-svg" viewBox="0 0 100 100"><polygon points="50,5 63,38 98,38 70,59 78,95 50,75 22,95 30,59 2,38 37,38" fill="#FF00A0"/></svg>'
                };
                return shapes[val] || val;
            },

            testHypothesis(option) {
                this.levelHypo++;
                this.sessionHypo++;
                stats.data.totalHypothesesTested++;

                const gapIdx = this.currentPattern.gapIndex;
                const gapElement = document.getElementById(`item-${gapIdx}`);
                const statusText = document.getElementById('simulation-status');

                let simulatedValue;
                const rule = option.rule;
                const prevVal = this.currentPattern.displaySequence[gapIdx - 1];

                if (rule.type === 'add') simulatedValue = prevVal + rule.val;
                else if (rule.type === 'mul') simulatedValue = prevVal * rule.val;
                else if (rule.type === 'sub') simulatedValue = prevVal - rule.val; // نوع نزولی (بخش ۳)
                else if (rule.type === 'cycle') simulatedValue = (gapIdx % 2 === 0) ? rule.val[0] : rule.val[1];
                else if (rule.type === 'shape_cycle') simulatedValue = (gapIdx % 2 === 0) ? rule.val[0] : rule.val[1];
                else simulatedValue = "!";

                gapElement.innerHTML = this.renderContent(simulatedValue);
                gapElement.classList.add('simulated');

                if (option.correct) {
                    gapElement.className = 'pattern-item correct';
                    statusText.innerText = '✅ عالیه! این قانون درست کار می‌کنه.';
                    ui.showToast("🎉 آفرین! قانون رو کشف کردی!", "success");
                    
                    // فرمول امتیاز اصلی — بدون تغییر
                    let points = Math.max(0, 10 - (this.levelHypo - 1) * 2);
                    this.sessionScore += points;
                    if (this.levelHypo === 1) stats.data.totalFirstTrySuccess++;

                    // پاداش نامنظم (۳۰٪ احتمال) — بدون تغییر
                    if(Math.random() < 0.3) {
                        ui.showToast("💎 پاداش ویژه: تو یک الماس پیدا کردی!", "success");
                    }

                    setTimeout(() => this.nextLevel(), 1500);
                } else {
                    gapElement.className = 'pattern-item wrong';
                    statusText.innerText = '❌ نه، این قانون با سیستم همخوانی نداره.';
                    ui.showToast("🤔 این قانون نیست، دوباره فکر کن!", "error");
                }
                
                stats.save();
            },

            nextLevel() {
                this.levelsDone++;
                this.levelInStage++;
                if (this.levelInStage < this.stage.levels) {
                    this.loadLevel();
                } else if (this.currentStage < this.stageConfig.length - 1) {
                    this.showStageComplete();
                } else {
                    this.finishSession();
                }
            },

            showStageComplete() {
                const next = this.stageConfig[this.currentStage + 1];
                ui.showModal('stage-complete', {
                    icon: this.stage.icon,
                    name: this.stage.name,
                    done: this.stage.levels,
                    next: `${next.icon} ${next.name}`
                });
            },

            continueToNextStage() {
                this.currentStage++;
                this.levelInStage = 0;
                ui.closeModal();
                stats.save();
                this.loadLevel();
            },

            finishSession() {
                stats.data.totalGames++;
                stats.data.totalScore += this.sessionScore;
                stats.data.totalLevelsCompleted = (stats.data.totalLevelsCompleted || 0) + this.totalLevels;
                if (this.sessionScore > stats.data.bestScore) stats.data.bestScore = this.sessionScore;
                stats.save();

                // [LOKO] پاداش سکه لوکو — فقط پس از اتمام "تمام" ۱۲ مرحله:
                // اسنپ‌شات شروع 0 بود → +10 / بیشتر از 0 بود → +1
                const reward = (this.initialCoins === 0) ? 10 : 1;
                coinSystem.add(reward);

                ui.showModal('session-complete', {
                    score: this.sessionScore,
                    hypo: this.sessionHypo,
                    levels: this.totalLevels,
                    reward: reward
                });
            }
        };

        // مقداردهی اولیه
        window.onload = () => {
            stats.load();
            coinSystem.updateDisplay();
            network.init();
            bindFallbacks(document); // [LOKO] چک تصاویر (coin / gamer) و فعال‌سازی fallback در صورت نیاز
            stats.updateUI();
            console.log("%c[نینجا]: بازی با موفقیت بارگذاری شد. ۱۲ مرحله در ۳ بخش آماده است!", "color: #00D2FF; font-weight: bold;");
        };
    </script>
</body>
