  <path d="M 105 218 L 135 218 L 135 224 Q 135 228 130 228 L 105 228 Z" fill="#fff" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="72" y1="223" x2="92" y2="223" stroke="#dc2626" stroke-width="1.5"/>
