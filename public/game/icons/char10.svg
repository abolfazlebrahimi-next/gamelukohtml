<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <linearGradient id="c10body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="c10head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="burgerBig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
  </defs>
  <ellipse cx="100" cy="220" rx="68" ry="10" fill="#000" opacity="0.3"/>
  <!-- Big burger in hand -->
  <ellipse cx="148" cy="158" rx="18" ry="6" fill="#fbbf24" stroke="#78350f" stroke-width="1.5"/>
  <rect x="132" y="158" width="32" height="5" fill="#84cc16" stroke="#365314" stroke-width="1"/>
  <ellipse cx="148" cy="170" rx="18" ry="6" fill="url(#burgerBig)" stroke="#450a0a" stroke-width="1.5"/>
  <ellipse cx="148" cy="178" rx="18" ry="5" fill="#ef4444" stroke="#7f1d1d" stroke-width="1"/>
  <ellipse cx="148" cy="185" rx="18" ry="6" fill="#fbbf24" stroke="#78350f" stroke-width="1.5"/>
  <!-- Body (round, big belly) -->
  <path d="M 55 145 Q 50 130 100 125 Q 150 130 145 145 Q 155 175 148 200 Q 148 210 140 210 L 60 210 Q 52 210 52 200 Q 45 175 55 145 Z" fill="url(#c10body)"/>
  <!-- Belt straining -->
  <rect x="55" y="180" width="90" height="6" fill="#1e293b"/>
  <rect x="95" y="180" width="10" height="6" fill="#fbbf24"/>
  <!-- Stains -->
  <ellipse cx="80" cy="165" rx="8" ry="5" fill="#dc2626" opacity="0.5"/>
  <ellipse cx="120" cy="172" rx="10" ry="6" fill="#fbbf24" opacity="0.5"/>
  <ellipse cx="100" cy="195" rx="6" ry="4" fill="#84cc16" opacity="0.5"/>
  <!-- Head (round, double chin) -->
  <ellipse cx="100" cy="92" rx="36" ry="38" fill="url(#c10head)"/>
  <!-- Double chin -->
  <path d="M 75 115 Q 100 125 125 115 Q 125 122 100 126 Q 75 122 75 115 Z" fill="#facc15"/>
  <!-- Bald-ish with messy tufts -->
  <path d="M 65 78 Q 60 55 85 55 Q 100 45 115 55 Q 140 55 135 78 Q 130 65 100 65 Q 70 65 65 78 Z" fill="#7c2d12"/>
  <path d="M 75 65 L 72 55 M 125 65 L 128 55 M 100 50 L 100 42" stroke="#7c2d12" stroke-width="4" stroke-linecap="round"/>
  <!-- Greasy forehead shine -->
  <ellipse cx="100" cy="75" rx="15" ry="3" fill="#fff" opacity="0.4"/>
  <!-- Tired small eyes -->
  <ellipse cx="85" cy="92" rx="4" ry="3" fill="#1e293b"/>
  <ellipse cx="115" cy="92" rx="4" ry="3" fill="#1e293b"/>
  <line x1="78" y1="86" x2="92" y2="86" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <line x1="108" y1="86" x2="122" y2="86" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <!-- Heavy eyebrows -->
  <path d="M 78 88 Q 86 84 94 88" stroke="#451a03" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 106 88 Q 114 84 122 88" stroke="#451a03" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Mouth chewing -->
  <path d="M 85 110 Q 100 118 115 110 Q 100 113 85 110 Z" fill="#7c2d12" stroke="#451a03" stroke-width="1.5"/>
  <!-- Crumbs on face -->
  <circle cx="80" cy="105" r="1.5" fill="#a16207"/>
  <circle cx="118" cy="108" r="1.5" fill="#a16207"/>
  <circle cx="125" cy="100" r="1" fill="#a16207"/>
  <!-- Rosy red nose -->
  <circle cx="100" cy="100" r="5" fill="#f87171" opacity="0.6"/>
  <!-- Arm holding burger (chubby) -->
  <ellipse cx="135" cy="160" rx="12" ry="18" fill="url(#c10body)" transform="rotate(20 135 160)"/>
  <ellipse cx="145" cy="155" rx="10" ry="8" fill="url(#c10head)"/>
  <!-- Other arm hanging -->
  <path d="M 60 150 Q 50 175 55 195" stroke="url(#c10head)" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- Legs -->
  <rect x="68" y="200" width="28" height="18" fill="#1e293b"/>
  <rect x="104" y="200" width="28" height="18" fill="#1e293b"/>
  <!-- Worn sandals -->
  <ellipse cx="82" cy="222" rx="14" ry="5" fill="#451a03" stroke="#1c0a02" stroke-width="1"/>
  <ellipse cx="118" cy="222" rx="14" ry="5" fill="#451a03" stroke="#1c0a02" stroke-width="1"/>
  <!-- Grease drip -->
  <path d="M 138 175 Q 138 180 140 182" stroke="#fbbf24" stroke-width="2" fill="none"/>
  <!-- Sweat drop -->
  <path d="M 60 95 Q 58 102 62 104 Q 66 102 64 95 Z" fill="#60a5fa" opacity="0.7"/>
</svg>
