<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <linearGradient id="c3body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="c3head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="helmetG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>
  <ellipse cx="100" cy="220" rx="70" ry="10" fill="#000" opacity="0.25"/>
  <!-- Bicycle helmet -->
  <path d="M 60 75 Q 60 45 100 45 Q 140 45 140 75 L 140 85 Q 130 70 100 70 Q 70 70 60 85 Z" fill="url(#helmetG)" stroke="#7f1d1d" stroke-width="2"/>
  <!-- Vent lines on helmet -->
  <line x1="75" y1="55" x2="78" y2="68" stroke="#7f1d1d" stroke-width="2"/>
  <line x1="100" y1="50" x2="100" y2="65" stroke="#7f1d1d" stroke-width="2"/>
  <line x1="125" y1="55" x2="122" y2="68" stroke="#7f1d1d" stroke-width="2"/>
  <!-- Body / cycling jersey -->
  <path d="M 65 130 Q 65 120 100 120 Q 135 120 135 130 L 140 200 Q 140 210 130 210 L 70 210 Q 60 210 60 200 Z" fill="url(#c3body)"/>
  <!-- Stripes -->
  <rect x="65" y="145" width="70" height="4" fill="#fff"/>
  <rect x="65" y="155" width="70" height="4" fill="#fbbf24"/>
  <!-- Head -->
  <circle cx="100" cy="85" r="32" fill="url(#c3head)"/>
  <!-- Hair under helmet -->
  <path d="M 70 80 Q 80 65 100 65 Q 120 65 130 80" fill="#3f2a1d"/>
  <!-- Sporty sunglasses -->
  <rect x="78" y="82" width="18" height="10" rx="3" fill="#1e293b" stroke="#0f172a" stroke-width="1"/>
  <rect x="104" y="82" width="18" height="10" rx="3" fill="#1e293b" stroke="#0f172a" stroke-width="1"/>
  <line x1="96" y1="86" x2="104" y2="86" stroke="#0f172a" stroke-width="2"/>
  <ellipse cx="83" cy="86" rx="3" ry="2" fill="#60a5fa" opacity="0.7"/>
  <ellipse cx="109" cy="86" rx="3" ry="2" fill="#60a5fa" opacity="0.7"/>
  <!-- Determined smile -->
  <path d="M 85 102 Q 100 110 115 102" stroke="#7c2d12" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Bike (visible portion) -->
  <circle cx="60" cy="210" r="22" fill="none" stroke="#1e293b" stroke-width="3"/>
  <circle cx="60" cy="210" r="4" fill="#1e293b"/>
  <line x1="60" y1="188" x2="60" y2="232" stroke="#475569" stroke-width="1"/>
  <line x1="38" y1="210" x2="82" y2="210" stroke="#475569" stroke-width="1"/>
  <!-- Arm holding handlebar -->
  <path d="M 60 145 Q 50 175 55 195" stroke="url(#c3head)" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- Legs -->
  <rect x="70" y="200" width="25" height="20" fill="#1e293b"/>
  <rect x="105" y="200" width="25" height="20" fill="#1e293b"/>
  <!-- Sneakers -->
  <ellipse cx="82" cy="222" rx="14" ry="5" fill="#fbbf24" stroke="#92400e" stroke-width="1.5"/>
  <ellipse cx="118" cy="222" rx="14" ry="5" fill="#fbbf24" stroke="#92400e" stroke-width="1.5"/>
  <!-- Speed lines -->
  <line x1="20" y1="160" x2="35" y2="160" stroke="#60a5fa" stroke-width="2" opacity="0.6"/>
  <line x1="15" y1="175" x2="30" y2="175" stroke="#60a5fa" stroke-width="2" opacity="0.5"/>
</svg>
