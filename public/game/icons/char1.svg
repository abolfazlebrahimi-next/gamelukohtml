<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <linearGradient id="c1body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="c1head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <ellipse cx="100" cy="220" rx="60" ry="10" fill="#000" opacity="0.25"/>
  <!-- Water bottle in hand -->
  <rect x="40" y="160" width="20" height="30" rx="4" fill="#0ea5e9" stroke="#0369a1" stroke-width="1.5"/>
  <rect x="44" y="155" width="12" height="6" fill="#0369a1"/>
  <ellipse cx="50" cy="175" rx="8" ry="3" fill="#7dd3fc"/>
  <!-- Body / sporty tank top -->
  <path d="M 65 130 Q 65 120 100 120 Q 135 120 135 130 L 140 200 Q 140 210 130 210 L 70 210 Q 60 210 60 200 Z" fill="url(#c1body)"/>
  <path d="M 80 120 L 100 135 L 120 120" stroke="#047857" stroke-width="3" fill="none"/>
  <!-- Number 1 on shirt -->
  <text x="100" y="165" font-family="Tahoma, sans-serif" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
  <!-- Head -->
  <circle cx="100" cy="85" r="35" fill="url(#c1head)"/>
  <!-- Sweatband -->
  <rect x="65" y="70" width="70" height="8" fill="#ef4444"/>
  <!-- Hair (short) -->
  <path d="M 68 70 Q 75 50 100 50 Q 125 50 132 70" fill="#3f2a1d"/>
  <!-- Eyes (bright) -->
  <ellipse cx="88" cy="88" rx="4" ry="5" fill="#1e293b"/>
  <ellipse cx="112" cy="88" rx="4" ry="5" fill="#1e293b"/>
  <circle cx="89" cy="86" r="1.5" fill="#fff"/>
  <circle cx="113" cy="86" r="1.5" fill="#fff"/>
  <!-- Big smile -->
  <path d="M 85 100 Q 100 115 115 100" stroke="#7c2d12" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Rosy cheeks (energetic) -->
  <circle cx="78" cy="98" r="5" fill="#f87171" opacity="0.5"/>
  <circle cx="122" cy="98" r="5" fill="#f87171" opacity="0.5"/>
  <!-- Strong arm flexing -->
  <path d="M 60 145 Q 50 165 55 180 L 70 175 Q 75 160 75 145 Z" fill="url(#c1body)" stroke="#047857" stroke-width="1.5"/>
  <!-- Legs / running shorts -->
  <rect x="65" y="200" width="30" height="20" fill="#1e293b"/>
  <rect x="105" y="200" width="30" height="20" fill="#1e293b"/>
  <!-- Sneakers -->
  <ellipse cx="80" cy="222" rx="15" ry="6" fill="#fbbf24" stroke="#92400e" stroke-width="1.5"/>
  <ellipse cx="120" cy="222" rx="15" ry="6" fill="#fbbf24" stroke="#92400e" stroke-width="1.5"/>
  <!-- Energy sparkle -->
  <path d="M 150 60 L 153 67 L 160 70 L 153 73 L 150 80 L 147 73 L 140 70 L 147 67 Z" fill="#fbbf24"/>
</svg>
