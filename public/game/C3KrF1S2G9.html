<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>امدادگر ماشین</title>
<style>
@font-face{font-family:Shoor;src:url('./fonts/ShoorRounded-Regular.ttf')}@font-face{font-family:Shoor;src:url('./fonts/ShoorRounded-ExtraBold.ttf');font-weight:800}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Shoor,Tahoma,sans-serif;color:#24324b;background:radial-gradient(circle at 12% 12%,#fff5c5,transparent 22%),linear-gradient(145deg,#daf8ff,#effcf1 55%,#fff0d9)}button,input{font:inherit}.wrap{max-width:1050px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.brand{font-size:clamp(20px,4vw,32px);font-weight:800;color:#275c83}.pill{background:#fff;border-radius:999px;padding:9px 15px;box-shadow:0 5px 16px #31536a18}.progress{height:12px;background:#d5e8e9;border-radius:99px;overflow:hidden;margin:14px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,#35c6a2,#55a8ff);transition:width .4s}.intro{background:#ffffffc9;border:2px solid #fff;border-radius:24px;padding:clamp(16px,4vw,26px);box-shadow:0 14px 35px #3e627515}.mission{display:flex;align-items:center;gap:15px}.pixel{font-size:44px;flex:none;animation:bob 2s infinite}@keyframes bob{50%{transform:translateY(-5px)}}.speech{background:#e8f8ff;padding:12px 16px;border-radius:18px;line-height:1.8;flex:1}.panel{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:12px;align-items:center;margin:16px 0}.lane{background:#ffffffc9;border:2px solid white;border-radius:20px;padding:14px;text-align:center;min-height:130px}.lane h3{margin:0 0 10px;color:#49708a}.nums{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.num{background:#fff4bc;border:2px solid #f0d568;border-radius:13px;padding:10px 14px;font-size:22px;font-weight:800;min-width:54px}.machine{background:linear-gradient(145deg,#5388ef,#8458df);color:white;border-radius:22px;text-align:center;padding:18px;box-shadow:0 12px 25px #576ee536}.machine .emoji{font-size:48px}.machine h2{margin:4px}.rule{display:inline-block;background:#ffffff2c;border-radius:99px;padding:6px 12px}.slots{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}.slot{width:58px;height:56px;border:3px dashed #98b4c9;border-radius:14px;background:#f8fdff;font-size:20px;font-weight:800;display:grid;place-items:center;cursor:pointer;touch-action:manipulation}.slot.filled{border-style:solid;background:#dff8ec;color:#21835c}.slot:focus,.choice:focus-visible,button:focus-visible{outline:3px solid #ffba4b;outline-offset:2px}.choices{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0}.choice,.btn{border:0;border-radius:15px;padding:12px 20px;font-weight:800;cursor:pointer;box-shadow:0 6px 0 #31425a20;transition:.18s}.choice{background:#fff;color:#344660;font-size:22px;min-width:72px;border:2px solid #dce8f0;touch-action:none}.choice:active{transform:scale(.96)}.choice.used{opacity:.45}.btn{background:#246fbd;color:#fff}.btn.secondary{background:#fff;color:#40566b}.btn:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.note{text-align:center;min-height:34px;font-weight:800;color:#3c718e}.note.good{color:#19865c}.note.bad{color:#c05a48}.type-fields{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.type-fields input{width:72px;text-align:center;border:2px solid #cbdce7;border-radius:12px;padding:10px;font-size:20px}.complete{text-align:center;padding:45px 15px}.complete .big{font-size:72px}.tiny{font-size:13px;color:#667b8f}.hide{display:none!important}@media(max-width:650px){.wrap{padding:12px}.panel{grid-template-columns:1fr;gap:8px}.machine{order:-1}.lane{min-height:95px}.mission{align-items:flex-start}.top{justify-content:center}.slot{width:53px;height:52px}}
</style></head><body><main class="wrap"><header class="top"><div class="brand">🚑 امدادگر ماشین‌های ریاضی</div><div class="pill">⭐ امتیاز: <b id="score">۰</b></div><div class="pill">مرحله <b id="stage">۱</b> از ۲۰</div></header><div class="progress"><i id="bar"></i></div><section id="game"><div class="intro"><div class="mission"><div class="pixel">🤖</div><div class="speech" id="talk"></div></div></div><div class="panel"><div class="lane"><h3>🚦 ورودی ماشین</h3><div class="nums" id="inputs"></div></div><div class="machine"><div class="emoji" id="machineIcon">🛠️</div><h2 id="machineName">ماشین جمع‌زن</h2><div class="rule" id="rule"></div></div><div class="lane"><h3>⚡ خروجی‌های خراب</h3><div class="slots" id="slots"></div></div></div><div class="tiny" id="modeLabel" style="text-align:center"></div><div class="choices" id="choices"></div><div class="note" id="note" aria-live="polite"></div><div class="actions"><button class="btn" id="check">بررسی جواب‌ها</button><button class="btn secondary" id="reset">پاک کردن پاسخ‌ها</button></div></section><section id="ending" class="intro complete hide"><div class="big">🏙️✨</div><h1>شهر دوباره زنده شد!</h1><p>آفرین قهرمان! همهٔ ماشین‌ها را تعمیر کردی. پیکسل به تو افتخار می‌کند!</p><p>امتیاز نهایی: <b id="finalScore"></b> ⭐</p><button class="btn" onclick="location.reload()">بازی دوباره</button></section></main>
<script>
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const configs=[['جمع‌زن','🧮','به هر ورودی ۳ تا اضافه کن.',x=>x+3,[2,5,7]],['کم‌کن','🧰','از هر ورودی ۲ تا کم کن.',x=>x-2,[5,8,11]],['دوبرابرکن','⚙️','هر ورودی را در ۲ ضرب کن.',x=>x*2,[2,4,7]],['سه‌تا جمع‌کن','🚜','به هر ورودی ۵ تا اضافه کن.',x=>x+5,[1,3,6]],['نیم‌کن','🔧','هر ورودی را نصف کن.',x=>x/2,[4,10,16]],['ماشین ضرب','🚕','هر ورودی را در ۳ ضرب کن.',x=>x*3,[2,4,6]],['ماشین ترکیبی','🛠️','اول ۲ تا کم کن، بعد دوبرابر کن.',x=>(x-2)*2,[4,6,9]],['ماشین جمع‌زن','🚒','به هر ورودی ۷ تا اضافه کن.',x=>x+7,[3,8,12]],['ماشین تقسیم','🚛','هر ورودی را بر ۲ تقسیم کن.',x=>x/2,[8,14,20]],['ماشین ویژه','🚀','هر ورودی را سه‌برابر کن و ۱ تا اضافه کن.',x=>x*3+1,[1,3,5]],['ماشین جمع‌زن','🧮','به هر ورودی ۴ تا اضافه کن.',x=>x+4,[7,11,15]],['ماشین کم‌کن','🚜','از هر ورودی ۶ تا کم کن.',x=>x-6,[12,16,21]],['ماشین ترکیبی','⚙️','هر ورودی را دوبرابر کن و ۳ تا اضافه کن.',x=>x*2+3,[3,6,9]],['ماشین نصف‌کن','🔧','هر ورودی را نصف کن.',x=>x/2,[18,26,34]],['ماشین ضرب','🚕','هر ورودی را در ۴ ضرب کن.',x=>x*4,[3,5,8]],['ماشین ترکیبی','🛠️','اول ۳ تا اضافه کن، بعد دوبرابر کن.',x=>(x+3)*2,[2,5,8]],['ماشین کم‌کن','🚒','از هر ورودی ۹ تا کم کن.',x=>x-9,[22,29,35]],['ماشین ویژه','🚀','هر ورودی را سه‌برابر کن و ۵ تا کم کن.',x=>x*3-5,[5,8,12]],['ماشین تقسیم','🚛','هر ورودی را بر ۳ تقسیم کن.',x=>x/3,[21,30,42]],['ماشین نهایی','🏁','هر ورودی را دوبرابر کن و ۷ تا اضافه کن.',x=>x*2+7,[11,18,25]]];
let level=0,score=0,answers=[],drag=null;const $=id=>document.getElementById(id);function render(){let [name,icon,rule,fn,ins]=configs[level];answers=Array(ins.length).fill(null);$('stage').textContent=fa(level+1);$('score').textContent=fa(score);$('bar').style.width=((level+1)/20*100)+'%';$('machineName').textContent=name;$('machineIcon').textContent=icon;$('rule').textContent=rule;$('inputs').innerHTML=ins.map(n=>`<span class="num">${fa(n)}</span>`).join('');$('slots').innerHTML=ins.map((_,i)=>`<button class="slot" data-i="${i}" aria-label="جایگاه پاسخ ${fa(i+1)}"></button>`).join('');const typed=level>=10;$('modeLabel').textContent=typed?'✍️ این بار خودت جواب‌ها را حساب کن و بنویس!':'🧲 عددهای پایین را در جای خالی مناسب بکش یا لمس کن.';$('choices').classList.toggle('hide',typed);$('choices').innerHTML='';$('talk').textContent=level===0?'سلام قهرمان! من پیکسل هستم. ماشین‌های شهر خراب شده‌اند؛ با کشف قانون هر ماشین، شهر را نجات بده!':level===10?'آفرین! تا اینجا خیلی خوب پیش اومدی. حالا وقتشه جواب‌ها رو خودت حساب کنی و بنویسی؛ من بهت اعتماد دارم!':'ماشین را بررسی کن و خروجی‌های گمشده را پیدا کن. هر ورودی را با قانون ماشین تغییر بده!';$('note').textContent='';$('note').className='note';if(!typed){let vals=ins.map(fn);let pool=[...vals];while(pool.length<6){let v=vals[Math.floor(Math.random()*vals.length)]+(Math.random()<.5?-2:2);if(!pool.includes(v))pool.push(v)}pool.sort(()=>Math.random()-.5);$('choices').innerHTML=pool.map(n=>`<button class="choice" draggable="true" data-val="${n}">${fa(n)}</button>`).join('');$('choices').querySelectorAll('.choice').forEach(c=>{c.addEventListener('dragstart',()=>drag=Number(c.dataset.val));c.addEventListener('click',()=>{drag=Number(c.dataset.val);$('note').textContent='حالا جای خالی را انتخاب کن.'})})}else{$('slots').innerHTML=ins.map((_,i)=>`<label><span class="tiny">خروجی ${fa(i+1)}</span><input inputmode="numeric" type="number" data-i="${i}" aria-label="پاسخ ${fa(i+1)}"></label>`).join('')}$('slots').querySelectorAll('.slot').forEach(s=>{s.addEventListener('dragover',e=>e.preventDefault());s.addEventListener('drop',e=>{e.preventDefault();answers[+s.dataset.i]=drag;updateSlots()});s.addEventListener('click',()=>{if(drag!==null){answers[+s.dataset.i]=drag;drag=null;updateSlots()}});s.addEventListener('contextmenu',e=>{e.preventDefault();answers[+s.dataset.i]=null;updateSlots()})})}
function updateSlots(){$('slots').querySelectorAll('.slot').forEach((s,i)=>{s.textContent=answers[i]===null?'':fa(answers[i]);s.classList.toggle('filled',answers[i]!==null)})}
$('check').onclick=()=>{const [, , ,fn,ins]=configs[level];let given;if(level>=10){given=[...$('slots').querySelectorAll('input')].map(x=>x.value.trim()===''?null:Number(x.value));}else given=answers.slice();if(given.some(x=>x===null||!Number.isFinite(x))){$('note').textContent='همهٔ خانه‌ها را کامل کن، قهرمان!';$('note').className='note bad';return}if(given.every((x,i)=>x===fn(ins[i]))){score+=10;$('score').textContent=fa(score);$('note').textContent='عالیه! ماشین تعمیر شد، شهر یک قدم نجات پیدا کرد! 🎉';$('note').className='note good';$('check').disabled=true;setTimeout(()=>{level++;if(level===20){$('game').classList.add('hide');$('ending').classList.remove('hide');$('finalScore').textContent=fa(score)}else{$('check').disabled=false;render()}},1050)}else{$('note').textContent='نزدیک شدی! قانون ماشین را دوباره با هر ورودی امتحان کن. 💪';$('note').className='note bad'}};$('reset').onclick=()=>{if(level>=10){$('slots').querySelectorAll('input').forEach(x=>x.value='')}else{answers.fill(null);updateSlots()}$('note').textContent='پاسخ‌ها پاک شدند؛ دوباره تلاش کن.'};render();
</script></body></html>
