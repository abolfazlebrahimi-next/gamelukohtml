<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <script>

(function () {
    'use strict';

    // Every game page loads this file. Keep the audio changes isolated here so
    // the game rules, layout, and other effects do not need to be changed.
    if (window.__lokoGameAudioController) return;
    window.__lokoGameAudioController = true;
    window.__lokoUseExternalBackgroundMusic = true;

    const TRACKS = [
        './musics/snowy.mp3',
        './musics/space.mp3',
        './musics/volcano.mp3'
    ];

    // Background music stays deliberately quiet. It is lowered again while
    // spoken guidance or another audio clip is playing.
    const BACKGROUND_VOLUME = 0.14;
    const DUCKED_VOLUME = 0.035;

    const mediaStates = new WeakMap();
    const speakingMedia = new Set();
    const speakingUtterances = new Set();
    const backgroundFiles = new Set([
        'abnabat.mp3',
        'first1.mp3',
        'forest.mp3',
        'jadooyi forest.mp3',
        'piano (1).mp3',
        'sami.mp3',
        'sami forest.mp3',
        'snowy.mp3',
        'space.mp3',
        'volcano.mp3',
        'z1.mp3'
    ]);

    let backgroundMusic = null;
    let trackIndex = 0;
    let musicStarted = false;
    let startAttemptInProgress = false;

    function getMediaState(media) {
        let state = mediaStates.get(media);
        if (!state) {
            state = {
                isLegacyBackground: false,
                isSilenced: false,
                previousVolume: 1,
                listenersAttached: false
            };
            mediaStates.set(media, state);
        }
        return state;
    }

    function getMediaSource(media) {
        return String(
            media.currentSrc ||
            media.getAttribute('src') ||
            media.src ||
            ''
        ).trim();
    }

    function getFileName(source) {
        if (!source) return '';
        try {
            const url = new URL(source, document.baseURI);
            return decodeURIComponent(url.pathname.split('/').pop() || '').toLowerCase();
        } catch (error) {
            return source.split('/').pop().split('?')[0].toLowerCase();
        }
    }

    function mediaId(media) {
        return String(media.id || media.getAttribute('name') || '').toLowerCase();
    }

    function isBackgroundMedia(media) {
        if (!media || media === backgroundMusic) return false;

        const id = mediaId(media);
        if (/^(bg|bgm|bgmusic|bg-music|theme-music|thememusic)$/.test(id)) return true;
        if (/(guide|voice|speech|narrat|intro|help|verse|tutorial|countdown|sfx|sound)/.test(id)) return false;

        const fileName = getFileName(getMediaSource(media));
        if (backgroundFiles.has(fileName)) return true;

        // Existing background elements are looped. Spoken clips and effects in
        // these games are one-shot, so this also covers dynamically created BGM.
        return media.loop === true && Boolean(fileName);
    }

    function isSpeakingMedia(media) {
        return media && media !== backgroundMusic && !isBackgroundMedia(media);
    }

    function updateBackgroundVolume() {
        if (!backgroundMusic) return;
        backgroundMusic.volume = speakingMedia.size > 0 || speakingUtterances.size > 0
            ? DUCKED_VOLUME
            : BACKGROUND_VOLUME;
    }

    function silenceLegacyBackground(media) {
        const state = getMediaState(media);
        if (!state.isSilenced) {
            state.previousVolume = media.volume;
            state.isSilenced = true;
        }
        if (media.volume !== 0) media.volume = 0;
    }

    function restoreNonBackgroundVolume(media) {
        const state = getMediaState(media);
        if (state.isSilenced) {
            state.isSilenced = false;
            media.volume = state.previousVolume;
        }
    }

    function stopSpeakingMedia(media) {
        speakingMedia.delete(media);
        trackedAudio.delete(media);
        updateBackgroundVolume();
    }

    function startSpeakingMedia(media) {
        if (!isSpeakingMedia(media)) return;
        speakingMedia.add(media);
        updateBackgroundVolume();
    }

    function registerMedia(media) {
        if (!media || !(media instanceof HTMLMediaElement)) return;

        const state = getMediaState(media);
        state.isLegacyBackground = isBackgroundMedia(media);

        if (state.isLegacyBackground) {
            speakingMedia.delete(media);
            silenceLegacyBackground(media);
        } else {
            restoreNonBackgroundVolume(media);
        }

        if (!state.listenersAttached) {
            state.listenersAttached = true;
            media.addEventListener('play', function () {
                registerMedia(media);
                startSpeakingMedia(media);
            });
            media.addEventListener('playing', function () {
                registerMedia(media);
                startSpeakingMedia(media);
            });
            media.addEventListener('pause', function () {
                stopSpeakingMedia(media);
            });
            media.addEventListener('ended', function () {
                stopSpeakingMedia(media);
            });
            media.addEventListener('emptied', function () {
                stopSpeakingMedia(media);
            });
            media.addEventListener('error', function () {
                stopSpeakingMedia(media);
            });
        }
    }

    function scanMediaElements(root) {
        if (!root || !root.querySelectorAll) return;
        if (root instanceof HTMLMediaElement) registerMedia(root);
        root.querySelectorAll('audio, video').forEach(registerMedia);
    }

    function patchMediaPlayback() {
        const mediaPrototype = window.HTMLMediaElement && HTMLMediaElement.prototype;
        if (!mediaPrototype) return;

        const nativePlay = mediaPrototype.play;
        if (typeof nativePlay === 'function' && !nativePlay.__lokoAudioPatched) {
            const patchedPlay = function () {
                registerMedia(this);
                const result = nativePlay.apply(this, arguments);
                if (result && typeof result.then === 'function') {
                    result.then(() => {
                        registerMedia(this);
                        if (!this.paused && !this.ended) startSpeakingMedia(this);
                    }).catch(() => {});
                } else if (!this.paused && !this.ended) {
                    startSpeakingMedia(this);
                }
                return result;
            };
            patchedPlay.__lokoAudioPatched = true;
            mediaPrototype.play = patchedPlay;
        }

        const nativePause = mediaPrototype.pause;
        if (typeof nativePause === 'function' && !nativePause.__lokoAudioPatched) {
            const patchedPause = function () {
                const result = nativePause.apply(this, arguments);
                stopSpeakingMedia(this);
                return result;
            };
            patchedPause.__lokoAudioPatched = true;
            mediaPrototype.pause = patchedPause;
        }

        // The original games sometimes reset their music volume after this
        // controller has silenced it. Keep only their old background track
        // silent without affecting voices or sound effects.
        const volumeDescriptor = Object.getOwnPropertyDescriptor(mediaPrototype, 'volume');
        if (volumeDescriptor && volumeDescriptor.get && volumeDescriptor.set && volumeDescriptor.configurable) {
            const patchedVolume = {
                configurable: true,
                enumerable: volumeDescriptor.enumerable,
                get: volumeDescriptor.get,
                set: function (value) {
                    if (isBackgroundMedia(this)) {
                        const state = getMediaState(this);
                        if (!state.isSilenced) {
                            state.previousVolume = value;
                            state.isSilenced = true;
                        }
                        volumeDescriptor.set.call(this, 0);
                    } else {
                        volumeDescriptor.set.call(this, value);
                    }
                }
            };
            Object.defineProperty(mediaPrototype, 'volume', patchedVolume);
        }
    }

    function attachSpeechSynthesisHooks() {
        const synth = window.speechSynthesis;
        if (!synth || typeof synth.speak !== 'function') return;

        const nativeSpeak = synth.speak.bind(synth);
        const nativeCancel = typeof synth.cancel === 'function' ? synth.cancel.bind(synth) : null;

        const wrappedSpeak = function (utterance) {
            let release = null;
            if (utterance) {
                speakingUtterances.add(utterance);
                updateBackgroundVolume();

                release = function () {
                    speakingUtterances.delete(utterance);
                    updateBackgroundVolume();
                };

                if (typeof utterance.addEventListener === 'function') {
                    utterance.addEventListener('end', release, { once: true });
                    utterance.addEventListener('error', release, { once: true });
                }
            }
            try {
                return nativeSpeak(utterance);
            } catch (error) {
                if (release) release();
                throw error;
            }
        };

        try {
            synth.speak = wrappedSpeak;
        } catch (error) {
            return;
        }

        if (nativeCancel) {
            try {
                synth.cancel = function () {
                    speakingUtterances.clear();
                    updateBackgroundVolume();
                    return nativeCancel();
                };
            } catch (error) {
                // Some browsers expose speechSynthesis.cancel as read-only.
            }
        }
    }

    // ---------------------------------------------------------------------
    // Shared guide controls
    // ---------------------------------------------------------------------
    // The game pages use several different guide/tutor implementations. A
    // small shared layer keeps the user-facing skip action consistent without
    // replacing any of the guides or their audio files.
    const GUIDE_TOKEN_PATTERN = /(?:guide|tutorial|help|narrat|intro|voice)/i;
    const GUIDE_LEAF_PATTERN = /(?:text|char|avatar|bubble|step|header|title|progress|bar|audio|skip|button|nav|dots|icon|img|hint|message|line|description|list)/i;
    const trackedAudio = new Set();
    let guideScanQueued = false;

    function isMediaElement(value) {
        return Boolean(
            value &&
            window.HTMLMediaElement &&
            value instanceof window.HTMLMediaElement
        );
    }

    function patchAudioConstructor() {
        const nativeAudio = window.Audio;
        if (typeof nativeAudio !== 'function' || nativeAudio.__lokoGuideAudioPatched) return;

        const trackedAudioConstructor = function () {
            const media = new nativeAudio(...arguments);
            trackedAudio.add(media);
            registerMedia(media);
            return media;
        };
        trackedAudioConstructor.prototype = nativeAudio.prototype;
        trackedAudioConstructor.__lokoGuideAudioPatched = true;
        try {
            window.Audio = trackedAudioConstructor;
        } catch (error) {
            // Audio can be read-only in a few embedded browsers.
        }
    }

    function stopGuidanceMedia() {
        const candidates = new Set(trackedAudio);
        speakingMedia.forEach(media => candidates.add(media));
        document.querySelectorAll('audio, video').forEach(media => candidates.add(media));

        // A few games keep a dynamically-created guide clip in a named
        // variable rather than in the DOM. Include those conventional names.
        [
            'guideAudio', 'tutorialAudio', 'helpAudio', 'introAudio',
            'voiceAudio', 'activeAudio', 'narratorAudio'
        ].forEach(name => {
            const media = window[name];
            if (isMediaElement(media)) candidates.add(media);
        });

        candidates.forEach(media => {
            if (!isMediaElement(media) || media === backgroundMusic || isBackgroundMedia(media)) return;
            try {
                media.pause();
                media.currentTime = 0;
            } catch (error) {}
            speakingMedia.delete(media);
        });

        const synth = window.speechSynthesis;
        if (synth && typeof synth.cancel === 'function') {
            try { synth.cancel(); } catch (error) {}
        }
        speakingUtterances.clear();
        updateBackgroundVolume();
    }

    function guideElementToken(element) {
        if (!element || element.nodeType !== 1) return '';
        return String(
            (element.id || '') + ' ' +
            (typeof element.className === 'string' ? element.className : '') + ' ' +
            (element.getAttribute('data-role') || '')
        ).toLowerCase();
    }

    function isGuideLikeElement(element) {
        return Boolean(
            element &&
            element.nodeType === 1 &&
            GUIDE_TOKEN_PATTERN.test(guideElementToken(element))
        );
    }

    function isGuideLeafElement(element) {
        return GUIDE_LEAF_PATTERN.test(guideElementToken(element));
    }

    function isMenuLikeElement(element) {
        let current = element;
        while (current && current !== document.body) {
            const token = guideElementToken(current);
            if (/(?:^|[\s_-])(?:menu|landing|home|main)(?:[\s_-]|screen|page|content|area|character|wrapper|view|$)/.test(token)) return true;
            current = current.parentElement;
        }
        return false;
    }

    function isElementVisible(element) {
        if (!element || element.nodeType !== 1) return false;
        let current = element;
        while (current && current.nodeType === 1) {
            if (current.hidden) return false;
            const classList = current.classList;
            if (classList && (
                classList.contains('hidden') ||
                classList.contains('d-none') ||
                classList.contains('is-hidden') ||
                classList.contains('invisible')
            )) return false;
            const stateClasses = classList && (
                classList.contains('active') ||
                classList.contains('show') ||
                classList.contains('open') ||
                classList.contains('visible')
            );
            const token = guideElementToken(current);
            if (
                classList &&
                (classList.contains('screen') || classList.contains('page')) &&
                !stateClasses &&
                !current.style.display
            ) return false;
            if (
                /(?:overlay|modal)/.test(token) &&
                !stateClasses &&
                !current.style.display
            ) return false;
            let style = null;
            try {
                style = window.getComputedStyle(current);
            } catch (error) {
                // A malformed page stylesheet should not disable guide controls.
            }
            if (style && (
                style.display === 'none' ||
                style.visibility === 'hidden'
            )) return false;
            current = current.parentElement;
        }
        return true;
    }

    function guideContainerScore(element) {
        const token = guideElementToken(element);
        let score = 0;
        if (/container|content|card|panel/.test(token)) score += 6;
        if (/wrapper|wrap|box/.test(token)) score += 4;
        if (/modal|overlay/.test(token)) score += 4;
        if (/screen|page|section/.test(token)) score += 1;
        if (isGuideLeafElement(element)) score -= 4;
        return score;
    }

    function isSkipControl(element) {
        if (!element || element.nodeType !== 1) return false;
        const identity = String(
            (element.id || '') + ' ' +
            (typeof element.className === 'string' ? element.className : '') + ' ' +
            (element.getAttribute('aria-label') || '')
        );
        const label = String(element.textContent || '');
        // Completion buttons often say «بزن بریم» too; only treat that
        // wording as a skip control when the control is explicitly named as
        // one. The visible Persian "رد کردن" label is unambiguous.
        return /(?:skip|guide-skip|tutorial-skip)/i.test(identity) || /رد\s*کردن/i.test(label);
    }

    // Button appearance belongs to each game. The shared controller only
    // moves the control below the guide and never injects a global skin.
    function addGuideButtonStyles() {}

    function guideActionScope(container) {
        let current = container;
        while (current && current !== document.body) {
            const token = guideElementToken(current);
            if (current !== container && /screen|page|modal|overlay/.test(token)) return current;
            current = current.parentElement;
        }
        return container;
    }

    function getGuideExitFunction(container) {
        const tokens = [];
        let current = container;
        while (current && current !== document.body) {
            tokens.push(guideElementToken(current));
            current = current.parentElement;
        }
        const token = tokens.join(' ');
        const names = [];
        if (/voice/.test(token)) names.push('skipVoiceGuide', 'finishVoiceGuide');
        if (/tutorial/.test(token)) {
            names.push('skipTutorial', 'tutorialSkip', 'finishTutorial', 'endTutorial', 'hideTutorialScreen');
        }
        if (/help/.test(token)) names.push('skipHelp', 'finishHelp', 'closeHelp', 'hideHelp');
        if (/intro/.test(token)) names.push('skipIntro', 'finishIntro', 'closeIntro');
        names.push('skipGuide', 'finishGuide', 'endGuide', 'closeGuide');

        const uniqueNames = [...new Set(names)];
        for (const name of uniqueNames) {
            if (typeof window[name] === 'function') return window[name];
        }
        return null;
    }

    function findGuideFallbackControl(container, skipButton) {
        const scope = guideActionScope(container);
        const controls = [...scope.querySelectorAll(
            'button, [role="button"], a, input[type="button"], input[type="submit"]'
        )].filter(control => control !== skipButton && isElementVisible(control));
        return controls.find(control => {
            const token = String(
                (control.id || '') + ' ' +
                (typeof control.className === 'string' ? control.className : '') + ' ' +
                (control.getAttribute('aria-label') || '') + ' ' +
                (control.getAttribute('data-go') || '') + ' ' +
                (control.getAttribute('data-back') || '') + ' ' +
                (control.getAttribute('onclick') || '') + ' ' +
                (control.textContent || '')
            );
            return /(?:close|back|home|بازگشت|بستن|فهمیدم|بزن\s*بریم|شروع|ورود)/i.test(token);
        }) || null;
    }

    function hideGuideAsLastResort(container) {
        if (!container) return;
        const scope = guideActionScope(container);
        scope.classList.remove('active', 'show', 'open', 'visible');
        if (/screen|overlay|modal/.test(guideElementToken(scope))) {
            scope.style.setProperty('display', 'none', 'important');
        }
    }

    function invokeGuideExit(button, container, event) {
        const exitFunction = getGuideExitFunction(container);
        if (exitFunction) {
            try {
                exitFunction(event);
                return true;
            } catch (error) {
                console.warn('Guide skip handler failed:', error);
            }
        }

        // Inline handlers can reference lexical variables or page-specific
        // objects (for example oceanGame), so retain them as a fallback.
        if (typeof button.onclick === 'function') {
            try {
                button.onclick.call(button, event);
                return true;
            } catch (error) {}
        }

        const fallback = findGuideFallbackControl(container, button);
        if (fallback) {
            try {
                if (!isElementVisible(fallback)) {
                    fallback.classList.remove('hidden');
                    fallback.style.removeProperty('display');
                }
                fallback.click();
                return true;
            } catch (error) {}
        }

        hideGuideAsLastResort(container);
        return false;
    }

    function bindGuideSkipButton(button, container, injected) {
        if (button.dataset.lokoGuideSkipBound === 'true') {
            if (button.dataset.lokoGuideContainer !== (container.id || '')) {
                button.dataset.lokoGuideContainer = container.id || '';
            }
            return;
        }
        button.dataset.lokoGuideSkipBound = 'true';
        button.dataset.lokoGuideInjected = injected ? 'true' : 'false';
        button.dataset.lokoGuideContainer = container.id || '';
        button.addEventListener('click', function (event) {
            stopGuidanceMedia();

            // Existing controls keep their page's listener when no shared
            // handler is available. Injected controls always need a route.
            const hasRoute = Boolean(getGuideExitFunction(container));
            if (!injected && !hasRoute) return;

            event.preventDefault();
            event.stopImmediatePropagation();
            invokeGuideExit(button, container, event);
        }, true);
    }

    function guideButtonStyleReference(container, skipButton) {
        const scope = guideActionScope(container);
        const controls = [...scope.querySelectorAll(
            'button, [role="button"], input[type="button"], input[type="submit"]'
        )].filter(control => control !== skipButton && !isSkipControl(control));
        const tokenFor = control => String(
            (control.id || '') + ' ' +
            (typeof control.className === 'string' ? control.className : '') + ' ' +
            (control.textContent || '')
        );
        const hasStyledAction = controls.some(control => /(?:next|start|continue|begin|action|cta|primary|secondary|gold|شروع|بعدی|ادامه|بزن\s*بریم|فهمیدم)/i.test(tokenFor(control)));
        const pool = hasStyledAction
            ? controls
            : controls.filter(control => !/(?:close|back|cancel|بستن|بازگشت|لغو)/i.test(tokenFor(control)));
        const score = control => {
            const token = tokenFor(control);
            let value = 0;
            if (/(?:next|start|continue|begin|action|cta|primary|secondary|gold|شروع|بعدی|ادامه|بزن\s*بریم|فهمیدم)/i.test(token)) value += 10;
            if (/(?:btn|button)/i.test(token)) value += 1;
            if (/(?:close|back|cancel|بستن|بازگشت|لغو)/i.test(token)) value -= 5;
            if (isElementVisible(control)) value += 2;
            return value;
        };
        pool.sort((a, b) => score(b) - score(a));
        return pool[0] || null;
    }

    function inheritGuideButtonClasses(button, container) {
        if (button.dataset.lokoGuideClassesCopied === 'true') return;
        const reference = guideButtonStyleReference(container, button);
        if (reference && typeof reference.className === 'string' && reference.className.trim()) {
            button.className = reference.className;
        }
        button.classList.add('loko-guide-skip');
        button.dataset.lokoGuideClassesCopied = 'true';
    }

    function prepareGuideSkipButton(button, container, injected) {
        if (!button || !container) return;
        const wasMoved = button.parentElement !== container;
        if (wasMoved) container.appendChild(button);

        const isInjected = injected || button.dataset.lokoGuideInjected === 'true';
        if (isInjected) inheritGuideButtonClasses(button, container);
        if (!button.classList.contains('loko-guide-skip')) {
            button.classList.add('loko-guide-skip');
        }
        if (button.hasAttribute('hidden')) button.removeAttribute('hidden');
        ['hidden', 'd-none', 'is-hidden', 'invisible'].forEach(className => {
            if (button.classList.contains(className)) button.classList.remove(className);
        });
        if (button.textContent !== '⏭️ رد کردن') button.textContent = '⏭️ رد کردن';
        if (button.getAttribute('aria-label') !== 'رد کردن راهنما') {
            button.setAttribute('aria-label', 'رد کردن راهنما');
        }
        if (button.tagName === 'BUTTON' && !button.getAttribute('type')) {
            button.setAttribute('type', 'button');
        }

        // Remove only inline visibility/position declarations that would keep
        // the control floating over the guide. Backgrounds, borders, fonts,
        // dimensions, and every class-defined style remain untouched.
        if (button.style.getPropertyValue('display') === 'none') {
            button.style.removeProperty('display');
        }
        if (isInjected || wasMoved) {
            ['position', 'inset', 'top', 'right', 'bottom', 'left', 'transform'].forEach(property => {
                if (button.style.getPropertyValue(property)) button.style.removeProperty(property);
            });
        }
        bindGuideSkipButton(button, container, isInjected);
    }

    function elementDepth(element) {
        let depth = 0;
        let current = element;
        while (current && current.parentElement) {
            depth += 1;
            current = current.parentElement;
        }
        return depth;
    }

    function guideGroupingElement(element) {
        let current = element.parentElement;
        while (current && current !== document.body) {
            const token = guideElementToken(current);
            if (isGuideLikeElement(current) && /screen|page|modal|overlay/.test(token)) return current;
            current = current.parentElement;
        }
        return null;
    }

    function guideContainersInDocument() {
        const candidates = [...document.querySelectorAll('body *')].filter(element => {
            if (!isGuideLikeElement(element) || isGuideLeafElement(element)) return false;
            if (/^(button|a|input|audio|video|svg|use|symbol|path|g|circle|line|polyline|polygon)$/i.test(element.tagName)) return false;
            if (element.namespaceURI === 'http://www.w3.org/2000/svg') return false;
            if (isMenuLikeElement(element)) return false;
            return isElementVisible(element);
        });

        // Prefer the semantic guide card/content element over its screen
        // wrapper, then skip descendants once a container has been selected.
        candidates.sort((a, b) => {
            const scoreDifference = guideContainerScore(b) - guideContainerScore(a);
            if (scoreDifference) return scoreDifference;
            return elementDepth(b) - elementDepth(a);
        });
        const selected = [];
        const grouped = new Set();
        candidates.forEach(candidate => {
            if (selected.some(selectedElement => selectedElement.contains(candidate))) return;
            if (selected.some(selectedElement => candidate.contains(selectedElement))) return;
            const group = guideGroupingElement(candidate);
            if (group && grouped.has(group)) return;
            if (group) grouped.add(group);
            selected.push(candidate);
        });
        return selected;
    }

    function guideSkipControlsInScope(container) {
        const scope = guideActionScope(container);
        return [...scope.querySelectorAll(
            'button, [role="button"], input[type="button"], input[type="submit"]'
        )].filter(control => isSkipControl(control) || control.classList.contains('loko-guide-skip'));
    }

    function scanGuideControls() {
        guideScanQueued = false;
        if (!document.body) return;
        addGuideButtonStyles();

        const containers = guideContainersInDocument();
        containers.forEach(container => {
            let skipButton = guideSkipControlsInScope(container)[0];

            if (!skipButton) {
                skipButton = document.createElement('button');
                skipButton.type = 'button';
                skipButton.className = 'loko-guide-skip';
                skipButton.textContent = '⏭️ رد کردن';
                container.appendChild(skipButton);
                prepareGuideSkipButton(skipButton, container, true);
            } else {
                prepareGuideSkipButton(skipButton, container, false);
            }

            // A previous scan may have created a button in a nested helper
            // wrapper before the semantic guide container became visible.
            // Keep one shared control per active guide scope and remove only
            // buttons created by this controller, never page-owned controls.
            guideSkipControlsInScope(container).forEach(control => {
                if (
                    control !== skipButton &&
                    control.dataset.lokoGuideInjected === 'true'
                ) control.remove();
            });
        });
    }

    function scheduleGuideScan() {
        if (guideScanQueued) return;
        guideScanQueued = true;
        const schedule = window.requestAnimationFrame || function (callback) {
            return window.setTimeout(callback, 0);
        };
        schedule(scanGuideControls);
    }

    function nextTrack() {
        if (!backgroundMusic) return;
        trackIndex = (trackIndex + 1) % TRACKS.length;
        backgroundMusic.src = TRACKS[trackIndex];
        backgroundMusic.load();
        updateBackgroundVolume();
        if (musicStarted) backgroundMusic.play().catch(() => {});
    }

    function createBackgroundMusic() {
        if (backgroundMusic) return backgroundMusic;

        backgroundMusic = document.createElement('audio');
        backgroundMusic.preload = 'auto';
        backgroundMusic.loop = false;
        backgroundMusic.setAttribute('aria-hidden', 'true');
        backgroundMusic.setAttribute('playsinline', '');
        backgroundMusic.dataset.lokoBackgroundMusic = 'true';
        backgroundMusic.src = TRACKS[trackIndex];
        backgroundMusic.addEventListener('ended', nextTrack);
        backgroundMusic.addEventListener('error', nextTrack);
        document.body.appendChild(backgroundMusic);
        updateBackgroundVolume();
        return backgroundMusic;
    }

    function startBackgroundMusic() {
        if (musicStarted || startAttemptInProgress) return;
        startAttemptInProgress = true;
        const music = createBackgroundMusic();
        let playResult;
        try {
            playResult = music.play();
        } catch (error) {
            startAttemptInProgress = false;
            return;
        }

        if (playResult && typeof playResult.then === 'function') {
            playResult.then(() => {
                musicStarted = true;
                startAttemptInProgress = false;
                removeUnlockListeners();
                updateBackgroundVolume();
            }).catch(() => {
                startAttemptInProgress = false;
            });
        } else {
            musicStarted = true;
            startAttemptInProgress = false;
            removeUnlockListeners();
            updateBackgroundVolume();
        }
    }

    function installUnlockListeners() {
        ['pointerdown', 'touchstart', 'keydown', 'click'].forEach(function (eventName) {
            document.addEventListener(eventName, startBackgroundMusic, { capture: true, passive: true });
        });
    }

    function removeUnlockListeners() {
        ['pointerdown', 'touchstart', 'keydown', 'click'].forEach(function (eventName) {
            document.removeEventListener(eventName, startBackgroundMusic, true);
        });
    }

    function init() {
        patchMediaPlayback();
        patchAudioConstructor();
        attachSpeechSynthesisHooks();
        scanMediaElements(document);
        scheduleGuideScan();

        const observer = new MutationObserver(function (mutations) {
            mutations.forEach(function (mutation) {
                mutation.addedNodes.forEach(function (node) {
                    scanMediaElements(node);
                });
                if (mutation.type === 'attributes') registerMedia(mutation.target);
            });
            scheduleGuideScan();
        });
        observer.observe(document.documentElement, {
            childList: true,
            subtree: true,
            attributes: true,
            attributeFilter: ['id', 'name', 'src', 'loop', 'class', 'style', 'hidden']
        });

        installUnlockListeners();
        window.addEventListener('pagehide', function () {
            if (backgroundMusic) backgroundMusic.pause();
        });
        window.addEventListener('pageshow', function () {
            if (musicStarted && backgroundMusic) backgroundMusic.play().catch(() => {});
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init, { once: true });
    } else {
        init();
    }
}());

        .answer-card.wrong { background: linear-gradient(145deg, var(--danger), #c0392b); color: white; border-color: var(--danger); animation: wrongShake 0.5s ease-out; }
        @keyframes wrongShake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }

        @keyframes trophyBounce { 0%, 100% { transform: translateY(0) rotate(-5deg); } 50% { transform: translateY(-15px) rotate(5deg); } }
        .end-title { font-size: 2rem; color: white; margin: 15px 0; text-shadow: 2px 2px 0 var(--dark); }

        .es1 { animation-delay: 0.5s; } .es2 { animation-delay: 1s; } .es3 { animation-delay: 1.5s; }
        @keyframes starEarn { 0% { transform: scale(0) rotate(-180deg); opacity: 0; } 60% { transform: scale(1.5) rotate(20deg); opacity: 1; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
        .game-info { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 12px; margin-bottom: 20px; }

        .confetti-container { position: absolute; width: 100%; height: 100%; overflow: hidden; pointer-events: none; z-index: 5; }

        @keyframes confettiFall { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }

        #shop-screen { padding: 20px; flex-direction: column; overflow-y: auto; }

        .shop-card { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 16px; padding: 15px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }

        .story-cloud.visible { opacity: 1; pointer-events: all; }

        @keyframes cloudBounce { 0% { transform: scale(0) translateY(50px); } 60% { transform: scale(1.1) translateY(-10px); } 100% { transform: scale(1) translateY(0); } }
        .cloud-text { font-size: 1.5rem; font-weight: 700; color: white; }

        @keyframes celebratePop { 0% { transform: scale(0) rotate(-10deg); } 60% { transform: scale(1.3) rotate(5deg); } 100% { transform: scale(1) rotate(0); } }

</div>

<script>
    // ============================================
    // LOKO System & LocalStorage
    // ============================================
    function getLS(key, fallback) {
        try { return JSON.parse(localStorage.getItem(key)) || fallback; }
        catch(e) { return fallback; }
    }
    function setLS(key, val) {
        try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
    }

    let lokoCoins = parseInt(getLS('loko_coins', 0)) || 0;
    let initialCoins = 0;
    let hasSeenIntro = getLS('loko_played_intro', false);

    const themes = [
        { id: 'default', name: 'فضای تاریک', price: 0, class: 'theme-default', color: 'linear-gradient(135deg, #0c0a14, #181225)' },
        { id: 'forest', name: 'جنگل سحرآمیز', price: 0, class: 'theme-forest', color: 'linear-gradient(135deg, #0f2f1a, #1a4029)' },
        { id: 'ocean', name: 'اقیانوس عمیق', price: 15, class: 'theme-ocean', color: 'linear-gradient(135deg, #0a1a2f, #12253e)' },
        { id: 'candy', name: 'سرزمین کندی', price: 20, class: 'theme-candy', color: 'linear-gradient(135deg, #2f0a1f, #3e1228)' }
    ];
    let ownedThemes = getLS('loko_themes', ['default', 'forest']);
    let activeTheme = getLS('loko_active_theme', 'forest');

    function applyTheme(themeId) {
        const theme = themes.find(t => t.id === themeId);
        if (theme) {
            document.body.className = theme.class;
            activeTheme = themeId;
            setLS('loko_active_theme', themeId);
        }
    }

    function renderShop() {
        const grid = document.getElementById('shop-grid');
        grid.innerHTML = '';
        themes.forEach(theme => {
            const isOwned = ownedThemes.includes(theme.id);
            const isActive = activeTheme === theme.id;
            const card = document.createElement('div');
            card.className = 'shop-card glass';
            card.innerHTML = `
                <div class="theme-preview" style="background: ${theme.color}"></div>
                <div class="theme-name">${theme.name}</div>
                <button class="btn-buy ${isActive ? 'selected-theme' : ''} ${!isOwned && lokoCoins < theme.price ? 'locked' : ''}" data-id="${theme.id}" data-price="${theme.price}">
                    ${isActive ? '✅ فعال' : isOwned ? 'انتخاب' : `<img src="./icons/coin.png" style="width:20px; height:20px;"> ${toPersianNum(theme.price)}`}
                </button>
            `;
            grid.appendChild(card);
        });

        document.querySelectorAll('.btn-buy').forEach(btn => {
            btn.addEventListener('click', () => {
                playClickSound();
                const id = btn.dataset.id;
                const price = parseInt(btn.dataset.price);
                if (ownedThemes.includes(id)) {
                    applyTheme(id);
                    renderShop();
                } else {
                    if (lokoCoins >= price) {
                        lokoCoins -= price;
                        ownedThemes.push(id);
                        setLS('loko_coins', lokoCoins);
                        setLS('loko_themes', ownedThemes);
                        applyTheme(id);
                        updateCoinUI();
                        renderShop();
                    }
                }
            });
        });
    }

    function updateCoinUI() {
        document.querySelectorAll('.coin-amount').forEach(el => {
            el.textContent = toPersianNum(lokoCoins);
        });
    }

    // ============================================
    // Images & Items
    // ============================================
    const itemImages = {
        "🥕": "./icons/havij.png",
        "🍎": "./icons/sib.png",
        "🎋": "./icons/bambo.png",
        "🍌": "./icons/moz.png",
        "🐟": "./icons/mahi.png",
        "🦴": "./icons/ostokhan.png"
    };

    const charImages = {
        "🐰": "./icons/khargosh.png",
        "🐵": "./icons/meimon.png",
        "🦊": "./icons/robah.png",
        "🐴": "./icons/asb.png",
        "🐘": "./icons/fil.png",
        "🐱": "./icons/gorbeh.png",
        "🐶": "./icons/sag.png",
        "🦒": "./icons/zarafe.png",
        "🐼": "./icons/panda.png"
    };

    // ============================================
    // Audio & Sounds
    // ============================================
    function toPersianNum(num) {
        const farsiDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
        return num.toString().replace(/\d/g, x => farsiDigits[x]);
    }

    const audioCache = {};
    let currentAudio = null;
    let bgMusic = document.getElementById('bg-music');

    function preloadAudioFiles() {
        const files = [
            "./musics/m1.mp3", "./musics/m2.mp3", "./musics/m3.mp3",
            "./musics/m4.mp3", "./musics/m5.mp3", "./musics/m6.mp3",
            "./musics/m7.mp3", "./musics/m8.mp3", "./musics/m9.mp3",
            "./musics/m10.mp3", "./musics/m11.mp3", "./musics/m12.mp3",
            "./musics/m13.mp3", "./musics/m14.mp3", "./musics/m15.mp3",
            "./musics/m16.mp3", "./musics/m17.mp3", "./musics/Rahnama.mp3"
        ];
        files.forEach(file => {
            const audio = new Audio(file);
            audio.preload = 'auto';
            audio.load();
            audioCache[file] = audio;
        });
    }

    let audioCtx;
    function playClickSound() {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g);
            g.connect(audioCtx.destination);
            o.frequency.value = 600;
            g.gain.setValueAtTime(0.1, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            o.start();
            o.stop(audioCtx.currentTime + 0.1);
        } catch(e) {}
    }

    function playAudio(filePath, startTime, endTime) {
        if (currentAudio) {
            currentAudio.pause();
            currentAudio.ontimeupdate = null;
        }

        if (!audioCache[filePath]) {
            audioCache[filePath] = new Audio(filePath);
        }
        currentAudio = audioCache[filePath];
        currentAudio.currentTime = 0;

        const startPlayback = () => {
            try {
                if (startTime && startTime > 0) currentAudio.currentTime = startTime;
                else currentAudio.currentTime = 0;
                currentAudio.play().catch(e => {});
            } catch (e) {}
        };

        if (currentAudio.readyState >= 1) startPlayback();
        else {
            currentAudio.addEventListener('loadedmetadata', startPlayback, { once: true });
            currentAudio.load();
        }

        if (endTime) {
            currentAudio.ontimeupdate = function() {
                if (currentAudio.currentTime >= endTime) {
                    currentAudio.pause();
                    currentAudio.ontimeupdate = null;
                }
            };
        }
    }

    function stopAudio() {
        if (currentAudio) {
            currentAudio.pause();
            currentAudio.ontimeupdate = null;
        }
    }

    // ============================================
    // Intro Logic
    // ============================================
    let introTimeouts = [];
    function playIntro(onComplete) {
        const overlay = document.getElementById('intro-overlay');
        const textEl = document.getElementById('intro-text');
        overlay.classList.add('active');
        
        stopAudio();
        bgMusic.pause();
        
        const introAudio = new Audio("./musics/Rahnama.mp3");
        currentAudio = introAudio;
        introAudio.play().catch(e => {});
        
        const timings = [
            { time: 0, text: "سلام من پیکسل هستم، راهنمای تو در این بازی" },
            { time: 4000, text: "۱. گوش کن به راوی که داستان می‌گه و راهنماییت می‌کنه." },
            { time: 9000, text: "۲. بِکِش و رها کن آیتم‌ها (مثل هویج یا سیب) رو به شخصیت مورد نظر." },
            { time: 17000, text: "۳ جواب بده به سؤال‌های ریاضی با کلیک روی کارت درست." },
            { time: 23000, text: "۴. بعد از ۵ داستان، امتیاز نهایی رو ببین و جشن بگیر!" },
            { time: 28000, text: "موفق باشی دوست من" }
        ];
        
        introTimeouts.forEach(t => clearTimeout(t));
        introTimeouts = [];
        
        timings.forEach(t => {
            const id = setTimeout(() => {
                textEl.style.opacity = '0';
                setTimeout(() => {
                    textEl.textContent = t.text;
                    textEl.style.opacity = '1';
                }, 400);
            }, t.time);
            introTimeouts.push(id);
        });
        
        const endId = setTimeout(() => {
            overlay.classList.remove('active');
            introAudio.pause();
            if (onComplete) onComplete();
        }, 31000);
        introTimeouts.push(endId);
    }

    function skipIntro() {
        introTimeouts.forEach(t => clearTimeout(t));
        introTimeouts = [];
        document.getElementById('intro-overlay').classList.remove('active');
        stopAudio();
        bgMusic.play().catch(e => {});
    }

    // ============================================
    // Game Logic
    // ============================================
    let gameState = {
        currentStory: 0,
        score: 0,
        currentStep: 0,
        draggedElement: null,
        offsetX: 0,
        offsetY: 0,
        itemsDraggedCount: 0,
        requiredDragCount: 0,
        stepTimeout: null,
        answerTimeout: null,
        celebrationTimeout: null
    };

    const stories = [
        {
            title: "خرگوش و میمون",
            steps: [
                {
                    narrator: "سلام کوچولو! امروز می‌خوایم با هم یه ماجراجویی ریاضی داشته باشیم!",
                    characters: [{ emoji: "🐰", name: "خرگوش", position: "left" }],
                    items: [],
                    action: "intro",
                    audio: { file: "./musics/m1.mp3", start: 0, end: 6 },
                    duration: 7000
                },
                {
                    narrator: "یه خرگوش کوچولوی عزیز سه تا هویج  داره! 🥕🥕🥕",
                    characters: [{ emoji: "🐰", name: "خرگوش", position: "left" }],
                    items: ["🥕", "🥕", "🥕"],
                    action: "show_items",
                    audio: { file: "./musics/m2.mp3", start: 0, end: 4 },
                    duration: 5000
                },
                {
                    narrator: " او یکی  از دوستاش اومد! یه میمون بامزه! 🐵",
                    characters: [
                        { emoji: "🐰", name: "خرگوش", position: "left" },
                        { emoji: "🐵", name: "میمون", position: "right" }
                    ],
                    items: ["🥕", "🥕", "🥕"],
                    action: "show_items",
                    audio: { file: "./musics/m3.mp3", start: 0, end: 4 },
                    duration: 5000
                },
                {
                    narrator: "میمون میگه: «من گرسنه‌ام! دو تا هویج می‌خوام!» میتونی دو تا هویج بهش بدی؟",
                    characters: [
                        { emoji: "🐰", name: "خرگوش", position: "left" },
                        { emoji: "🐵", name: "میمون", position: "right" }
                    ],
                    items: ["🥕", "🥕", "🥕"],
                    action: "drag_items",

    function startGame() {
        playClickSound();
        if (!hasSeenIntro) {
            setLS('loko_played_intro', true);
            hasSeenIntro = true;
            playIntro(startActualGame);
        } else {
            startActualGame();
        }
    }

    function startActualGame() {
        initialCoins = lokoCoins;
        bgMusic.volume = 0.15; 
        bgMusic.play().catch(e => {});
        document.getElementById('start-screen').classList.remove('active');
        document.getElementById('game-screen').classList.add('active');
        gameState.currentStory = 0;
        gameState.score = 0;
        loadStory(0);
    }

    function loadStory(storyIndex) {
        gameState.currentStory = storyIndex;
        gameState.currentStep = 0;
        const story = stories[storyIndex];
        
        // Update HUD Progress
        const progressEl = document.getElementById('hud-progress');
        if (progressEl) {
            progressEl.textContent = `داستان ${toPersianNum(storyIndex + 1)} از ${toPersianNum(stories.length)}`;
        }
        
        clearStage();
        loadStep(storyIndex, 0);
    }

    function loadStep(storyIndex, stepIndex) {
        const story = stories[storyIndex];
        const step = story.steps[stepIndex];
        
        if (gameState.stepTimeout) {
            clearTimeout(gameState.stepTimeout);
            gameState.stepTimeout = null;
        }
        
        updateNarrator(step.narrator);
        clearStage();

        if (step.characters) {
            displayCharacters(step.characters);
        }

        if (step.audio) {
            setTimeout(() => {
                playAudio(step.audio.file, step.audio.start, step.audio.end);
            }, 100);
        }

        switch (step.action) {
            case "intro":
                setTimeout(() => {
                    if (step.items && step.items.length > 0) {
                        displayItems(step.items);
                    }
                }, 1000);
                gameState.stepTimeout = setTimeout(() => nextStep(), step.duration || 5000);
                break;

            case "show_items":
                if (step.items && step.items.length > 0) {
                    displayItems(step.items);
                }
                gameState.stepTimeout = setTimeout(() => nextStep(), step.duration || 3000);
                break;

            case "drag_items":
                gameState.requiredDragCount = step.itemsToDrag || step.items.length;
                gameState.itemsDraggedCount = 0;
                displayItems(step.items);
                setupDragAndDrop(step);
                break;

            case "count":
                showAnswerCards(step);
                break;

            case "select_char":
                setupCharacterSelection(step);
                break;

            case "equal_stickers":
                showStickerOptions(step);
                break;

            case "celebrate":
                gameState.stepTimeout = setTimeout(() => {
                    showCelebration();
                    gameState.celebrationTimeout = setTimeout(() => {
                        if (storyIndex < stories.length - 1) {
                            showStoryCloud();
                        } else {
                            endGame();
                        }
                    }, 1500);
                }, step.duration || 2000);
                break;
        }
    }

    function updateNarrator(text) {
        const narratorText = document.getElementById('narrator-text');
        narratorText.style.opacity = '0';
        setTimeout(() => {
            narratorText.textContent = text;
            narratorText.style.opacity = '1';
        }, 200);
    }

    function displayCharacters(characters) {
        const stage = document.getElementById('game-stage');
        stage.innerHTML = '';
        characters.forEach((char, index) => {
            const charElement = document.createElement('div');
            charElement.className = 'character entering';
            charElement.id = `char-${index}`;
            charElement.dataset.emoji = char.emoji;
            charElement.style.animationDelay = `${index * 0.2}s`;
            
            let charVisual = '';
            if (charImages[char.emoji]) {
                charVisual = `<img src="${charImages[char.emoji]}" class="char-img" alt="${char.name}">`;
            } else {
                charVisual = `<div class="char-emoji">${char.emoji}</div>`;
            }
            
            charElement.innerHTML = `${charVisual}<div class="char-name">${char.name}</div>`;
            
            if (char.position === 'left') {
                charElement.style.order = index;
            } else {
                charElement.style.order = 10 + index;
            }
            stage.appendChild(charElement);
            
            setTimeout(() => {
                charElement.classList.remove('entering');
            }, 1000 + index * 200);
        });
    }

    function displayItems(items) {
        const itemsZone = document.getElementById('items-zone');
        itemsZone.innerHTML = '';
        itemsZone.classList.add('visible');
        items.forEach((item, index) => {
            const itemElement = document.createElement('div');
            itemElement.className = 'draggable-item';
            itemElement.dataset.item = item;
            itemElement.style.animationDelay = `${index * 0.1}s`;
            
            if (itemImages[item]) {
                itemElement.innerHTML = `<img src="${itemImages[item]}" alt="${item}">`;
            } else {
                itemElement.textContent = item;
            }
            
            itemsZone.appendChild(itemElement);
        });
    }

    function setupDragAndDrop(step) {
        const targetCharEmoji = step.targetChar;
        const targetCharElement = document.querySelector(`.character[data-emoji="${targetCharEmoji}"]`);

        if (targetCharElement) {
            targetCharElement.classList.add('drop-target');
        }

        const draggableItems = document.querySelectorAll('.draggable-item');
        draggableItems.forEach(item => {
            item.addEventListener('mousedown', startDrag);
            item.addEventListener('touchstart', startDrag, { passive: false });
        });

        document.addEventListener('mousemove', drag);
        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchmove', drag, { passive: false });
        document.addEventListener('touchend', endDrag);
    }

    function startDrag(e) {
        e.preventDefault();
        const target = e.target.closest('.draggable-item');
        if (!target) return;

        gameState.draggedElement = target;
        target.classList.add('dragging');

        const rect = target.getBoundingClientRect();
        const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
        const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;

        gameState.offsetX = clientX - rect.left;
        gameState.offsetY = clientY - rect.top;

        target.style.position = 'fixed';
        target.style.left = `${rect.left}px`;
        target.style.top = `${rect.top}px`;
        target.style.width = `${rect.width}px`;
        target.style.height = `${rect.height}px`;
        target.style.zIndex = '1000';
        target.style.animation = 'none';
    }

    function drag(e) {
        if (!gameState.draggedElement) return;
        e.preventDefault();

        const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
        const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;

        gameState.draggedElement.style.left = `${clientX - gameState.offsetX}px`;
        gameState.draggedElement.style.top = `${clientY - gameState.offsetY}px`;

        const target = document.querySelector('.drop-target');
        if (target) {
            const dropRect = target.getBoundingClientRect();
            const isOver = (
                clientX > dropRect.left &&
                clientX < dropRect.right &&
                clientY > dropRect.top &&
                clientY < dropRect.bottom
            );
            if (isOver) {
                target.classList.add('active');
            } else {
                target.classList.remove('active');
            }
        }
    }

    function endDrag(e) {
        if (!gameState.draggedElement) return;

        const clientX = e.type === 'touchend' ? e.changedTouches[0].clientX : e.clientX;
        const clientY = e.type === 'touchend' ? e.changedTouches[0].clientY : e.clientY;

        const target = document.querySelector('.drop-target');
        let dropped = false;

        if (target) {
            const dropRect = target.getBoundingClientRect();
            const isOver = (
                clientX > dropRect.left &&
                clientX < dropRect.right &&
                clientY > dropRect.top &&
                clientY < dropRect.bottom
            );

            if (isOver) {
                dropped = true;
                const item = gameState.draggedElement;
                
                const targetCenterX = dropRect.left + dropRect.width / 2;
                const targetCenterY = dropRect.top + dropRect.height / 2;
                
                item.style.transition = 'all 0.3s ease-out';
                item.style.left = `${targetCenterX - (item.offsetWidth / 2)}px`;
                item.style.top = `${targetCenterY - (item.offsetHeight / 2)}px`;
                item.style.transform = 'scale(0.2)';
                item.style.opacity = '0';

                target.classList.add('happy');
                setTimeout(() => target.classList.remove('happy'), 800);

                setTimeout(() => {
                    item.remove();
                }, 300);

                gameState.itemsDraggedCount++;
                target.classList.remove('active');

                if (gameState.itemsDraggedCount >= gameState.requiredDragCount) {
                    setTimeout(() => {
                        removeDragListeners();
                        nextStep();
                    }, 800);
                }
            }
        }

        if (!dropped) {
            const item = gameState.draggedElement;
            item.classList.remove('dragging');
            item.style.position = '';
            item.style.left = '';
            item.style.top = '';
            item.style.width = '';
            item.style.height = '';
            item.style.zIndex = '';
            item.style.transition = 'transform 0.2s ease';
            item.style.transform = '';
            item.style.animation = '';
            setTimeout(() => { item.style.transition = ''; }, 200);
        }

        if (target) target.classList.remove('active');
        gameState.draggedElement = null;
    }

    function removeDragListeners() {
        document.removeEventListener('mousemove', drag);
        document.removeEventListener('mouseup', endDrag);
        document.removeEventListener('touchmove', drag);
        document.removeEventListener('touchend', endDrag);
    }

    function showAnswerCards(step) {
        const cardsContainer = document.getElementById('answer-cards');
        cardsContainer.innerHTML = '';
        cardsContainer.classList.add('visible');

        step.answerOptions.forEach((option, index) => {
            const card = document.createElement('div');
            card.className = 'answer-card';
            card.textContent = toPersianNum(option);
            card.dataset.answer = option;
            card.style.animationDelay = `${index * 0.2}s`;
            card.addEventListener('click', () => handleCardAnswer(card, step));
            cardsContainer.appendChild(card);
        });
    }

    function handleCardAnswer(card, step) {
        playClickSound();
        let selectedAnswer = card.dataset.answer;
        let correctAnswer = step.correctAnswer;

        if (typeof correctAnswer === 'number') {
            selectedAnswer = Number(selectedAnswer);
        }

        const isCorrect = selectedAnswer === correctAnswer;
        const allCards = document.querySelectorAll('.answer-card');
        allCards.forEach(c => c.style.pointerEvents = 'none');

        const sticker = document.getElementById('sticker-feedback');

        if (isCorrect) {
            card.classList.add('correct');
            gameState.score += 10;
            makeCharactersHappy();
            playAudio("./musics/m6.mp3", 0, 3);
            sticker.textContent = "🎉";
        } else {
            card.classList.add('wrong');
            makeCharactersSad();
            playAudio("./musics/m7.mp3", 0, 4);
            sticker.textContent = "😳";
        }
        sticker.classList.add('show');
        
        gameState.answerTimeout = setTimeout(() => {
            sticker.classList.remove('show');
            hideAnswerCards();
            nextStep();
        }, 2500);
    }

    function setupCharacterSelection(step) {
        const characters = document.querySelectorAll('.character');
        characters.forEach(charEl => {
            charEl.classList.add('selectable');
            charEl.addEventListener('click', function handleSelect() {
                playClickSound();
                let selected = charEl.dataset.emoji;
                let correct = step.correctAnswer;
                
                characters.forEach(c => c.style.pointerEvents = 'none'); 
                
                const sticker = document.getElementById('sticker-feedback');
                if (selected === correct) {
                    gameState.score += 10;
                    charEl.classList.add('happy');
                    playAudio("./musics/m6.mp3", 0, 3);
                    sticker.textContent = "🎉";
                } else {
                    charEl.classList.add('sad');
                    playAudio("./musics/m7.mp3", 0, 4);
                    sticker.textContent = "😳";
                }
                sticker.classList.add('show');
                
                gameState.answerTimeout = setTimeout(() => {
                    sticker.classList.remove('show');
                    characters.forEach(c => c.classList.remove('selectable'));
                    nextStep();
                }, 2500);
            });
        });
    }

    function showStickerOptions(step) {
        const cardsContainer = document.getElementById('answer-cards');
        cardsContainer.innerHTML = '';
        cardsContainer.classList.add('visible');

        step.answerOptions.forEach((option, index) => {
            const card = document.createElement('div');
            card.className = 'sticker-option';
            card.textContent = option;
            card.dataset.answer = option;
            card.style.animationDelay = `${index * 0.2}s`;
            card.addEventListener('click', () => handleStickerAnswer(card, step));
            cardsContainer.appendChild(card);
        });
    }

    function handleStickerAnswer(card, step) {
        playClickSound();
        let selectedAnswer = card.dataset.answer;
        const isCorrect = selectedAnswer === step.correctAnswer;
        const allCards = document.querySelectorAll('.sticker-option');
        allCards.forEach(c => c.style.pointerEvents = 'none');

        const sticker = document.getElementById('sticker-feedback');
        
        if (isCorrect) {
            card.style.borderColor = 'var(--neon-green)';
            gameState.score += 10;
            makeCharactersHappy();
            playAudio("./musics/m6.mp3", 0, 3);
            sticker.textContent = "🎉";
        } else {
            card.style.borderColor = 'var(--danger)';
            makeCharactersSad();
            playAudio("./musics/m7.mp3", 0, 4);
            sticker.textContent = "😳";
        }
        sticker.classList.add('show');
        
        document.getElementById('answer-cards').classList.remove('visible'); 

        gameState.answerTimeout = setTimeout(() => {
            sticker.classList.remove('show');
            nextStep();
        }, 2500);
    }

    function makeCharactersHappy() {
        const characters = document.querySelectorAll('.character');
        characters.forEach(char => {
            char.classList.add('happy');
            setTimeout(() => char.classList.remove('happy'), 1000);
        });
    }

    function makeCharactersSad() {
        const characters = document.querySelectorAll('.character');
        characters.forEach(char => {
            char.classList.add('sad');
            setTimeout(() => char.classList.remove('sad'), 1000);
        });
    }

    function hideAnswerCards() {
        const cardsContainer = document.getElementById('answer-cards');
        cardsContainer.classList.remove('visible');
    }

    function nextStep() {
        const story = stories[gameState.currentStory];
        if (gameState.currentStep < story.steps.length - 1) {
            gameState.currentStep++;
            loadStep(gameState.currentStory, gameState.currentStep);
        } else {
            if (gameState.currentStory < stories.length - 1) {
                showStoryCloud();
            } else {
                endGame();
            }
        }
    }

    function showStoryCloud() {
        const cloud = document.getElementById('story-cloud');
        if (!cloud) return;
        cloud.classList.add('visible');
        setTimeout(() => {
            cloud.classList.remove('visible');
            gameState.currentStory++;
            loadStory(gameState.currentStory);
        }, 2500);
    }

    function showCelebration() {
        const celebration = document.getElementById('celebration');
        if (!celebration) return;
        celebration.classList.add('visible');
        setTimeout(() => {
            celebration.classList.remove('visible');
        }, 2000);
    }

    function clearStage() {
        stopAudio();
        removeDragListeners();
        
        if (gameState.stepTimeout) clearTimeout(gameState.stepTimeout);
        if (gameState.answerTimeout) clearTimeout(gameState.answerTimeout);
        if (gameState.celebrationTimeout) clearTimeout(gameState.celebrationTimeout);

        const stage = document.getElementById('game-stage');
        const itemsZone = document.getElementById('items-zone');
        const cardsContainer = document.getElementById('answer-cards');

        stage.innerHTML = '';
        itemsZone.innerHTML = '';
        itemsZone.classList.remove('visible');
        cardsContainer.innerHTML = '';
        cardsContainer.classList.remove('visible');
    }

    function endGame() {
        stopAudio();
        document.getElementById('game-screen').classList.remove('active');
        document.getElementById('end-screen').classList.add('active');
        document.getElementById('final-score').textContent = toPersianNum(gameState.score);
        
        let reward = (initialCoins === 0) ? 10 : 1;
        lokoCoins += reward;
        setLS('loko_coins', lokoCoins);
        
        document.getElementById('reward-coins').textContent = toPersianNum(reward);
        updateCoinUI();
        
        createConfetti();

        const stars = document.querySelectorAll('.earned-star');
        stars.forEach(star => { star.style.opacity = '1'; });
    }

    function createConfetti() {
        const container = document.getElementById('confetti');
        container.innerHTML = '';
        const colors = ['#6C5CE7', '#00D2FF', '#FF00A0', '#00FF9D', '#FFEAA7', '#FFC93C'];

        for (let i = 0; i < 50; i++) {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = `${Math.random() * 100}%`;
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.animationDelay = `${Math.random() * 2}s`;
            confetti.style.animationDuration = `${2 + Math.random() * 2}s`;
            if (Math.random() > 0.5) confetti.style.borderRadius = '50%';
            container.appendChild(confetti);
        }
    }

    function backToMenu() {
        playClickSound();
        stopAudio();
        bgMusic.pause();
        bgMusic.currentTime = 0;
        
        if (gameState.stepTimeout) clearTimeout(gameState.stepTimeout);
        if (gameState.answerTimeout) clearTimeout(gameState.answerTimeout);
        if (gameState.celebrationTimeout) clearTimeout(gameState.celebrationTimeout);
        
        document.getElementById('pause-overlay').classList.remove('active');
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('start-screen').classList.add('active');
        
        gameState.currentStory = 0;
        gameState.score = 0;
        gameState.currentStep = 0;
        updateCoinUI();
        clearStage();
    }

    // ============================================
    // Initialization & Event Listeners
    // ============================================
    document.addEventListener('DOMContentLoaded', () => {
        applyTheme(activeTheme);
        updateCoinUI();
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', playClickSound);
        });

        document.getElementById('start-btn').addEventListener('click', startGame);
        
        // 结束屏幕的返回主页按钮
        document.getElementById('end-home-btn').addEventListener('click', () => {
            playClickSound();
            backToMenu();
        });
        
        // 游戏屏幕的停止按钮 -> 显示暂停菜单
        document.getElementById('stop-btn').addEventListener('click', () => {
            playClickSound();
            stopAudio(); 
            if (gameState.stepTimeout) clearTimeout(gameState.stepTimeout);
            document.getElementById('pause-overlay').classList.add('active');
        });

        // 暂停菜单的继续按钮
        document.getElementById('menu-continue-btn').addEventListener('click', () => {
            playClickSound();
            document.getElementById('pause-overlay').classList.remove('active');
            // Reload current step to resume audio and timers cleanly
            loadStep(gameState.currentStory, gameState.currentStep);
        });

        // 暂停菜单的重启按钮
        document.getElementById('menu-restart-btn').addEventListener('click', () => {
            playClickSound();
            document.getElementById('pause-overlay').classList.remove('active');
            startActualGame();
        });

        // 暂停菜单的返回主页按钮
        document.getElementById('menu-home-btn').addEventListener('click', () => {
            playClickSound();
            document.getElementById('pause-overlay').classList.remove('active');
            backToMenu();
        });
        
        document.getElementById('shop-btn').addEventListener('click', () => {
            playClickSound();
            document.getElementById('start-screen').classList.remove('active');
            document.getElementById('shop-screen').classList.add('active');
            renderShop();
        });
        document.getElementById('shop-back-btn').addEventListener('click', () => {
            playClickSound();
            document.getElementById('shop-screen').classList.remove('active');
            document.getElementById('start-screen').classList.add('active');
        });

        document.getElementById('help-btn').addEventListener('click', () => {
            playClickSound();
            playIntro();
        });

        document.getElementById('skip-intro-btn').addEventListener('click', () => {
            playClickSound();
            skipIntro();
            if (hasSeenIntro && !document.getElementById('game-screen').classList.contains('active') && !document.getElementById('start-screen').classList.contains('active')) {
                startActualGame();
            }
        });

        preloadAudioFiles();

        document.addEventListener('touchmove', (e) => {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });
    });
</script>
</body>
</html>
