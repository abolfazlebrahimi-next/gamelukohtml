<style id="responsive-fixes">
/* ===== Responsive Fixes ===== */
html, body {
  height: 100% !important;
  margin: 0 !important;
  padding: 0 !important;
  width: 100% !important;
  overflow: hidden !important;
  overscroll-behavior: none !important;
  -webkit-text-size-adjust: 100% !important;
  text-size-adjust: 100% !important;
}
#root {
  width: 100% !important;
  height: 100vh !important;
  height: 100dvh !important;
  min-height: 100% !important;
  max-width: 100vw !important;
  overflow: hidden !important;
}
/* Canvas display rules */
canvas {
  display: block !important;
  max-width: 100% !important;
  touch-action: none !important;
  outline: none !important;
}
/* Prevent horizontal overflow */
body, #root, body > * {
  max-width: 100vw !important;
  box-sizing: border-box !important;
}
/* Better touch targets on small screens */
@media (max-width: 640px) {
  html, body {
    font-size: 14px !important;
  }
  .loko-btn-glass,
  .loko-btn-secondary-gold,
  .loko-btn-success,
  .loko-btn-danger {
    min-height: 44px !important;
    padding-top: 0.5rem !important;
    padding-bottom: 0.5rem !important;
  }
}
/* Prevent iOS rubber-band scrolling */
body {
  position: fixed !important;
  inset: 0 !important;
}
/* Safe-area insets for notched devices */
@supports (padding: max(0px)) {
  body {
    padding-top: env(safe-area-inset-top) !important;
    padding-bottom: env(safe-area-inset-bottom) !important;
    padding-left: env(safe-area-inset-left) !important;
    padding-right: env(safe-area-inset-right) !important;
  }
}
</style>
<script id="responsive-canvas-patch">
(function() {
  'use strict';

  function setupResponsiveCanvas() {
    var canvas = document.querySelector('canvas');
    if (!canvas) {
      requestAnimationFrame(setupResponsiveCanvas);
      return;
    }
    var parent = canvas.parentElement;
    if (parent && typeof ResizeObserver !== 'undefined') {
      var lastW = parent.clientWidth;
      var lastH = parent.clientHeight;
      var ro = new ResizeObserver(function(entries) {
        for (var i = 0; i < entries.length; i++) {
          var r = entries[i].contentRect;
          if (Math.abs(r.width - lastW) > 1 || Math.abs(r.height - lastH) > 1) {
            lastW = r.width;
            lastH = r.height;
            window.dispatchEvent(new Event('resize'));
          }
        }
      });
      ro.observe(parent);
    }
    setTimeout(function() { window.dispatchEvent(new Event('resize')); }, 100);
    setTimeout(function() { window.dispatchEvent(new Event('resize')); }, 500);
    window.addEventListener('orientationchange', function() {
      setTimeout(function() { window.dispatchEvent(new Event('resize')); }, 250);
      setTimeout(function() { window.dispatchEvent(new Event('resize')); }, 600);
    });
  }

  if (document.readyState === 'complete') {
    setupResponsiveCanvas();
  } else {
    window.addEventListener('load', setupResponsiveCanvas);
  }
  // Retry periodically until canvas exists (in case load already fired)
  var retries = 0;
  function retry() {
    if (document.querySelector('canvas')) return;
    if (retries++ > 60) return;
    setTimeout(retry, 250);
  }
  retry();
})();
</script>
