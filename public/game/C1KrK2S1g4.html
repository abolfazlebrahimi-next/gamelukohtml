<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <script>
(function () {
    'use strict';

    // Every game page loads this file. Keep the audio changes isolated here so
    // the game rules, layout, and other effects do not need to be changed.
    if (window.__lokoGameAudioController) return;
    window.__lokoGameAudioController = true;
    window.__lokoUseExternalBackgroundMusic = true;

    const TRACKS = [
        './musics/snowy.mp3',
        './musics/space.mp3',
        './musics/volcano.mp3'
    ];

    // Background music stays deliberately quiet. It is lowered again while
    // spoken guidance or another audio clip is playing.
    const BACKGROUND_VOLUME = 0.14;
    const DUCKED_VOLUME = 0.035;

    const mediaStates = new WeakMap();
    const speakingMedia = new Set();
    const speakingUtterances = new Set();
    const backgroundFiles = new Set([
        'abnabat.mp3',
        'first1.mp3',
        'forest.mp3',
        'jadooyi forest.mp3',
        'piano (1).mp3',
        'sami.mp3',
        'sami forest.mp3',
        'snowy.mp3',
        'space.mp3',
        'volcano.mp3',
        'z1.mp3'
    ]);

    let backgroundMusic = null;
    let trackIndex = 0;
    let musicStarted = false;
    let startAttemptInProgress = false;

    function getMediaState(media) {
        let state = mediaStates.get(media);
        if (!state) {
            state = {
                isLegacyBackground: false,
                isSilenced: false,
                previousVolume: 1,
                listenersAttached: false
            };
            mediaStates.set(media, state);
        }
        return state;
    }

    function getMediaSource(media) {
        return String(
            media.currentSrc ||
            media.getAttribute('src') ||
            media.src ||
            ''
        ).trim();
    }

    function getFileName(source) {
        if (!source) return '';
        try {
            const url = new URL(source, document.baseURI);
            return decodeURIComponent(url.pathname.split('/').pop() || '').toLowerCase();
        } catch (error) {
            return source.split('/').pop().split('?')[0].toLowerCase();
        }
    }

    function mediaId(media) {
        return String(media.id || media.getAttribute('name') || '').toLowerCase();
    }

    function isBackgroundMedia(media) {
        if (!media || media === backgroundMusic) return false;

        const id = mediaId(media);
        if (/^(bg|bgm|bgmusic|bg-music|theme-music|thememusic)$/.test(id)) return true;
        if (/(guide|voice|speech|narrat|intro|help|verse|tutorial|countdown|sfx|sound)/.test(id)) return false;

        const fileName = getFileName(getMediaSource(media));
        if (backgroundFiles.has(fileName)) return true;

        // Existing background elements are looped. Spoken clips and effects in
        // these games are one-shot, so this also covers dynamically created BGM.
        return media.loop === true && Boolean(fileName);
    }

    function isSpeakingMedia(media) {
        return media && media !== backgroundMusic && !isBackgroundMedia(media);
    }

    function updateBackgroundVolume() {
        if (!backgroundMusic) return;
        backgroundMusic.volume = speakingMedia.size > 0 || speakingUtterances.size > 0
            ? DUCKED_VOLUME
            : BACKGROUND_VOLUME;
    }

    function silenceLegacyBackground(media) {
        const state = getMediaState(media);
        if (!state.isSilenced) {
            state.previousVolume = media.volume;
            state.isSilenced = true;
        }
        if (media.volume !== 0) media.volume = 0;
    }

    function restoreNonBackgroundVolume(media) {
        const state = getMediaState(media);
        if (state.isSilenced) {
            state.isSilenced = false;
            media.volume = state.previousVolume;
        }
    }

    function stopSpeakingMedia(media) {
        speakingMedia.delete(media);
        trackedAudio.delete(media);
        updateBackgroundVolume();
    }

    function startSpeakingMedia(media) {
        if (!isSpeakingMedia(media)) return;
        speakingMedia.add(media);
        updateBackgroundVolume();
    }

    function registerMedia(media) {
        if (!media || !(media instanceof HTMLMediaElement)) return;

        const state = getMediaState(media);
        state.isLegacyBackground = isBackgroundMedia(media);

        if (state.isLegacyBackground) {
            speakingMedia.delete(media);
            silenceLegacyBackground(media);
        } else {
            restoreNonBackgroundVolume(media);
        }

        if (!state.listenersAttached) {
            state.listenersAttached = true;
            media.addEventListener('play', function () {
                registerMedia(media);
                startSpeakingMedia(media);
            });
            media.addEventListener('playing', function () {
                registerMedia(media);
                startSpeakingMedia(media);
            });
            media.addEventListener('pause', function () {
                stopSpeakingMedia(media);
            });
            media.addEventListener('ended', function () {
                stopSpeakingMedia(media);
            });
            media.addEventListener('emptied', function () {
                stopSpeakingMedia(media);
            });
            media.addEventListener('error', function () {
                stopSpeakingMedia(media);
            });
        }
    }

    function scanMediaElements(root) {
        if (!root || !root.querySelectorAll) return;
        if (root instanceof HTMLMediaElement) registerMedia(root);
        root.querySelectorAll('audio, video').forEach(registerMedia);
    }

    function patchMediaPlayback() {
        const mediaPrototype = window.HTMLMediaElement && HTMLMediaElement.prototype;
        if (!mediaPrototype) return;

        const nativePlay = mediaPrototype.play;
        if (typeof nativePlay === 'function' && !nativePlay.__lokoAudioPatched) {
            const patchedPlay = function () {
                registerMedia(this);
                const result = nativePlay.apply(this, arguments);
                if (result && typeof result.then === 'function') {
                    result.then(() => {
                        registerMedia(this);
                        if (!this.paused && !this.ended) startSpeakingMedia(this);
                    }).catch(() => {});
                } else if (!this.paused && !this.ended) {
                    startSpeakingMedia(this);
                }
                return result;
            };
            patchedPlay.__lokoAudioPatched = true;
            mediaPrototype.play = patchedPlay;
        }

        const nativePause = mediaPrototype.pause;
        if (typeof nativePause === 'function' && !nativePause.__lokoAudioPatched) {
            const patchedPause = function () {
                const result = nativePause.apply(this, arguments);
                stopSpeakingMedia(this);
                return result;
            };
            patchedPause.__lokoAudioPatched = true;
            mediaPrototype.pause = patchedPause;
        }

        // The original games sometimes reset their music volume after this
        // controller has silenced it. Keep only their old background track
        // silent without affecting voices or sound effects.
        const volumeDescriptor = Object.getOwnPropertyDescriptor(mediaPrototype, 'volume');
        if (volumeDescriptor && volumeDescriptor.get && volumeDescriptor.set && volumeDescriptor.configurable) {
            const patchedVolume = {
                configurable: true,
                enumerable: volumeDescriptor.enumerable,
                get: volumeDescriptor.get,
                set: function (value) {
                    if (isBackgroundMedia(this)) {
                        const state = getMediaState(this);
                        if (!state.isSilenced) {
                            state.previousVolume = value;
                            state.isSilenced = true;
                        }
                        volumeDescriptor.set.call(this, 0);
                    } else {
                        volumeDescriptor.set.call(this, value);
                    }
                }
            };
            Object.defineProperty(mediaPrototype, 'volume', patchedVolume);
        }
    }

    function attachSpeechSynthesisHooks() {
        const synth = window.speechSynthesis;
        if (!synth || typeof synth.speak !== 'function') return;

        const nativeSpeak = synth.speak.bind(synth);
        const nativeCancel = typeof synth.cancel === 'function' ? synth.cancel.bind(synth) : null;

        const wrappedSpeak = function (utterance) {
            let release = null;
            if (utterance) {
                speakingUtterances.add(utterance);
                updateBackgroundVolume();

                release = function () {
                    speakingUtterances.delete(utterance);
                    updateBackgroundVolume();
                };

                if (typeof utterance.addEventListener === 'function') {
                    utterance.addEventListener('end', release, { once: true });
                    utterance.addEventListener('error', release, { once: true });
                }
            }
            try {
                return nativeSpeak(utterance);
            } catch (error) {
                if (release) release();
                throw error;
            }
        };

        try {
            synth.speak = wrappedSpeak;
        } catch (error) {
            return;
        }

        if (nativeCancel) {
            try {
                synth.cancel = function () {
                    speakingUtterances.clear();
                    updateBackgroundVolume();
                    return nativeCancel();
                };
            } catch (error) {
                // Some browsers expose speechSynthesis.cancel as read-only.
            }
        }
    }

    // ---------------------------------------------------------------------
    // Shared guide controls
    // ---------------------------------------------------------------------
    // The game pages use several different guide/tutor implementations. A
    // small shared layer keeps the user-facing skip action consistent without
    // replacing any of the guides or their audio files.
    const GUIDE_TOKEN_PATTERN = /(?:guide|tutorial|help|narrat|intro|voice)/i;
    const GUIDE_LEAF_PATTERN = /(?:text|char|avatar|bubble|step|header|title|progress|bar|audio|skip|button|nav|dots|icon|img|hint|message|line|description|list)/i;
    const trackedAudio = new Set();
    let guideScanQueued = false;

    function isMediaElement(value) {
        return Boolean(
            value &&
            window.HTMLMediaElement &&
            value instanceof window.HTMLMediaElement
        );
    }

    function patchAudioConstructor() {
        const nativeAudio = window.Audio;
        if (typeof nativeAudio !== 'function' || nativeAudio.__lokoGuideAudioPatched) return;

        const trackedAudioConstructor = function () {
            const media = new nativeAudio(...arguments);
            trackedAudio.add(media);
            registerMedia(media);
            return media;
        };
        trackedAudioConstructor.prototype = nativeAudio.prototype;
        trackedAudioConstructor.__lokoGuideAudioPatched = true;
        try {
            window.Audio = trackedAudioConstructor;
        } catch (error) {
            // Audio can be read-only in a few embedded browsers.
        }
    }

    function stopGuidanceMedia() {
        const candidates = new Set(trackedAudio);
        speakingMedia.forEach(media => candidates.add(media));
        document.querySelectorAll('audio, video').forEach(media => candidates.add(media));

        // A few games keep a dynamically-created guide clip in a named
        // variable rather than in the DOM. Include those conventional names.
        [
            'guideAudio', 'tutorialAudio', 'helpAudio', 'introAudio',
            'voiceAudio', 'activeAudio', 'narratorAudio'
        ].forEach(name => {
            const media = window[name];
            if (isMediaElement(media)) candidates.add(media);
        });

        candidates.forEach(media => {
            if (!isMediaElement(media) || media === backgroundMusic || isBackgroundMedia(media)) return;
            try {
                media.pause();
                media.currentTime = 0;
            } catch (error) {}
            speakingMedia.delete(media);
        });

        const synth = window.speechSynthesis;
        if (synth && typeof synth.cancel === 'function') {
            try { synth.cancel(); } catch (error) {}
        }
        speakingUtterances.clear();
        updateBackgroundVolume();
    }

    function guideElementToken(element) {
        if (!element || element.nodeType !== 1) return '';
        return String(
            (element.id || '') + ' ' +
            (typeof element.className === 'string' ? element.className : '') + ' ' +
            (element.getAttribute('data-role') || '')
        ).toLowerCase();
    }

    function isGuideLikeElement(element) {
        return Boolean(
            element &&
            element.nodeType === 1 &&
            GUIDE_TOKEN_PATTERN.test(guideElementToken(element))
        );
    }

    function isGuideLeafElement(element) {
        return GUIDE_LEAF_PATTERN.test(guideElementToken(element));
    }

    function isMenuLikeElement(element) {
        let current = element;
        while (current && current !== document.body) {
            const token = guideElementToken(current);
            if (/(?:^|[\s_-])(?:menu|landing|home|main)(?:[\s_-]|screen|page|content|area|character|wrapper|view|$)/.test(token)) return true;
            current = current.parentElement;
        }
        return false;
    }

    function isElementVisible(element) {
        if (!element || element.nodeType !== 1) return false;
        let current = element;
        while (current && current.nodeType === 1) {
            if (current.hidden) return false;
            const classList = current.classList;
            if (classList && (
                classList.contains('hidden') ||
                classList.contains('d-none') ||
                classList.contains('is-hidden') ||
                classList.contains('invisible')
            )) return false;
            const stateClasses = classList && (
                classList.contains('active') ||
                classList.contains('show') ||
                classList.contains('open') ||
                classList.contains('visible')
            );
            const token = guideElementToken(current);
            if (
                classList &&
                (classList.contains('screen') || classList.contains('page')) &&
                !stateClasses &&
                !current.style.display
            ) return false;
            if (
                /(?:overlay|modal)/.test(token) &&
                !stateClasses &&
                !current.style.display
            ) return false;
            let style = null;
            try {
                style = window.getComputedStyle(current);
            } catch (error) {
                // A malformed page stylesheet should not disable guide controls.
            }
            if (style && (
                style.display === 'none' ||
                style.visibility === 'hidden'
            )) return false;
            current = current.parentElement;
        }
        return true;
    }

    function guideContainerScore(element) {
        const token = guideElementToken(element);
        let score = 0;
        if (/container|content|card|panel/.test(token)) score += 6;
        if (/wrapper|wrap|box/.test(token)) score += 4;
        if (/modal|overlay/.test(token)) score += 4;
        if (/screen|page|section/.test(token)) score += 1;
        if (isGuideLeafElement(element)) score -= 4;
        return score;
    }

    function isSkipControl(element) {
        if (!element || element.nodeType !== 1) return false;
        const identity = String(
            (element.id || '') + ' ' +
            (typeof element.className === 'string' ? element.className : '') + ' ' +
            (element.getAttribute('aria-label') || '')
        );
        const label = String(element.textContent || '');
        // Completion buttons often say «بزن بریم» too; only treat that
        // wording as a skip control when the control is explicitly named as
        // one. The visible Persian "رد کردن" label is unambiguous.
        return /(?:skip|guide-skip|tutorial-skip)/i.test(identity) || /رد\s*کردن/i.test(label);
    }

    function addGuideButtonStyles() {
        if (document.getElementById('loko-guide-skip-styles')) return;
        const style = document.createElement('style');
        style.id = 'loko-guide-skip-styles';
        style.textContent = `
            .loko-guide-skip {
                position: static !important;
                inset: auto !important;
                display: block !important;
                margin: 14px auto 0 !important;
            }
        `;
        (document.head || document.documentElement).appendChild(style);
    }

    function guideActionScope(container) {
        let current = container;
        while (current && current !== document.body) {
            const token = guideElementToken(current);
            if (current !== container && /screen|page|modal|overlay/.test(token)) return current;
            current = current.parentElement;
        }
        return container;
    }

    function getGuideExitFunction(container) {
        const tokens = [];
        let current = container;
        while (current && current !== document.body) {
            tokens.push(guideElementToken(current));
            current = current.parentElement;
        }
        const token = tokens.join(' ');
        const names = [];
        if (/voice/.test(token)) names.push('skipVoiceGuide', 'finishVoiceGuide');
        if (/tutorial/.test(token)) {
            names.push('skipTutorial', 'tutorialSkip', 'finishTutorial', 'endTutorial', 'hideTutorialScreen');
        }
        if (/help/.test(token)) names.push('skipHelp', 'finishHelp', 'closeHelp', 'hideHelp');
        if (/intro/.test(token)) names.push('skipIntro', 'finishIntro', 'closeIntro');
        names.push('skipGuide', 'finishGuide', 'endGuide', 'closeGuide');

        const uniqueNames = [...new Set(names)];
        for (const name of uniqueNames) {
            if (typeof window[name] === 'function') return window[name];
        }
        return null;
    }

    function findGuideFallbackControl(container, skipButton) {
        const scope = guideActionScope(container);
        const controls = [...scope.querySelectorAll(
            'button, [role="button"], a, input[type="button"], input[type="submit"]'
        )].filter(control => control !== skipButton && isElementVisible(control));
        return controls.find(control => {
            const token = String(
                (control.id || '') + ' ' +
                (typeof control.className === 'string' ? control.className : '') + ' ' +
                (control.getAttribute('aria-label') || '') + ' ' +
                (control.getAttribute('data-go') || '') + ' ' +
                (control.getAttribute('data-back') || '') + ' ' +
                (control.getAttribute('onclick') || '') + ' ' +
                (control.textContent || '')
            );
            return /(?:close|back|home|بازگشت|بستن|فهمیدم|بزن\s*بریم|شروع|ورود)/i.test(token);
        }) || null;
    }

    function hideGuideAsLastResort(container) {
        if (!container) return;
        const scope = guideActionScope(container);
        scope.classList.remove('active', 'show', 'open', 'visible');
        if (/screen|overlay|modal/.test(guideElementToken(scope))) {
            scope.style.setProperty('display', 'none', 'important');
        }
    }

    function invokeGuideExit(button, container, event) {
        const exitFunction = getGuideExitFunction(container);
        if (exitFunction) {
            try {
                exitFunction(event);
                return true;
            } catch (error) {
                console.warn('Guide skip handler failed:', error);
            }
        }

        // Inline handlers can reference lexical variables or page-specific
        // objects (for example oceanGame), so retain them as a fallback.
        if (typeof button.onclick === 'function') {
            try {
                button.onclick.call(button, event);
                return true;
            } catch (error) {}
        }

        const fallback = findGuideFallbackControl(container, button);
        if (fallback) {
            try {
                if (!isElementVisible(fallback)) {
                    fallback.classList.remove('hidden');
                    fallback.style.removeProperty('display');
                }
                fallback.click();
                return true;
            } catch (error) {}
        }

        hideGuideAsLastResort(container);
        return false;
    }

    function bindGuideSkipButton(button, container, injected) {
        if (button.dataset.lokoGuideSkipBound === 'true') {
            if (button.dataset.lokoGuideContainer !== (container.id || '')) {
                button.dataset.lokoGuideContainer = container.id || '';
            }
            return;
        }
        button.dataset.lokoGuideSkipBound = 'true';
        button.dataset.lokoGuideInjected = injected ? 'true' : 'false';
        button.dataset.lokoGuideContainer = container.id || '';
        button.addEventListener('click', function (event) {
            stopGuidanceMedia();

            // Existing controls keep their page's listener when no shared
            // handler is available. Injected controls always need a route.
            const hasRoute = Boolean(getGuideExitFunction(container));
            if (!injected && !hasRoute) return;

            event.preventDefault();
            event.stopImmediatePropagation();
            invokeGuideExit(button, container, event);
        }, true);
    }

    function setImportantStyleIfNeeded(element, property, value) {
        if (
            element.style.getPropertyValue(property) !== value ||
            element.style.getPropertyPriority(property) !== 'important'
        ) {
            element.style.setProperty(property, value, 'important');
        }
    }

    function prepareGuideSkipButton(button, container, injected) {
        if (!button || !container) return;
        if (button.parentElement !== container) container.appendChild(button);

        if (!button.classList.contains('loko-guide-skip')) {
            button.classList.add('loko-guide-skip');
        }
        if (button.hasAttribute('hidden')) button.removeAttribute('hidden');
        ['hidden', 'd-none', 'is-hidden', 'invisible'].forEach(className => {
            if (button.classList.contains(className)) button.classList.remove(className);
        });
        if (button.textContent !== '⏭️ رد کردن') button.textContent = '⏭️ رد کردن';
        if (button.getAttribute('aria-label') !== 'رد کردن راهنما') {
            button.setAttribute('aria-label', 'رد کردن راهنما');
        }
        if (button.tagName === 'BUTTON' && !button.getAttribute('type')) {
            button.setAttribute('type', 'button');
        }
        setImportantStyleIfNeeded(button, 'display', 'block');
        setImportantStyleIfNeeded(button, 'position', 'static');
        setImportantStyleIfNeeded(button, 'inset', 'auto');
        bindGuideSkipButton(button, container, injected);
    }

    function elementDepth(element) {
        let depth = 0;
        let current = element;
        while (current && current.parentElement) {
            depth += 1;
            current = current.parentElement;
        }
        return depth;
    }

    function guideGroupingElement(element) {
        let current = element.parentElement;
        while (current && current !== document.body) {
            const token = guideElementToken(current);
            if (isGuideLikeElement(current) && /screen|page|modal|overlay/.test(token)) return current;
            current = current.parentElement;
        }
        return null;
    }

    function guideContainersInDocument() {
        const candidates = [...document.querySelectorAll('body *')].filter(element => {
            if (!isGuideLikeElement(element) || isGuideLeafElement(element)) return false;
            if (/^(button|a|input|audio|video|svg|use|symbol|path|g|circle|line|polyline|polygon)$/i.test(element.tagName)) return false;
            if (element.namespaceURI === 'http://www.w3.org/2000/svg') return false;
            if (isMenuLikeElement(element)) return false;
            return isElementVisible(element);
        });

        // Prefer the semantic guide card/content element over its screen
        // wrapper, then skip descendants once a container has been selected.
        candidates.sort((a, b) => {
            const scoreDifference = guideContainerScore(b) - guideContainerScore(a);
            if (scoreDifference) return scoreDifference;
            return elementDepth(b) - elementDepth(a);
        });
        const selected = [];
        const grouped = new Set();
        candidates.forEach(candidate => {
            if (selected.some(selectedElement => selectedElement.contains(candidate))) return;
            if (selected.some(selectedElement => candidate.contains(selectedElement))) return;
            const group = guideGroupingElement(candidate);
            if (group && grouped.has(group)) return;
            if (group) grouped.add(group);
            selected.push(candidate);
        });
        return selected;
    }

    function guideSkipControlsInScope(container) {
        const scope = guideActionScope(container);
        return [...scope.querySelectorAll(
            'button, [role="button"], input[type="button"], input[type="submit"]'
        )].filter(control => isSkipControl(control) || control.classList.contains('loko-guide-skip'));
    }

    function scanGuideControls() {
        guideScanQueued = false;
        if (!document.body) return;
        addGuideButtonStyles();

        const containers = guideContainersInDocument();
        containers.forEach(container => {
            let skipButton = guideSkipControlsInScope(container)[0];

            if (!skipButton) {
                skipButton = document.createElement('button');
                skipButton.type = 'button';
                skipButton.className = 'loko-guide-skip';
                skipButton.textContent = '⏭️ رد کردن';
                container.appendChild(skipButton);
                prepareGuideSkipButton(skipButton, container, true);
            } else {
                prepareGuideSkipButton(skipButton, container, false);
            }

            // A previous scan may have created a button in a nested helper
            // wrapper before the semantic guide container became visible.
            // Keep one shared control per active guide scope and remove only
            // buttons created by this controller, never page-owned controls.
            guideSkipControlsInScope(container).forEach(control => {
                if (
                    control !== skipButton &&
                    control.dataset.lokoGuideInjected === 'true'
                ) control.remove();
            });
        });
    }

    function scheduleGuideScan() {
        if (guideScanQueued) return;
        guideScanQueued = true;
        const schedule = window.requestAnimationFrame || function (callback) {
            return window.setTimeout(callback, 0);
        };
        schedule(scanGuideControls);
    }

    function nextTrack() {
        if (!backgroundMusic) return;
        trackIndex = (trackIndex + 1) % TRACKS.length;
        backgroundMusic.src = TRACKS[trackIndex];
        backgroundMusic.load();
        updateBackgroundVolume();
        if (musicStarted) backgroundMusic.play().catch(() => {});
    }

    function createBackgroundMusic() {
        if (backgroundMusic) return backgroundMusic;

        backgroundMusic = document.createElement('audio');
        backgroundMusic.preload = 'auto';
        backgroundMusic.loop = false;
        backgroundMusic.setAttribute('aria-hidden', 'true');
        backgroundMusic.setAttribute('playsinline', '');
        backgroundMusic.dataset.lokoBackgroundMusic = 'true';
        backgroundMusic.src = TRACKS[trackIndex];
        backgroundMusic.addEventListener('ended', nextTrack);
        backgroundMusic.addEventListener('error', nextTrack);
        document.body.appendChild(backgroundMusic);
        updateBackgroundVolume();
        return backgroundMusic;
    }

    function startBackgroundMusic() {
        if (musicStarted || startAttemptInProgress) return;
        startAttemptInProgress = true;
        const music = createBackgroundMusic();
        let playResult;
        try {
            playResult = music.play();
        } catch (error) {
            startAttemptInProgress = false;
            return;
        }

        if (playResult && typeof playResult.then === 'function') {
            playResult.then(() => {
                musicStarted = true;
                startAttemptInProgress = false;
                removeUnlockListeners();
                updateBackgroundVolume();
            }).catch(() => {
                startAttemptInProgress = false;
            });
        } else {
            musicStarted = true;
            startAttemptInProgress = false;
            removeUnlockListeners();
            updateBackgroundVolume();
        }
    }

    function installUnlockListeners() {
        ['pointerdown', 'touchstart', 'keydown', 'click'].forEach(function (eventName) {
            document.addEventListener(eventName, startBackgroundMusic, { capture: true, passive: true });
        });
    }

    function removeUnlockListeners() {
        ['pointerdown', 'touchstart', 'keydown', 'click'].forEach(function (eventName) {
            document.removeEventListener(eventName, startBackgroundMusic, true);
        });
    }

    function init() {

        let bgMusic = null, currentMusic = '';
        function playBeep(freq, duration) {
            try {
                const a = new (window.AudioContext || window.webkitAudioContext)();
                const o = a.createOscillator(), g = a.createGain();
                o.connect(g); g.connect(a.destination);
                o.frequency.value = freq; o.type = 'sine';
                g.gain.setValueAtTime(0.15, a.currentTime);
                g.gain.exponentialRampToValueAtTime(0.01, a.currentTime + duration);
                o.start(); o.stop(a.currentTime + duration);
            } catch (e) {}
        }
        function playCountdownSound(number) { try { const audio = new Audio('musics/countdown' + number + '.mp3'); audio.volume = 0.7; audio.play().catch(e => console.log('Audio play prevented')); } catch(e) {} }
        function playGoSound() { try { const audio = new Audio('musics/countdownGo.mp3'); audio.volume = 0.8; audio.play().catch(e => console.log('Audio play prevented')); } catch(e) {} }
        function playThemeMusic(musicFile) {
            try {
                if (bgMusic) { bgMusic.pause(); bgMusic = null; }
                if (!musicFile) return;
                bgMusic = new Audio(musicFile); bgMusic.loop = true; bgMusic.volume = 0.3; bgMusic.play().catch(() => {});
                currentMusic = musicFile;
            } catch(e) {}
        }

        function showCountdown(callback) {
            const overlay = document.getElementById('countdownOverlay');
            const numberEl = document.getElementById('countdownNumber');
            const labelEl = document.getElementById('countdownLabel');
            const color = getComputedStyle(document.body).getPropertyValue('--countdown-color').trim() || '#FFC93C';
            numberEl.style.color = color;
            numberEl.style.textShadow = `0 0 100px ${color}, 0 0 200px ${color}, 0 0 300px ${color}`;
            overlay.classList.add('show');
            const steps = ['۳', '۲', '۱', 'بریم!'];
            let index = 0;
            function showNext() {
                if (index >= steps.length) { overlay.classList.remove('show'); if (callback) callback(); return; }
                numberEl.textContent = steps[index];
                numberEl.className = 'countdown-number';
                if (steps[index] === 'بریم!') { numberEl.classList.add('go-text'); labelEl.textContent = 'شروع! 🚀'; playGoSound(); }
                else { labelEl.textContent = index === 0 ? 'آماده‌ای؟' : ''; playCountdownSound(3 - index); playBeep(440 + (3 - index) * 80, 0.3); }
                numberEl.style.animation = 'none';
                requestAnimationFrame(() => { numberEl.style.animation = steps[index] === 'بریم!' ? 'countdownGo 0.8s cubic-bezier(0.34, 1.56, 0.64, 1)' : 'countdownPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)'; });
                index++;
                setTimeout(showNext, 700);
            }
            showNext();
        }

        // ===== GUIDE LOGIC & DATA =====
        const guideData = [
            { start: 0, end: 6, text: 'سلام! <br>من پیکسل هستم، دوست مهربون تو!<br>به بازی <span class="highlight">جدول شگفت‌انگیز</span> خوش اومدی!' },

            { start: 80, end: 90, text: 'اگه شکل رو درست بذاری، خونه سبز میشه و یه صدای خوشگل میشنوی! 🟢<br>اگه اشتباه بذاری، خونه قرمز میشه و باید دوباره امتحان کنی. 🔴' },
            { start: 90, end: 95, text: 'نگران نباش! هرچی بیشتر بازی کنی، بهتر یاد می‌گیری!' }
        ];
        
        let guideState = { isPlaying: false, currentIndex: -1, startTime: 0, rafId: null, useFallback: false, audio: null, isFirstTimeFlow: false };

        function showGuide(isFirstTime) {
            guideState.isPlaying = true; 
            guideState.currentIndex = -1; 
            guideState.useFallback = false;
            guideState.isFirstTimeFlow = isFirstTime;
            
            document.getElementById('screen-guide').classList.add('active');
            
            try {
                guideState.audio = new Audio('musics/pixel 5.mp3');
                guideState.audio.play().then(() => {}).catch(() => { 
                    guideState.useFallback = true; 
                    guideState.startTime = Date.now(); 
                });
                guideState.audio.onended = () => finishGuide();
                guideState.audio.onerror = () => { 
                    guideState.useFallback = true; 
                    guideState.startTime = Date.now(); 
                };
            } catch(e) { 
                guideState.useFallback = true; 
                guideState.startTime = Date.now(); 
            }

            document.getElementById('skipBtn').style.display = 'block';
            
            guideState.rafId = requestAnimationFrame(guideLoop);
        }
        
        function guideLoop() {
            if (!guideState.isPlaying) return;
            let time = guideState.useFallback ? (Date.now() - guideState.startTime) / 1000 : (guideState.audio ? guideState.audio.currentTime : 0);
            let duration = guideState.useFallback ? 95 : (guideState.audio ? guideState.audio.duration : 95);
            if (time >= duration) { finishGuide(); return; }
            
            const progress = Math.min((time / duration) * 100, 100);
            document.getElementById('progressBar').style.width = progress + '%';
            const mins = Math.floor(time / 60), secs = Math.floor(time % 60);
            document.getElementById('timeIndicator').textContent = `⏱️ ${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

            let idx = -1;
            for (let i = 0; i < guideData.length; i++) { 
                if (time >= guideData[i].start && time < guideData[i].end) { idx = i; break; } 
            }
            
            if (idx !== -1) {
                document.getElementById('pixelWrap').classList.add('talking');
                document.getElementById('pixelWrap').classList.remove('idle');
                if (idx !== guideState.currentIndex) {
                    guideState.currentIndex = idx;
                    document.getElementById('speechText').innerHTML = `<div class="line">${guideData[idx].text}</div>`;
                    playBeep(440 + idx * 50, 0.1);
                }
            } else {
                document.getElementById('pixelWrap').classList.remove('talking');
                document.getElementById('pixelWrap').classList.add('idle');
            }
            guideState.rafId = requestAnimationFrame(guideLoop);
        }
        
        function finishGuide() {
            if (!guideState.isPlaying) return;
            guideState.isPlaying = false;
            if (guideState.rafId) cancelAnimationFrame(guideState.rafId);
            if (guideState.audio) guideState.audio.pause();
            
            document.getElementById('pixelWrap').classList.remove('talking');
            document.getElementById('pixelWrap').classList.add('happy');
            
            setTimeout(() => {
                document.getElementById('screen-guide').classList.remove('active');
                document.getElementById('pixelWrap').classList.remove('happy');
                document.getElementById('pixelWrap').classList.add('idle');
                
                if (guideState.isFirstTimeFlow) {
                    showCountdown(() => {
                        loadLevel();
                        showPage('gamePage');
                    });
                } else {
                    showPage('homePage');
                }
            }, 1500);
        }
        
        document.getElementById('skipBtn').onclick = () => {
            finishGuide();
        };

        // ===== GAME LOGIC =====
        let currentLevel = 0, selectedEmoji = null, boardSolution = [], boardCurrent = [], timerInterval = null, timerSeconds = 0, isPaused = false, gameActive = false, correctCount = 0, wrongCount = 0;
        const TOTAL_LEVELS = 30;
        function generateLevels() {
            const levels = [];
            for (let i = 0; i < TOTAL_LEVELS; i++) {
                const size = i < 19 ? 3 : 4;
                const setIdx = i % emojiSets.length;
                const maxHidden = size === 3 ? 3 : 4;
                const hidden = 1 + Math.floor((i / 3)) % maxHidden;
                levels.push({ size, hidden: Math.min(hidden, maxHidden), set: setIdx });
            }
            return levels;
        }
        const levels = generateLevels();
        let globalStats = { levelUnlocked: { 1: true }, levelCompleted: {} };
        function loadGlobalStats() {
            const saved = localStorage.getItem("sudokuEmojiStatsV4");
            if (saved) { try { globalStats = { ...globalStats, ...JSON.parse(saved) }; } catch(e) {} }
            if (!globalStats.levelUnlocked) globalStats.levelUnlocked = { 1: true };
            if (!globalStats.levelCompleted) globalStats.levelCompleted = {};
        }
        function saveGlobalStats() { localStorage.setItem("sudokuEmojiStatsV4", JSON.stringify(globalStats)); }
        function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
        function generateBoard(size, hiddenCount, setIdx) {
            const emojis = emojiSets[setIdx % emojiSets.length];
            let row0 = shuffle([...Array(size).keys()]);
            let solution = [];
            for (let i = 0; i < size; i++) {
                let row = [];
                for (let j = 0; j < size; j++) { row.push(emojis[row0[(j + i) % size]]); }
                solution.push(row);
            }
            let puzzle = solution.map(r => [...r]);
            let cells = [];
            for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) cells.push([r, c]);
            shuffle(cells);
            for (let i = 0; i < Math.min(hiddenCount, size * size - 1); i++) { let [r, c] = cells[i]; puzzle[r][c] = null; }
            return { size, solution, puzzle, emojis };
        }
        function renderLevelGrid() {
            const grid = document.getElementById('levelGrid');
            grid.innerHTML = '';
            for (let i = 0; i < TOTAL_LEVELS; i++) {
                const box = document.createElement('div');

                const levelNum = i + 1;
                const isUnlocked = globalStats.levelUnlocked[levelNum] || false;
                const isCompleted = globalStats.levelCompleted[levelNum] || false;
                const size = levels[i].size;
                if (!isUnlocked) box.classList.add('locked');
                if (isCompleted) box.classList.add('completed');
                box.innerHTML = `<span class="level-number">${levelNum}</span><span class="level-size">${size}×${size}</span>`;
                if (isUnlocked) {
                    box.onclick = () => {
                        currentLevel = i;
                        if (i === 0 && !localStorage.getItem('sudokuGuideSeen')) {
                            localStorage.setItem('sudokuGuideSeen', 'true');
                            showGuide(true);
                        } else {
                            showCountdown(() => { loadLevel(); showPage('gamePage'); });
                        }
                    };
                }
                grid.appendChild(box);
            }
        }
        function startTimer() { if (timerInterval) clearInterval(timerInterval); timerSeconds = 0; updateTimerDisplay(); timerInterval = setInterval(() => { if (!isPaused && gameActive) { timerSeconds++; updateTimerDisplay(); } }, 1000); }
        function updateTimerDisplay() { const mins = Math.floor(timerSeconds / 60); const secs = timerSeconds % 60; document.getElementById('gameTimer').textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`; }
        function stopTimer() { if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } }
        function loadLevel() {
            gameActive = true; isPaused = false; correctCount = 0; wrongCount = 0;
            const config = levels[currentLevel];
            const board = generateBoard(config.size, config.hidden, config.set);
            boardSolution = board.solution; boardCurrent = board.puzzle.map(r => [...r]);
            document.getElementById('gameLevelTitle').innerText = `مرحله ${currentLevel + 1}`;
            document.getElementById('correctCount').textContent = '0';
            document.getElementById('wrongCount').textContent = '0';
            updateCoinDisplay();
            const grid = document.getElementById('sudokuGrid');
            grid.style.gridTemplateColumns = `repeat(${config.size}, 1fr)`;
            grid.innerHTML = '';
            for (let r = 0; r < config.size; r++) {
                for (let c = 0; c < config.size; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell'; cell.dataset.r = r; cell.dataset.c = c;
                    if (boardCurrent[r][c]) { cell.innerText = boardCurrent[r][c]; cell.classList.add('filled'); }
                    else {
                        cell.classList.add('empty');
                        cell.addEventListener('click', () => handleCellClick(r, c, cell));
                        cell.addEventListener('dragover', (e) => { e.preventDefault(); cell.classList.add('dragover'); });
                        cell.addEventListener('dragleave', () => { cell.classList.remove('dragover'); });
                        cell.addEventListener('drop', (e) => { e.preventDefault(); cell.classList.remove('dragover'); const data = e.dataTransfer.getData('text/plain'); if (data) { selectedEmoji = data; handleCellClick(r, c, cell); } });
                    }
                    grid.appendChild(cell);
                }
            }
            const tray = document.getElementById('emojiTray');
            tray.innerHTML = '';
            const uniqueEmojis = [...new Set(board.emojis)];
            uniqueEmojis.forEach(em => {
                const item = document.createElement('div');
                item.className = 'tray-item'; item.innerText = em; item.draggable = true;
                item.onclick = () => { selectedEmoji = em; document.querySelectorAll('.tray-item').forEach(t => t.classList.remove('active')); item.classList.add('active'); playBeep(600, 0.05); };
                item.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/plain', em); item.classList.add('dragging'); setTimeout(() => item.classList.remove('dragging'), 0); });
                item.addEventListener('dragend', () => { item.classList.remove('dragging'); });
                tray.appendChild(item);
            });
            selectedEmoji = null;
            document.querySelectorAll('.tray-item').forEach(t => t.classList.remove('active'));
            startTimer();
        }
        function handleCellClick(r, c, cell) {
            if (!selectedEmoji || isPaused || !gameActive) { if (!selectedEmoji) showToast('اول یه ایموجی رو با کلیک انتخاب کن یا بکشش!', 'gold'); return; }
            document.querySelectorAll('.grid-cell.wrong').forEach(cell => cell.classList.remove('wrong'));
            if (boardSolution[r][c] === selectedEmoji) {
                cell.innerText = selectedEmoji; cell.classList.remove('empty', 'selected', 'dragover'); cell.classList.add('correct', 'filled'); cell.onclick = null; boardCurrent[r][c] = selectedEmoji;
                correctCount++; document.getElementById('correctCount').textContent = correctCount; playBeep(800, 0.08);
                // NO COIN ADDED HERE - فقط موقع برد سکه می‌گیره
                checkWin();
            } else {
                cell.innerText = selectedEmoji; cell.classList.add('wrong'); wrongCount++; document.getElementById('wrongCount').textContent = wrongCount; playBeep(200, 0.15);
                setTimeout(() => { if (cell.classList.contains('wrong')) { cell.innerText = ''; cell.classList.remove('wrong'); } }, 400);
            }
            document.querySelectorAll('.tray-item').forEach(t => t.classList.remove('active'));
            selectedEmoji = null;
        }
        function checkWin() {
            let isComplete = true;
            for (let r = 0; r < boardCurrent.length; r++) { for (let c = 0; c < boardCurrent.length; c++) { if (!boardCurrent[r][c]) isComplete = false; } }
            if (isComplete) {
                gameActive = false; stopTimer();
                
                // ===== اضافه کردن سکه فقط موقع برد =====
                if (coinCount === 0) {
                    coinCount += 10;
                } else {
                    coinCount += 1;
                }
                saveCoins();
                // =====================================
                
                const levelNum = currentLevel + 1;
                globalStats.levelCompleted[levelNum] = true;
                if (levelNum < TOTAL_LEVELS) globalStats.levelUnlocked[levelNum + 1] = true;
                saveGlobalStats();
                document.getElementById('winCorrect').textContent = correctCount;
                document.getElementById('winWrong').textContent = wrongCount;
                document.getElementById('winCoins').textContent = coinCount;
                document.getElementById('winLevelText').textContent = `مرحله ${levelNum} از ${TOTAL_LEVELS} کامل شد!`;
                document.getElementById('winModal').classList.add('open');
                playBeep(880, 0.15); setTimeout(() => playBeep(1100, 0.2), 150); setTimeout(() => playBeep(1320, 0.25), 300);
            }
        }
        function showStopMenu() { if (!gameActive) return; document.getElementById('modal-stop').classList.add('open'); isPaused = true; }
        function continueGame() { document.getElementById('modal-stop').classList.remove('open'); isPaused = false; }
        function restartGame() { document.getElementById('modal-stop').classList.remove('open'); isPaused = false; stopTimer(); showCountdown(() => { loadLevel(); }); }
        function quitGame() { 
            document.getElementById('modal-stop').classList.remove('open'); 
            isPaused = false; 
            gameActive = false; 
            stopTimer(); 
            saveCoins(); // ذخیره سکه قبل از خروج
            showPage('homePage'); 
        }
        function showToast(msg, type = "blue") {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = `toast ${type}`; t.innerText = msg; c.appendChild(t);
            setTimeout(() => { t.classList.add('fade-out'); setTimeout(() => t.remove(), 350); }, 2500);
        }
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            if (pageId === 'levelPage') { renderLevelGrid(); updateCoinDisplay(); }
            if (pageId === 'homePage') { updateCoinDisplay(); }
            if (pageId === 'shopPage') { renderShop(); updateCoinDisplay(); }
        }

        // ===== SHOP =====
        let ownedThemes = ['default'], activeTheme = 'default';
        function loadShopData() {
            try {
                const saved = localStorage.getItem('sudokuEmojiShop');
                if (saved) { const data = JSON.parse(saved); ownedThemes = data.ownedThemes || ['default']; activeTheme = data.activeTheme || 'default'; }
            } catch(e) {}
            if (!ownedThemes.includes(activeTheme)) activeTheme = 'default';
        }
        function saveShopData() { localStorage.setItem('sudokuEmojiShop', JSON.stringify({ ownedThemes: ownedThemes, activeTheme: activeTheme })); }
        function applyTheme(themeId) {
            activeTheme = themeId; saveShopData(); document.body.className = '';
            const theme = THEMES.find(t => t.id === themeId);
            if (theme && theme.themeClass) { document.body.classList.add(theme.themeClass); }
            if (theme && theme.file) { document.body.style.backgroundImage = `url('icons/${theme.file}')`; document.body.style.backgroundSize = 'cover'; document.body.style.backgroundPosition = 'center'; }
            else { document.body.style.backgroundImage = ''; document.body.style.backgroundSize = ''; document.body.style.backgroundPosition = ''; }
            if (theme && theme.music) playThemeMusic(theme.music);
            else { if (bgMusic) { bgMusic.pause(); bgMusic = null; } }
        }
        function renderShop() {
            const grid = document.getElementById('shopGrid');
            grid.innerHTML = ''; updateCoinDisplay();
            THEMES.forEach(item => {
                const isOwned = ownedThemes.includes(item.id) || item.id === 'default';
                const isActive = activeTheme === item.id;
                const card = document.createElement('div');
                card.className = `shop-item ${isActive ? 'active-item' : ''}`;
                let previewHtml = item.file ? `<img src="icons/${item.file}" class="shop-item-preview" alt="${item.name}" onerror="this.style.display='none'">` : `<div class="shop-item-preview" style="display:flex;align-items:center;justify-content:center;font-size:2.5rem;background:var(--glass-bg);">🎨</div>`;
                let btnHtml = '';
                if (isActive) btnHtml = `<button class="shop-btn-sm active">✓ فعال</button>`;
                else if (isOwned) btnHtml = `<button class="shop-btn-sm select" onclick="selectTheme('${item.id}')">✨ انتخاب</button>`;
                else { const canAfford = coinCount >= item.price; btnHtml = `<button class="shop-btn-sm ${canAfford ? 'buy' : 'locked'}" ${canAfford ? `onclick="buyTheme('${item.id}')"` : 'disabled'}>${canAfford ? '🛒 خرید' : '🔒 قفل'}</button>`; }
                card.innerHTML = `${previewHtml}<div class="shop-item-name">${item.name}</div><div class="shop-item-price">${item.price > 0 ? `<img src="icons/coin.png" alt="سکه" onerror="this.textContent='coin.png'"> ${item.price}` : '🎁 رایگان'}</div>${btnHtml}`;
                grid.appendChild(card);
            });
        }
        function buyTheme(id) {
            const item = THEMES.find(t => t.id === id);
            if (!item) return;
            if (coinCount < item.price) { showToast('سکه کافی نداری! 😢', 'red'); return; }
            if (ownedThemes.includes(id)) { showToast('این رو قبلاً خریدی!', 'gold'); return; }
            coinCount -= item.price; saveCoins(); ownedThemes.push(id); activeTheme = id; saveShopData(); applyTheme(id); renderShop();
            showToast(`🎉 ${item.name} خریداری شد!`, 'green'); showCelebration(item.name);
        }
        function selectTheme(id) {
            activeTheme = id; saveShopData(); applyTheme(id); renderShop();
            showToast(`✨ ${THEMES.find(t => t.id === id).name} فعال شد!`, 'gold');
        }
        function showCelebration(themeName) {
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay open';
            overlay.innerHTML = `<div class="modal-box"><div class="happy-gamer"><img src="icons/happy gamer.png" alt="تبریک" onerror="this.textContent='🎉'"></div><h3 class="modal-title">🎉 خرید موفق!</h3><div class="modal-text"><strong>${themeName}</strong> خریداری شد!<br>🥳 حالا می‌تونی ازش استفاده کنی!</div><button class="btn btn-gold" onclick="this.closest('.modal-overlay').remove()" style="max-width:200px;margin:0 auto;">🎊 عالی!</button></div>`;
            document.body.appendChild(overlay);
            setTimeout(() => { if (overlay.parentNode) overlay.remove(); }, 4000);
        }

        // ===== EVENTS =====
        document.getElementById('homeStartBtn').onclick = () => showPage('levelPage');
        document.getElementById('homeGuideBtn').onclick = () => showGuide(false);
        document.getElementById('homeShopBtn').onclick = () => showPage('shopPage');
        document.getElementById('levelBackBtn').onclick = () => showPage('homePage');
        document.getElementById('winNextBtn').onclick = () => {
            document.getElementById('winModal').classList.remove('open');
            if (currentLevel < TOTAL_LEVELS - 1) {
                if (globalStats.levelUnlocked[currentLevel + 2]) {
                    currentLevel++; showCountdown(() => { loadLevel(); });
                } else { showToast('🔒 مرحله بعدی قفل است!', 'gold'); showPage('levelPage'); }
            } else { showToast('🎉 همه مراحل رو کامل کردی!', 'gold'); showPage('homePage'); }
        };
        document.getElementById('winRestartBtn').onclick = () => { document.getElementById('winModal').classList.remove('open'); showCountdown(() => { loadLevel(); }); };
        document.getElementById('winHomeBtn').onclick = () => { 
            document.getElementById('winModal').classList.remove('open'); 
            saveCoins(); // ذخیره سکه قبل از خروج
            showPage('homePage'); 
        };
        document.getElementById('checkBtn').onclick = () => {
            let allFilled = true;
            for (let r = 0; r < boardCurrent.length; r++) { for (let c = 0; c < boardCurrent.length; c++) { if (!boardCurrent[r][c]) allFilled = false; } }
            if (allFilled) checkWin();
            else showToast('هن چند تا خونه خالی مونده!', 'blue');
        };

        // ===== INIT =====
        loadGlobalStats(); 
        loadCoins(); // این دیگه سکه رو 0 نمی‌کنه، از localStorage می‌خونه
        loadShopData(); 
        applyTheme(activeTheme); 
        renderLevelGrid(); 
        updateCoinDisplay();
    </script>
</body>
</html>
